<!DOCTYPE html>
<html lang="hi">
<head>
  <link rel="icon" type="image/jpeg" href="SNT.jpg">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SNT Institute - My Full Dashboard</title>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>

  <style>
    :root { --primary: #0f172a; --accent: #38bdf8; --card-bg: #1e293b; --text: #f8fafc; --success: #10b981; --edit-yellow: #facc15; }
    body { font-family: 'Segoe UI', sans-serif; background: var(--primary); color: var(--text); margin: 0; padding: 15px; user-select: none; }
    #u-id, #u-id-top { user-select: text !important; -webkit-user-select: text !important; }
 
    header { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); padding: 15px; border-radius: 20px; display: flex; justify-content: space-between; align-items: center; border: 1px solid rgba(255,255,255,0.1); margin-bottom: 20px; }
    header h1 { font-size: 18px; margin: 0; color: var(--accent); font-weight: 800; text-transform: uppercase; }

    .student-card { background: var(--card-bg); border-radius: 25px; padding: 20px; border: 1px solid rgba(255,255,255,0.05); box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3); }
    .profile-header { display: flex; align-items: center; gap: 15px; margin-bottom: 20px; border-bottom: 1px solid rgba(255,255,255,0.1); padding-bottom: 15px; }
    .profile-img { width: 90px; height: 90px; border-radius: 20px; border: 3px solid var(--accent); object-fit: cover; background: #0f172a; }
    
    .section-label { color: var(--accent); font-size: 11px; font-weight: 800; text-transform: uppercase; margin: 20px 0 10px 0; display: block; letter-spacing: 1.5px; border-left: 3px solid var(--accent); padding-left: 8px; }

    .data-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
    .info-box { background: rgba(15, 23, 42, 0.5); padding: 10px; border-radius: 12px; border: 1px solid rgba(255,255,255,0.05); min-height: 45px; }
    .full-width { grid-column: span 2; }
    .label { font-size: 9px; color: #94a3b8; text-transform: uppercase; font-weight: bold; margin-bottom: 2px; }
    .val { font-size: 13px; font-weight: 600; color: #fff; overflow-wrap: break-word; }

    /* Edit Trigger Text */
    .edit-trigger { color: var(--edit-yellow); font-size: 10px; cursor: pointer; text-decoration: underline; margin-left: 5px; }

    /* Custom Edit Modal Styling */
    #edit-modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.85); z-index:2000; justify-content:center; align-items:center; backdrop-filter: blur(8px); }
    .modal-box { background: white; padding: 25px; border-radius: 20px; width: 90%; max-width: 350px; text-align: center; color: #333; }
    .modal-box h3 { margin: 0 0 15px 0; font-size: 18px; color: var(--primary); }
    .modal-box input { width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 10px; margin-bottom: 15px; box-sizing: border-box; font-size: 14px; }
    
    .btn-action { margin-top: 10px; width: 100%; padding: 12px; border-radius: 12px; border: none; font-weight: 800; cursor: pointer; text-transform: uppercase; font-size: 11px; }
    .btn-save { background: var(--success); color: white; }
    .btn-close { background: #64748b; color: white; }

    #loader { position: fixed; inset: 0; background: var(--primary); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 3000; }
    .spinner { width: 40px; height: 40px; border: 4px solid #334155; border-top-color: var(--accent); border-radius: 50%; animation: spin 1s linear infinite; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body oncontextmenu="return false;">

  <div id="loader"><div class="spinner"></div></div>

  <header>
    <h1>SNT DASHBOARD</h1>
    <button onclick="logout()" style="background:none; border:none; color:#ef4444; font-weight:bold; font-size: 12px;">LOGOUT</button>
  </header>

  <div id="main-content" style="display:none;">
    <div class="student-card">
      <div class="profile-header">
        <img id="u-img" src="SNT.jpg" class="profile-img">
        <div>
          <div id="u-name" style="font-size: 20px; font-weight: 800;">---</div>
          <div id="u-status" style="font-size: 10px; font-weight: bold; margin-top: 5px;">--</div>
          <div id="u-id-top" style="font-size: 11px; color: var(--accent);">ID: --</div>
        </div>
      </div>

      <span class="section-label">Identity Details</span>
      <div class="data-grid">
        <div class="info-box"><div class="label">Father's Name</div><div id="u-father" class="val">--</div></div>
        <div class="info-box"><div class="label">Mother's Name</div><div id="u-mother" class="val">--</div></div>
        <div class="info-box"><div class="label">Gender</div><div id="u-gender" class="val">--</div></div>
        <div class="info-box"><div class="label">Date of Birth</div><div id="u-dob" class="val">--</div></div>
      </div>

      <span class="section-label">Academic & Location</span>
      <div class="data-grid">
        <div class="info-box full-width"><div class="label">Qualification</div><div id="u-edu" class="val">--</div></div>
        <div class="info-box"><div class="label">Passing Year</div><div id="u-pass" class="val">--</div></div>
        <div class="info-box"><div class="label">WhatsApp No.</div><div id="u-phone" class="val">--</div></div>
        <div class="info-box full-width"><div class="label">Full Address</div><div id="u-addr" class="val">--</div></div>
      </div>

      <div style="margin-top: 25px;">
        <button class="btn-action" style="background:var(--accent); color:#000;" onclick="openPaymentModal()">💰 PAY ONLINE FEES</button>
        <button id="rec-btn" class="btn-action" style="background:#334155; color:#fff;">GET ID CARD</button>
      </div>
    </div>
  </div>

  <div id="edit-modal">
    <div class="modal-box">
      <h3 id="modal-title">Update Info</h3>
      <input type="text" id="modal-input">
      <button class="btn-action btn-save" onclick="saveData()">SAVE CHANGES</button>
      <button class="btn-action btn-close" onclick="closeEditModal()">CANCEL</button>
    </div>
  </div>

  <script>
    const firebaseConfig = { 
      apiKey: "AIzaSyAOQtM_XYLqPgxMK1XBdfl0m7KoAseZRCA", 
      authDomain: "snt-computer-institute.firebaseapp.com", 
      databaseURL: "https://snt-computer-institute-default-rtdb.firebaseio.com/", 
      projectId: "snt-computer-institute", 
      appId: "1:117580784781:web:73ba19d2d008beb3a5eec4" 
    };
    
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const auth = firebase.auth();

    let currentStudentKey = null;
    let studentData = null;
    let activeField = "";

    auth.onAuthStateChanged((user) => {
      if (user) { loadMyData(user.email); } 
      else { window.location.href = "index.html"; }
    });

    function loadMyData(email) {
      db.ref('students').orderByChild('email').equalTo(email).on('value', (snap) => {
        if (snap.exists()) {
          currentStudentKey = Object.keys(snap.val())[0];
          studentData = snap.val()[currentStudentKey];

          // Set Static Data
          document.getElementById('u-img').src = studentData.profilePicture || 'SNT.jpg';
          document.getElementById('u-name').innerText = studentData.name || '---';
          document.getElementById('u-id-top').innerText = "ID: " + (studentData.studentId || 'N/A');
          document.getElementById('u-gender').innerText = studentData.gender || 'N/A';
          document.getElementById('u-dob').innerText = studentData.dob || 'N/A';
          document.getElementById('u-phone').innerText = studentData.mobile || '--';

          // Set Editable Data with N/A logic
          handleEditUI('u-father', 'fatherName', 'Father\'s Name');
          handleEditUI('u-mother', 'motherName', 'Mother\'s Name');
          handleEditUI('u-edu', 'lastQualification', 'Qualification');
          handleEditUI('u-pass', 'passingYear', 'Passing Year');
          handleEditUI('u-addr', 'address', 'Address');

          // Status Badge
          const statusEl = document.getElementById('u-status');
          statusEl.innerText = `● STATUS: ${studentData.registrationStatus || 'Pending'}`;
          statusEl.style.color = (studentData.registrationStatus === 'Active') ? '#10b981' : '#ef4444';

          document.getElementById('loader').style.display = 'none';
          document.getElementById('main-content').style.display = 'block';
        }
      });
    }

    // UI Manager for Editable Fields
    function handleEditUI(divId, dbKey, label) {
        const el = document.getElementById(divId);
        const val = studentData[dbKey] || 'N/A';
        
        if (val === 'N/A' || val === '' || val === '---') {
            el.innerHTML = `<span style="color:#94a3b8">N/A</span> <span class="edit-trigger" onclick="openEditModal('${dbKey}', '${label}')">Add ✎</span>`;
        } else {
            el.innerText = val;
        }
    }

    // Modal Control
    function openEditModal(field, label) {
        activeField = field;
        document.getElementById('modal-title').innerText = "Enter " + label;
        document.getElementById('modal-input').value = "";
        document.getElementById('edit-modal').style.display = 'flex';
    }

    function closeEditModal() {
        document.getElementById('edit-modal').style.display = 'none';
    }

    // Final Save Function
    function saveData() {
        const newVal = document.getElementById('modal-input').value.trim();
        if(!newVal) return alert("Please enter a value");

        let updateObj = {};
        updateObj[activeField] = newVal;

        // Specific targeting of the logged-in student's key
        db.ref('students/' + currentStudentKey).update(updateObj).then(() => {
            closeEditModal();
        }).catch(err => alert("Error: " + err.message));
    }

    function logout() { auth.signOut().then(() => window.location.href = "index.html"); }
  </script>
</body>
</html>
