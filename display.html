<!DOCTYPE html>
<html lang="hi">
<head>
  <link rel="icon" type="image/jpeg" href="SNT.jpg">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SNT Institute - My Dashboard</title>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>

  <style>
    :root { --primary: #0f172a; --accent: #38bdf8; --card-bg: #1e293b; --text: #f8fafc; --success: #10b981; }
    body { font-family: 'Segoe UI', sans-serif; background: var(--primary); color: var(--text); margin: 0; padding: 15px; user-select: none; }
    
    header { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); padding: 15px; border-radius: 20px; display: flex; justify-content: space-between; align-items: center; border: 1px solid rgba(255,255,255,0.1); margin-bottom: 20px; }
    header h1 { font-size: 18px; margin: 0; color: var(--accent); font-weight: 800; text-transform: uppercase; }

    .student-card { background: var(--card-bg); border-radius: 25px; padding: 25px; border: 1px solid rgba(255,255,255,0.05); box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.3); }
    .profile-header { display: flex; align-items: center; gap: 15px; margin-bottom: 25px; }
    .profile-img { width: 70px; height: 70px; border-radius: 50%; border: 3px solid var(--accent); object-fit: cover; background: #0f172a; }
    
    .data-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
    .info-box { background: rgba(15, 23, 42, 0.5); padding: 12px; border-radius: 15px; border-left: 4px solid var(--accent); }
    .label { font-size: 10px; color: #94a3b8; text-transform: uppercase; font-weight: bold; }
    .val { font-size: 14px; font-weight: 600; margin-top: 4px; }

    .btn-action { margin-top: 15px; width: 100%; padding: 14px; border-radius: 12px; border: none; background: var(--accent); color: #000; font-weight: 800; cursor: pointer; transition: 0.3s; text-transform: uppercase; font-size: 12px; }
    .btn-pay { background: var(--success); color: white; margin-top: 10px; }

    /* Modal Styling */
    #pay-modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.9); z-index:1000; justify-content:center; align-items:center; backdrop-filter: blur(5px); padding: 20px; }
    .modal-content { background: #fff; color: #333; padding: 20px; border-radius: 20px; width: 100%; max-width: 300px; text-align: center; }
    select, input { width: 100%; padding: 12px; margin: 10px 0; border-radius: 10px; border: 1px solid #ddd; box-sizing: border-box; font-size: 14px; }
    
    #loader { position: fixed; inset: 0; background: var(--primary); display: flex; flex-direction: column; justify-content: center; align-items: center; z-index: 999; }
    .spinner { width: 40px; height: 40px; border: 4px solid #334155; border-top-color: var(--accent); border-radius: 50%; animation: spin 1s linear infinite; margin-bottom: 15px; }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body oncontextmenu="return false;">

  <div id="loader">
    <div class="spinner"></div>
    <div style="font-weight: bold; font-size: 12px; letter-spacing: 2px;">FETCHING PROFILE...</div>
  </div>

  <header>
    <h1>SNT PORTAL</h1>
    <button onclick="logout()" style="background:none; border:none; color:#ef4444; font-weight:bold; cursor:pointer; font-size: 12px;">LOGOUT</button>
  </header>

  <div id="main-content" style="display:none;">
    <div class="student-card">
      <div class="profile-header">
        <img id="u-img" src="SNT.jpg" class="profile-img">
        <div>
          <div id="u-name" style="font-size: 18px; font-weight: 800; letter-spacing: -0.5px;">---</div>
          <div id="u-status" style="font-size: 10px; font-weight: bold; text-transform: uppercase; margin-top: 4px;">Status: --</div>
        </div>
      </div>

      <div class="data-grid">
        <div class="info-box"><div class="label">Roll Number</div><div id="u-id" class="val">--</div></div>
        <div class="info-box"><div class="label">Course</div><div id="u-course" class="val">--</div></div>
        <div class="info-box"><div class="label">Mobile</div><div id="u-phone" class="val">--</div></div>
        <div class="info-box"><div class="label">Rewards</div><div id="u-won" class="val" style="color:#10b981">₹0</div></div>
      </div>

      <button class="btn-action btn-pay" onclick="openPaymentModal()">💰 PAY ONLINE FEES</button>
      <button id="att-btn" class="btn-action">My Attendance Report</button>
      <button id="rec-btn" class="btn-action" style="background:#1e293b; color:#fff; border: 1px solid #334155;">Download Receipt</button>
    </div>
  </div>

  <div id="pay-modal">
    <div class="modal-content">
      <h3 style="margin-top:0">Pay Fees Online</h3>
      <select id="pay-month">
        <option>Admission Fee</option><option>January</option><option>February</option><option>March</option>
        <option>April</option><option>May</option><option>June</option><option>July</option>
        <option>August</option><option>September</option><option>October</option><option>November</option><option>December</option>
      </select>
      <input type="number" id="pay-amount" placeholder="Enter Amount ₹">
      <div id="qrcode-box" style="margin: 15px auto; display:flex; justify-content:center;"></div>
      <p id="qr-status" style="font-size:12px; color:#666;"></p>
      <button id="gen-qr-btn" class="btn-action" style="background: #000; color:#fff;" onclick="generatePayQR()">GENERATE QR</button>
      <button id="conf-pay-btn" class="btn-action" style="background: var(--success); color:#fff; display:none;" onclick="confirmStudentPayment()">I HAVE PAID SUCCESSFULLY</button>
      <button onclick="closeModal()" style="border:none; background:none; color:red; margin-top:15px; cursor:pointer; font-weight:bold;">CANCEL</button>
    </div>
  </div>

  <script>
    const firebaseConfig = { 
      apiKey: "AIzaSyAOQtM_XYLqPgxMK1XBdfl0m7KoAseZRCA", 
      authDomain: "snt-computer-institute.firebaseapp.com", 
      databaseURL: "https://snt-computer-institute-default-rtdb.firebaseio.com/", 
      projectId: "snt-computer-institute", 
      appId: "1:117580784781:web:73ba19d2d008beb3a5eec4" 
    };
    
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const auth = firebase.auth();

    let currentStudentKey = null;
    let studentData = null;

    auth.onAuthStateChanged((user) => {
      if (user) { loadMyData(user.email); } 
      else { window.location.href = "index.html"; }
    });

    function loadMyData(email) {
      db.ref('students').orderByChild('email').equalTo(email).on('value', (snap) => {
        if (snap.exists()) {
          currentStudentKey = Object.keys(snap.val())[0];
          studentData = snap.val()[currentStudentKey];

          // Profile Update
          document.getElementById('u-img').src = studentData.profilePicture || 'SNT.jpg';
          document.getElementById('u-name').innerText = studentData.name || '---';
          document.getElementById('u-id').innerText = studentData.studentId || 'N/A';
          
          // Course Fix (Checks both string and array)
          let courseDisplay = 'N/A';
          if (studentData.courses && Array.isArray(studentData.courses)) {
              courseDisplay = studentData.courses[0];
          } else if (studentData.course) {
              courseDisplay = studentData.course;
          }
          document.getElementById('u-course').innerText = courseDisplay;

          document.getElementById('u-phone').innerText = studentData.mobile || studentData.phone || '--';
          document.getElementById('u-won').innerText = `₹${studentData.wonCash || 0}`;

          const statusEl = document.getElementById('u-status');
          statusEl.innerText = `Status: ${studentData.registrationStatus || 'Active'}`;
          statusEl.style.color = studentData.registrationStatus === 'Pending' ? '#ef4444' : '#10b981';

          // Buttons
          document.getElementById('att-btn').onclick = () => {
            window.location.href = `https://harshitkaushal9129-bit.github.io/snt-institute/calendar.html?id=${currentStudentKey}`;
          };
          document.getElementById('rec-btn').onclick = () => {
            window.location.href = `https://harshitkaushal9129-bit.github.io/snt-institute/receipt.html?search=${encodeURIComponent(studentData.name)}`;
          };

          document.getElementById('loader').style.display = 'none';
          document.getElementById('main-content').style.display = 'block';
        } else {
          alert("Error: Data not found in database.");
          logout();
        }
      });
    }

    // Payment Logic
    function openPaymentModal() {
      document.getElementById('pay-modal').style.display = 'flex';
      document.getElementById('qrcode-box').innerHTML = "";
      document.getElementById('qr-status').innerText = "";
      document.getElementById('conf-pay-btn').style.display = 'none';
      document.getElementById('gen-qr-btn').style.display = 'block';
    }

    function generatePayQR() {
      const amt = document.getElementById('pay-amount').value;
      const month = document.getElementById('pay-month').value;
      if(!amt || amt < 1) return alert("Please enter valid amount");

      document.getElementById('qrcode-box').innerHTML = "";
      new QRCode(document.getElementById('qrcode-box'), {
        text: `upi://pay?pa=9580807075@ybl&pn=Sandeep%20Kumar&am=${amt}&cu=INR`,
        width: 160, height: 160
      });

      document.getElementById('qr-status').innerText = `Paying ₹${amt} for ${month}`;
      document.getElementById('gen-qr-btn').style.display = 'none';
      document.getElementById('conf-pay-btn').style.display = 'block';
    }

    function confirmStudentPayment() {
      const amt = document.getElementById('pay-amount').value;
      const month = document.getElementById('pay-month').value;

      if(!studentData.paymentHistory) studentData.paymentHistory = [];
      
      studentData.paymentHistory.push({
        month: month,
        amount: amt,
        date: new Date().toLocaleDateString()
      });

      let updateData = { paymentHistory: studentData.paymentHistory };
      if(month === "Admission Fee") updateData.registrationStatus = "Paid";

      db.ref('students/' + currentStudentKey).update(updateData).then(() => {
        alert("Success! Your payment record is updated. Please show the transaction screenshot to the admin.");
        closeModal();
      });
    }

    function closeModal() { document.getElementById('pay-modal').style.display = 'none'; }
    function logout() { auth.signOut().then(() => window.location.href = "index.html"); }

    // Key Protection
    document.onkeydown = e => { 
        if (e.keyCode == 123 || (e.ctrlKey && e.shiftKey && (e.keyCode == 73 || e.keyCode == 74 || e.keyCode == 67)) || (e.ctrlKey && e.keyCode == 85)) return false; 
    };
  </script>
</body>
</html>
