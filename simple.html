<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Practical Module System</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f0f2f5; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; }
        .hidden { display: none; }
        .card { background: white; padding: 30px; border-radius: 15px; box-shadow: 0 10px 20px rgba(0,0,0,0.1); width: 400px; text-align: center; }
        
        /* Module Buttons */
        .mod-btn { background: #1a73e8; color: white; padding: 20px; margin: 10px; border: none; border-radius: 10px; cursor: pointer; font-size: 18px; width: 120px; transition: 0.2s; }
        .mod-btn:hover { background: #1557b0; transform: scale(1.05); }

        /* MCQ Style Options */
        .option-btn { display: block; width: 100%; padding: 12px; margin: 10px 0; border: 2px solid #ddd; border-radius: 8px; cursor: pointer; text-align: left; background: white; font-size: 15px; }
        .option-btn:hover { border-color: #1a73e8; background: #f8fbff; }
        .option-btn.correct { background: #d4edda; border-color: #28a745; }
        .option-btn.wrong { background: #f8d7da; border-color: #dc3545; }

        input { width: 80%; padding: 12px; margin-bottom: 20px; border: 1px solid #ccc; border-radius: 5px; }
        .btn-next { background: #34a853; color: white; padding: 10px 25px; border: none; border-radius: 5px; cursor: pointer; margin-top: 15px; }
    </style>
</head>
<body>

    <div id="login-box" class="card">
        <h2>Student Login</h2>
        <input type="text" id="stuName" placeholder="Enter Your Name">
        <button class="btn-next" onclick="showModules()">Enter Portal</button>
    </div>

    <div id="module-box" class="card hidden">
        <h2 id="welcome-msg"></h2>
        <p>Select Your Practical Module:</p>
        <div style="display: flex; flex-wrap: wrap; justify-content: center;">
            <button class="mod-btn" onclick="startQuiz('M1')">M1</button>
            <button class="mod-btn" onclick="startQuiz('M2')">M2</button>
            <button class="mod-btn" onclick="startQuiz('M3')">M3</button>
            <button class="mod-btn" onclick="startQuiz('M4')">M4</button>
        </div>
    </div>

    <div id="quiz-box" class="card hidden">
        <div style="display: flex; justify-content: space-between; font-size: 13px; color: #666;">
            <span id="mod-label"></span>
            <span id="q-count"></span>
        </div>
        <h3 id="question-text" style="margin: 20px 0;"></h3>
        <div id="options-container"></div>
        <button id="next-btn" class="btn-next hidden" onclick="nextQuestion()">Next Question</button>
    </div>

    <div id="result-box" class="card hidden">
        <h2 id="res-title">Final Result</h2>
        <div style="font-size: 40px; font-weight: bold; margin: 20px 0;" id="score-text">0/3</div>
        <p id="grade-text" style="font-size: 20px; color: #1a73e8;"></p>
        <button class="btn-next" onclick="location.reload()">Try Another Module</button>
    </div>

    <script>
        let currentMod = "";
        let qIdx = 0;
        let score = 0;

        const data = {
            M1: [
                { q: "Which shortcut key is used for 'Save As' in LibreOffice?", o: ["Ctrl+S", "Ctrl+Shift+S", "F12", "Ctrl+A"], a: 1 },
                { q: "What is the maximum zoom percentage in Calc?", o: ["400%", "500%", "600%", "300%"], a: 0 },
                { q: "Which of these is a valid cell address?", o: ["1A", "A1", "$A$1", "Both B & C"], a: 3 }
            ],
            M2: [
                { q: "Which tag is used to create a hyperlink?", o: ["<link>", "<a>", "<href>", "<url>"], a: 1 },
                { q: "What is the correct HTML for adding a background color?", o: ["<body bg='yellow'>", "<background>yellow</background>", "<body style='background-color:yellow;'>", "None"], a: 2 },
                { q: "Choose the correct HTML tag for the largest heading:", o: ["<head>", "<h6>", "<h1>", "<heading>"], a: 2 }
            ],
            M3: [
                { q: "Which keyword is used for function in Python?", o: ["func", "define", "def", "function"], a: 2 },
                { q: "What is the output of 2**3?", o: ["6", "8", "9", "5"], a: 1 },
                { q: "Which data type is used to store multiple items in one variable?", o: ["List", "Tuple", "Dictionary", "All of these"], a: 3 }
            ],
            M4: [
                { q: "Which function runs once in Arduino code?", o: ["void loop()", "void setup()", "void start()", "void main()"], a: 1 },
                { q: "What is the full form of IoT?", o: ["Internet of Tools", "Internet of Technology", "Internet of Things", "Input Output Tech"], a: 2 },
                { q: "Which pin is used for Analog signals?", o: ["D0", "A0", "VCC", "GND"], a: 1 }
            ]
        };

        function showModules() {
            let name = document.getElementById('stuName').value;
            if(!name) return alert("Please enter name!");
            document.getElementById('login-box').classList.add('hidden');
            document.getElementById('module-box').classList.remove('hidden');
            document.getElementById('welcome-msg').innerText = "Hello, " + name;
        }

        function startQuiz(mod) {
            currentMod = mod;
            qIdx = 0;
            score = 0;
            document.getElementById('module-box').classList.add('hidden');
            document.getElementById('quiz-box').classList.remove('hidden');
            document.getElementById('mod-label').innerText = "Module: " + mod;
            loadQuestion();
        }

        function loadQuestion() {
            let qData = data[currentMod][qIdx];
            document.getElementById('q-count').innerText = `Question ${qIdx + 1}/3`;
            document.getElementById('question-text').innerText = qData.q;
            document.getElementById('next-btn').classList.add('hidden');
            
            let html = "";
            qData.o.forEach((opt, i) => {
                html += `<button class="option-btn" onclick="checkAns(this, ${i})">${opt}</button>`;
            });
            document.getElementById('options-container').innerHTML = html;
        }

        function checkAns(btn, idx) {
            let correctIdx = data[currentMod][qIdx].a;
            let allBtns = document.querySelectorAll('.option-btn');
            
            allBtns.forEach(b => b.style.pointerEvents = "none"); // Disable buttons

            if(idx === correctIdx) {
                btn.classList.add('correct');
                score++;
            } else {
                btn.classList.add('wrong');
                allBtns[correctIdx].classList.add('correct');
            }
            document.getElementById('next-btn').classList.remove('hidden');
        }

        function nextQuestion() {
            qIdx++;
            if(qIdx < 3) loadQuestion();
            else showFinalResult();
        }

        function showFinalResult() {
            document.getElementById('quiz-box').classList.add('hidden');
            document.getElementById('result-box').classList.remove('hidden');
            document.getElementById('score-text').innerText = `${score}/3`;
            
            let grade = score === 3 ? "Excellent! S Grade" : score === 2 ? "Good! B Grade" : "Needs Practice! F Grade";
            document.getElementById('grade-text').innerText = grade;
        }
    </script>
</body>
</html>
