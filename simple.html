<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NIELIT 4-Module Practical Portal</title>
    <style>
        :root { --nielit-blue: #003366; --nielit-orange: #ff6600; --bg: #f4f7f6; }
        body, html { margin: 0; padding: 0; font-family: 'Segoe UI', sans-serif; height: 100%; background: var(--bg); }
        .hidden { display: none !important; }

        /* Login */
        #login-page { height: 100vh; display: flex; justify-content: center; align-items: center; background: var(--nielit-blue); }
        .login-box { background: white; padding: 40px; border-radius: 10px; text-align: center; width: 320px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); }

        /* Dashboard */
        #dashboard { padding: 40px; text-align: center; }
        .module-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; max-width: 800px; margin: 30px auto; }
        .mod-card { background: white; padding: 30px; border-radius: 8px; cursor: pointer; border-bottom: 5px solid var(--nielit-blue); box-shadow: 0 4px 6px rgba(0,0,0,0.1); transition: 0.3s; }
        .mod-card:hover { transform: translateY(-5px); background: #fffbf0; }

        /* Exam Layout */
        #exam-portal { display: grid; grid-template-rows: 60px 1fr 50px; height: 100vh; background: white; }
        header { background: var(--nielit-blue); color: white; display: flex; justify-content: space-between; align-items: center; padding: 0 20px; }
        .main-container { display: grid; grid-template-columns: 350px 1fr 150px; background: #ddd; gap: 2px; overflow: hidden; }
        .panel { background: white; padding: 20px; overflow-y: auto; }
        textarea { width: 100%; height: 90%; background: #1e1e1e; color: #00ff00; font-family: 'Consolas', monospace; font-size: 16px; padding: 15px; border: none; outline: none; resize: none; }

        /* Buttons */
        .q-btn { width: 40px; height: 40px; margin: 5px; cursor: pointer; border: 1px solid #999; border-radius: 5px; background: white; }
        .q-btn.active { background: var(--nielit-orange); color: white; border: none; }
        .btn-submit { background: #28a745; color: white; padding: 8px 20px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        
        /* Result */
        #result-page { height: 100vh; display: flex; justify-content: center; align-items: center; }
        .result-box { text-align: center; border: 3px solid var(--nielit-blue); padding: 40px; border-radius: 15px; background: #fff; width: 400px; }
    </style>
</head>
<body>

    <div id="login-page">
        <div class="login-box">
            <h2 style="color:var(--nielit-blue)">NIELIT EXAM</h2>
            <input type="text" id="userName" placeholder="Enter Student Name" style="width:90%; padding:10px; margin-bottom:20px;">
            <button onclick="login()" style="width:100%; padding:10px; background:var(--nielit-orange); color:white; border:none; border-radius:5px; cursor:pointer;">SUBMIT</button>
        </div>
    </div>

    <div id="dashboard" class="hidden">
        <h2 id="greet"></h2>
        <p>Select a Module to start 3-Question Practical Exam:</p>
        <div class="module-grid">
            <div class="mod-card" onclick="initExam('M1')"><h3>M1-R5</h3><p>IT Tools</p></div>
            <div class="mod-card" onclick="initExam('M2')"><h3>M2-R5</h3><p>Web Designing</p></div>
            <div class="mod-card" onclick="initExam('M3')"><h3>M3-R5</h3><p>Python</p></div>
            <div class="mod-card" onclick="initExam('M4')"><h3>M4-R5</h3><p>IoT</p></div>
        </div>
    </div>

    <div id="exam-portal" class="hidden">
        <header>
            <div id="mod-title">Module</div>
            <div id="timer">Time Remaining: 30:00</div>
            <button class="btn-submit" onclick="finishExam()">FINISH EXAM</button>
        </header>
        <div class="main-container">
            <div class="panel">
                <h4 id="q-label">Question 1</h4>
                <p id="q-text" style="line-height:1.6;"></p>
            </div>
            <div style="background:#1e1e1e;">
                <textarea id="editor" oninput="saveAns()" spellcheck="false"></textarea>
            </div>
            <div class="panel" style="text-align:center;">
                <h4>Palette</h4>
                <button class="q-btn active" id="b0" onclick="switchQ(0)">1</button>
                <button class="q-btn" id="b1" onclick="switchQ(1)">2</button>
                <button class="q-btn" id="b2" onclick="switchQ(2)">3</button>
            </div>
        </div>
    </div>

    <div id="result-page" class="hidden">
        <div class="result-box">
            <h2 id="res-module-name"></h2>
            <p id="res-student-name"></p>
            <hr>
            <div id="res-score" style="font-size: 24px; margin: 20px 0;">Score: 0</div>
            <div id="res-grade" style="font-size: 30px; font-weight:bold; color:var(--nielit-blue);">Grade: F</div>
            <br>
            <button onclick="location.reload()" style="padding:10px 20px; cursor:pointer;">Logout / Restart</button>
        </div>
    </div>

    <script>
        let studentName = "";
        let currentModule = "";
        let currentQIdx = 0;
        let activeQuestions = [];

        const questionsBank = {
            "M1": [
                { q: "Create a Table in Writer with 3 columns and 4 rows.", keys: ["table", "column", "row"] },
                { q: "Write steps to insert a Watermark in a document.", keys: ["insert", "watermark", "page"] },
                { q: "Formula to find the Sum of cells A1 to A10 in Calc.", keys: ["=sum(", "a1:a10", ")"] }
            ],
            "M2": [
                { q: "Create an HTML table with border 1.", keys: ["<table", "border=", "</table>"] },
                { q: "Design a red background button in CSS.", keys: ["background-color:", "red", "button"] },
                { q: "Create an Ordered List of 3 colors.", keys: ["<ol>", "<li>", "</ol>"] }
            ],
            "M3": [
                { q: "Python program to print 'Hello World'.", keys: ["print(", "hello world", ")"] },
                { q: "Program to check if a number is Even or Odd.", keys: ["if", "%", "==", "else"] },
                { q: "Create a list in Python with 3 items.", keys: ["[", ",", "]"] }
            ],
            "M4": [
                { q: "Code to blink LED connected to Pin 13 in Arduino.", keys: ["pinmode", "13", "output", "digitalwrite"] },
                { q: "Read value from Analog Pin A0.", keys: ["analogread", "a0"] },
                { q: "Syntax to start Serial Monitor at 9600 baud rate.", keys: ["serial.begin", "9600"] }
            ]
        };

        function login() {
            studentName = document.getElementById('userName').value;
            if(!studentName) return alert("Enter Name!");
            document.getElementById('login-page').classList.add('hidden');
            document.getElementById('dashboard').classList.remove('hidden');
            document.getElementById('greet').innerText = "Welcome, " + studentName;
        }

        function initExam(mod) {
            currentModule = mod;
            activeQuestions = questionsBank[mod].map(q => ({ ...q, userAns: "" }));
            document.getElementById('dashboard').classList.add('hidden');
            document.getElementById('exam-portal').classList.remove('hidden');
            document.getElementById('mod-title').innerText = "Module: " + mod;
            switchQ(0);
        }

        function switchQ(idx) {
            document.getElementById(`b${currentQIdx}`).classList.remove('active');
            currentQIdx = idx;
            document.getElementById(`b${idx}`).classList.add('active');
            document.getElementById('q-label').innerText = "Question " + (idx + 1);
            document.getElementById('q-text').innerText = activeQuestions[idx].q;
            document.getElementById('editor').value = activeQuestions[idx].userAns;
        }

        function saveAns() {
            activeQuestions[currentQIdx].userAns = document.getElementById('editor').value;
        }

        function finishExam() {
            let totalScore = 0;
            activeQuestions.forEach(item => {
                let matchCount = 0;
                let code = item.userAns.toLowerCase();
                item.keys.forEach(k => { if(code.includes(k)) matchCount++; });
                
                if(matchCount === item.keys.length && code.length > 5) totalScore += 33.33;
                else if (matchCount > 0) totalScore += (matchCount / item.keys.length) * 20; 
            });

            showResult(Math.round(totalScore));
        }

        function showResult(score) {
            document.getElementById('exam-portal').classList.add('hidden');
            document.getElementById('result-page').classList.remove('hidden');
            
            let grade = "F";
            if(score >= 85) grade = "S";
            else if(score >= 75) grade = "A";
            else if(score >= 65) grade = "B";
            else if(score >= 50) grade = "C";

            document.getElementById('res-module-name').innerText = "Module: " + currentModule;
            document.getElementById('res-student-name').innerText = "Student: " + studentName;
            document.getElementById('res-score').innerText = "Final Score: " + score + "/100";
            document.getElementById('res-grade').innerText = "Grade: " + grade;
            document.getElementById('res-grade').style.color = (score >= 50) ? "green" : "red";
        }
    </script>
</body>
</html>
