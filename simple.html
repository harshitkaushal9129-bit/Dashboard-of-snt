<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NIELIT Official Practical Exam 2026</title>
    <style>
        :root { --nielit-blue: #3b5998; --green: #68bd45; --red: #e74c3c; --terminal-black: #1e1e1e; }
        body, html { margin: 0; padding: 0; font-family: 'Segoe UI', Arial; height: 100%; background: #f4f7f9; overflow: hidden; }
        .hidden { display: none !important; }

        /* --- LOGIN SCREEN --- */
        #login-screen { height: 100vh; display: flex; justify-content: center; align-items: center; background: #e9ecef; }
        .login-box { background: white; padding: 40px; border-radius: 8px; box-shadow: 0 10px 30px rgba(0,0,0,0.15); width: 400px; text-align: center; border-top: 8px solid var(--nielit-blue); }
        .login-box select, .login-box input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; font-size: 15px; }

        /* --- EXAM INTERFACE --- */
        header { display: flex; justify-content: space-between; align-items: center; padding: 5px 20px; background: white; border-bottom: 1px solid #ddd; height: 50px; }
        .main-container { display: flex; height: calc(100vh - 110px); }
        .q-sidebar { width: 25%; background: white; padding: 20px; border-right: 2px solid #ddd; overflow-y: auto; }
        .editor-container { width: 75%; display: flex; flex-direction: column; position: relative; }
        
        /* --- EDITOR & TERMINAL --- */
        .editor-tools { padding: 10px; background: #eee; border-bottom: 1px solid #ccc; display: flex; gap: 10px; }
        textarea { flex: 1; padding: 15px; font-family: 'Consolas', monospace; font-size: 16px; border: none; outline: none; background: #fff; }
        .terminal { background: var(--terminal-black); color: #fff; padding: 15px; font-family: 'Consolas', monospace; font-size: 13px; height: 150px; border-top: 4px solid #444; overflow-y: auto; }
        
        /* --- FOOTER --- */
        footer { height: 60px; background: white; border-top: 1px solid #ddd; display: flex; justify-content: space-between; align-items: center; padding: 0 20px; }
        .btn { padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn-blue { background: var(--nielit-blue); color: white; }
        .btn-green { background: var(--green); color: white; }
        .btn-red { background: var(--red); color: white; }

        /* --- PALETTE --- */
        .p-box { display: inline-block; width: 35px; height: 35px; border: 1px solid #999; margin: 5px; line-height: 35px; text-align: center; cursor: pointer; }
        .done { background: #b8d1f3; }
        .active { border: 2px solid var(--nielit-blue); font-weight: bold; }
    </style>
</head>
<body>

    <div id="login-screen">
        <div class="login-box">
            <img src="https://www.nielit.gov.in/sites/all/themes/nielit/logo.png" width="180">
            <h3>PRACTICAL EXAMINATION</h3>
            <input type="text" id="stuName" placeholder="Enter Full Name">
            <select id="moduleSelect">
                <option value="M2">M2-R5: Web Designing</option>
                <option value="M3">M3-R5: Python Programming</option>
                <option value="M4">M4-R5: Internet of Things (IoT)</option>
            </select>
            <button class="btn btn-blue" style="width:100%" onclick="startExam()">START EXAMINATION</button>
        </div>
    </div>

    <div id="exam-screen" class="hidden">
        <header>
            <b id="mod-header">NIELIT - PR</b>
            <div style="font-size: 18px; color: var(--red); font-weight: bold;" id="timer">45:00</div>
            <div id="user-info">User: <b>Guest</b></div>
        </header>

        <div class="main-container">
            <div class="q-sidebar">
                <h4 id="q-title">Question 1</h4>
                <p id="q-desc"></p>
                <hr>
                <b>Question Palette:</b><br>
                <div id="palette-container">
                    <div class="p-box active" onclick="jumpTo(0)" id="p0">1</div>
                    <div class="p-box" onclick="jumpTo(1)" id="p1">2</div>
                    <div class="p-box" onclick="jumpTo(2)" id="p2">3</div>
                </div>
            </div>

            <div class="editor-container">
                <div class="editor-tools">
                    <button class="btn btn-blue" onclick="compileCode()">Compile & Run</button>
                    <button class="btn btn-green" onclick="saveAnswer()">Save Response</button>
                </div>
                <textarea id="code-editor" spellcheck="false" placeholder="Write code here..."></textarea>
                <div class="terminal" id="terminal">Terminal ready... Waiting for Compilation.</div>
            </div>
        </div>

        <footer>
            <button class="btn btn-blue" onclick="prevQ()">Previous</button>
            <button class="btn btn-blue" onclick="nextQ()">Next</button>
            <button class="btn btn-red" onclick="finishExam()">SUBMIT MODULE TEST</button>
        </footer>
    </div>

    <div id="result-screen" class="hidden" style="height:100vh; display:flex; flex-direction:column; justify-content:center; align-items:center; background:white;">
        <h1 style="color:var(--nielit-blue)">FINAL RESULT CARD</h1>
        <div style="border:2px solid #ddd; padding:40px; border-radius:10px; text-align:center; min-width:400px;">
            <h2 id="res-name"></h2>
            <p id="res-module"></p>
            <div style="font-size: 50px; font-weight: bold; margin: 20px 0;" id="res-score">0/100</div>
            <h3 id="res-grade" style="color:var(--green)"></h3>
            <button class="btn btn-blue" onclick="location.reload()">EXIT PORTAL</button>
        </div>
    </div>

    <script>
        const bank = {
            M2: [
                { q: "Create an HTML Table with 2 rows and border 5px.", k: ["<table", "border=\"5\"", "<tr>"], code: "" },
                { q: "CSS code to change background to yellow and text to red.", k: ["background-color: yellow", "color: red"], code: "" },
                { q: "Create an Anchor tag linking to nielit.gov.in.", k: ["<a", "href", "nielit.gov.in"], code: "" }
            ],
            M3: [
                { q: "Write a Python function to check even or odd.", k: ["def", "if", "%", "=="], code: "" },
                { q: "Python code to print numbers from 1 to 10 using while loop.", k: ["while", "print", "<="], code: "" },
                { q: "Create a list in Python and append 'NIELIT' to it.", k: ["list", "append(", "'NIELIT'"], code: "" }
            ],
            M4: [
                { q: "Arduino code to initialize Pin 13 as OUTPUT.", k: ["pinMode", "13", "OUTPUT"], code: "" },
                { q: "Read analog value from Pin A0 and store in variable 'val'.", k: ["analogRead", "A0", "val"], code: "" },
                { q: "Write Arduino code for a 500ms delay.", k: ["delay", "500"], code: "" }
            ]
        };

        let currentModule = "M2";
        let qIdx = 0;
        let score = 0;

        function startExam() {
            let name = document.getElementById('stuName').value;
            if(!name) return alert("Please enter name!");
            currentModule = document.getElementById('moduleSelect').value;
            
            document.getElementById('login-screen').classList.add('hidden');
            document.getElementById('exam-screen').classList.remove('hidden');
            document.getElementById('user-info').innerHTML = `User: <b>${name}</b>`;
            document.getElementById('mod-header').innerText = `NIELIT - ${currentModule}-R5 Practical`;
            
            loadQuestion();
            startTimer();
        }

        function loadQuestion() {
            let q = bank[currentModule][qIdx];
            document.getElementById('q-title').innerText = "Question " + (qIdx + 1);
            document.getElementById('q-desc').innerText = q.q;
            document.getElementById('code-editor').value = q.code;
            
            document.querySelectorAll('.p-box').forEach(b => b.classList.remove('active'));
            document.getElementById('p' + qIdx).classList.add('active');
            document.getElementById('terminal').innerHTML = "Terminal ready...";
        }

        function compileCode() {
            let code = document.getElementById('code-editor').value;
            let keys = bank[currentModule][qIdx].k;
            let term = document.getElementById('terminal');
            
            let missing = keys.filter(k => !code.toLowerCase().includes(k.toLowerCase()));
            
            if(code.length < 10 || missing.length > 0) {
                term.innerHTML = `<span style="color:var(--red)">[ERROR] Compilation Failed!</span><br>Missing Logic/Syntax near: ${missing[0] || 'Incomplete code'}.<br>Check your tags/syntax carefully.`;
            } else {
                term.innerHTML = `<span style="color:var(--green)">[SUCCESS] Compiled successfully!</span><br>Execution finished without errors.<br>Memory used: 124KB.`;
            }
        }

        function saveAnswer() {
            bank[currentModule][qIdx].code = document.getElementById('code-editor').value;
            document.getElementById('p' + qIdx).classList.add('done');
            alert("Response Saved!");
        }

        function jumpTo(i) { qIdx = i; loadQuestion(); }
        function nextQ() { if(qIdx < 2) { qIdx++; loadQuestion(); } }
        function prevQ() { if(qIdx > 0) { qIdx--; loadQuestion(); } }

        function finishExam() {
            if(!confirm("Are you sure? All 3 questions will be submitted.")) return;
            
            let finalPoints = 0;
            bank[currentModule].forEach(q => {
                let matchCount = q.k.filter(k => q.code.toLowerCase().includes(k.toLowerCase())).length;
                if(matchCount === q.k.length && q.code.length > 10) finalPoints += 33.33;
            });

            let total = Math.round(finalPoints);
            document.getElementById('exam-screen').classList.add('hidden');
            document.getElementById('result-screen').classList.remove('hidden');
            document.getElementById('res-name').innerText = "Name: " + document.getElementById('stuName').value;
            document.getElementById('res-module').innerText = "Module: " + currentModule;
            document.getElementById('res-score').innerText = total + "/100";
            document.getElementById('res-grade').innerText = total >= 50 ? "RESULT: PASS (PROVISIONAL)" : "RESULT: FAIL";
        }

        function startTimer() {
            let t = 2700;
            setInterval(() => {
                t--;
                let m = Math.floor(t / 60);
                let s = t % 60;
                document.getElementById('timer').innerText = `${m}:${s < 10 ? '0'+s : s}`;
            }, 1000);
        }
    </script>
</body>
</html>
