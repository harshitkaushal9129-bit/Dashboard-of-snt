<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>NIELIT Official Practical Portal - 2026</title>
    <style>
        :root { --blue: #3b5998; --green: #68bd45; --red: #e74c3c; --gray: #f4f7f9; }
        body, html { margin: 0; padding: 0; font-family: 'Segoe UI', Arial; height: 100%; background: var(--gray); overflow: hidden; }
        .hidden { display: none !important; }

        /* --- LOGIN PAGE --- */
        #login-page { height: 100vh; display: flex; justify-content: center; align-items: center; background: #e9ecef; }
        .login-box { background: white; padding: 40px; border-radius: 8px; box-shadow: 0 5px 20px rgba(0,0,0,0.2); width: 380px; text-align: center; border-top: 8px solid var(--blue); }
        .login-box input { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ccc; border-radius: 4px; }

        /* --- EXAM INTERFACE --- */
        header { display: flex; justify-content: space-between; align-items: center; padding: 5px 20px; background: white; border-bottom: 1px solid #ddd; height: 50px; }
        .timer { font-weight: bold; color: var(--red); font-size: 18px; }

        .main-container { display: flex; height: calc(100vh - 110px); }
        .q-sidebar { width: 25%; background: white; padding: 20px; border-right: 2px solid #ddd; overflow-y: auto; }
        .editor-container { width: 75%; display: flex; flex-direction: column; position: relative; background: white; }
        
        .editor-header { padding: 10px; background: #eee; display: flex; gap: 10px; align-items: center; }
        textarea { flex: 1; padding: 15px; font-family: 'Consolas', monospace; font-size: 15px; border: none; outline: none; background: #fafafa; }

        /* --- COMPILER BOX --- */
        .terminal { position: absolute; bottom: 0; width: 100%; background: #1e1e1e; color: #ddd; padding: 10px; font-size: 13px; height: 120px; overflow-y: auto; border-top: 3px solid #444; }
        .err-text { color: #ff5f56; }
        .success-text { color: #27c93f; }

        /* --- RESULT PAGE --- */
        #result-page { height: 100vh; display: flex; justify-content: center; align-items: center; background: white; flex-direction: column; }
        .score-card { border: 2px solid var(--blue); padding: 50px; border-radius: 10px; text-align: center; }

        footer { height: 60px; background: white; border-top: 1px solid #ddd; display: flex; justify-content: space-between; align-items: center; padding: 0 20px; }
        .btn { padding: 10px 20px; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        .btn-blue { background: var(--blue); color: white; }
        .btn-green { background: var(--green); color: white; }
        .btn-red { background: var(--red); color: white; }
    </style>
</head>
<body>

    <div id="login-page">
        <div class="login-box">
            <img src="https://www.nielit.gov.in/sites/all/themes/nielit/logo.png" width="150">
            <h3>CANDIDATE LOGIN</h3>
            <input type="text" id="uname" placeholder="Roll Number / Name">
            <input type="password" placeholder="Password">
            <button class="btn btn-blue" style="width:100%" onclick="startExam()">LOGIN TO EXAM</button>
        </div>
    </div>

    <div id="exam-page" class="hidden">
        <header>
            <b>NIELIT PRACTICAL PORTAL</b>
            <div class="timer" id="clock">45:00</div>
            <div>User: <b id="display-name">Guest</b></div>
        </header>

        <div class="main-container">
            <div class="q-sidebar">
                <h4 id="q-title">Question 1</h4>
                <p id="q-desc">Write an Arduino code to blink LED on Pin 13.</p>
                <hr>
                <div id="palette">
                    <b>Question Palette:</b><br><br>
                    <button onclick="loadQ(0)">1</button>
                    <button onclick="loadQ(1)">2</button>
                    <button onclick="loadQ(2)">3</button>
                </div>
            </div>

            <div class="editor-container">
                <div class="editor-header">
                    <b id="lang-label">Arduino (C++)</b>
                    <button class="btn btn-blue" onclick="runCompiler()">Compile & Run</button>
                    <button class="btn btn-green" onclick="saveResp()">Save Response</button>
                </div>
                <textarea id="editor" spellcheck="false"></textarea>
                <div class="terminal" id="console">
                    Welcome to NIELIT Compiler Terminal... Ready for input.
                </div>
            </div>
        </div>

        <footer>
            <button class="btn btn-blue" onclick="prevQ()">Previous</button>
            <button class="btn btn-blue" onclick="nextQ()">Next</button>
            <button class="btn btn-red" onclick="finishExam()">FINISH & SUBMIT TEST</button>
        </footer>
    </div>

    <div id="result-page" class="hidden">
        <div class="score-card">
            <h1 style="color:var(--blue)">EXAM COMPLETED</h1>
            <p>Name: <b id="res-name"></b></p>
            <p>Total Marks: 80 / 80</p>
            <h2 style="color:var(--green)">STATUS: PASS (PROVISIONAL)</h2>
            <button class="btn btn-blue" onclick="location.reload()">EXIT</button>
        </div>
    </div>

    <script>
        const questions = [
            { title: "Question 1 (Arduino)", desc: "Blink an LED on Pin 13 with 1s delay.", lang: "Arduino", code: "void setup() {\n  pinMode(13, OUTPUT);\n}\nvoid loop() {\n  digitalWrite(13, HIGH);\n  delay(1000);\n}", keyword: "pinMode" },
            { title: "Question 2 (Python)", desc: "Write a program to find Factorial of a number.", lang: "Python", code: "def factorial(n):\n    return 1 if n==0 else n * factorial(n-1)", keyword: "def" },
            { title: "Question 3 (C Language)", desc: "Swap two numbers without using third variable.", lang: "C", code: "a = a + b;\nb = a - b;\na = a - b;", keyword: "a =" }
        ];

        let currentQ = 0;
        let timeLeft = 2700;

        function startExam() {
            let name = document.getElementById('uname').value;
            if(!name) return alert("Pehle Login Details bhariye!");
            document.getElementById('display-name').innerText = name.toUpperCase();
            document.getElementById('login-page').classList.add('hidden');
            document.getElementById('exam-page').classList.remove('hidden');
            loadQ(0);
            startTimer();
        }

        function loadQ(index) {
            currentQ = index;
            document.getElementById('q-title').innerText = questions[index].title;
            document.getElementById('q-desc').innerText = questions[index].desc;
            document.getElementById('lang-label').innerText = questions[index].lang;
            document.getElementById('editor').value = questions[index].code;
            document.getElementById('console').innerHTML = "Terminal cleared. Ready to compile Question " + (index+1);
        }

        function runCompiler() {
            let code = document.getElementById('editor').value;
            let consoleBox = document.getElementById('console');
            
            // LOGIC CHECKER (Strict Validation)
            if (code.includes(';') || code.includes('def') || code.includes('void')) {
                if (code.length < 20 || !code.includes(questions[currentQ].keyword)) {
                    consoleBox.innerHTML = `<span class="err-text">Compilation Error: Syntax Error at line 4. Expected logic is missing. Check your logic again!</span>`;
                } else {
                    consoleBox.innerHTML = `<span class="success-text">✔ Compilation Successful!</span><br>Execution Time: 0.002s<br>Memory Used: 924 bytes.`;
                }
            } else {
                consoleBox.innerHTML = `<span class="err-text">FATAL ERROR: Semicolon or Bracket missing. Program terminated unexpectedly.</span>`;
            }
        }

        function saveResp() {
            alert("Response Saved! Palette color changed to Blue.");
        }

        function startTimer() {
            setInterval(() => {
                timeLeft--;
                let m = Math.floor(timeLeft / 60);
                let s = timeLeft % 60;
                document.getElementById('clock').innerText = `${m}:${s < 10 ? '0'+s : s}`;
            }, 1000);
        }

        function finishExam() {
            if(confirm("Are you sure? Final submission ke baad result dikhega.")) {
                document.getElementById('exam-page').classList.add('hidden');
                document.getElementById('result-page').classList.remove('hidden');
                document.getElementById('res-name').innerText = document.getElementById('uname').value;
            }
        }

        function nextQ() { if(currentQ < 2) loadQ(currentQ + 1); }
        function prevQ() { if(currentQ > 0) loadQ(currentQ - 1); }
    </script>
</body>
</html>
