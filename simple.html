<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>NIELIT M2-R5 Auto-Grader</title>
    <style>
        :root { --nielit-blue: #003366; --success: #28a745; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: #f4f4f4; }
        
        /* Sections */
        .hidden { display: none; }
        #login-sec, #result-sec { height: 100vh; display: flex; justify-content: center; align-items: center; flex-direction: column; }
        
        /* Header */
        header { background: var(--nielit-blue); color: white; padding: 15px 25px; display: flex; justify-content: space-between; align-items: center; }

        /* Exam Layout */
        .exam-container { display: grid; grid-template-columns: 350px 1fr; height: calc(100vh - 65px); }
        .q-sidebar { background: white; border-right: 2px solid #ddd; padding: 20px; overflow-y: auto; }
        .editor-area { background: #1e1e1e; padding: 20px; display: flex; flex-direction: column; }
        
        textarea { flex: 1; background: #1e1e1e; color: #00ff00; border: none; font-family: 'Consolas', monospace; font-size: 16px; outline: none; resize: none; }
        
        .q-item { padding: 15px; border: 1px solid #ddd; margin-bottom: 10px; cursor: pointer; border-radius: 5px; }
        .q-item.active { border-left: 5px solid orange; background: #fff3e0; }

        .btn { padding: 10px 25px; cursor: pointer; border: none; border-radius: 4px; font-weight: bold; }
        .btn-primary { background: var(--nielit-blue); color: white; }
        .btn-finish { background: var(--success); color: white; }
        
        /* Result Card */
        .result-card { background: white; padding: 40px; border-radius: 10px; text-align: center; box-shadow: 0 5px 20px rgba(0,0,0,0.2); }
    </style>
</head>
<body>

    <div id="login-sec">
        <h2>NIELIT PRACTICAL LOGIN</h2>
        <input type="text" id="stuName" placeholder="Enter Student Name" style="padding:10px; width:250px; margin-bottom:10px;"><br>
        <button class="btn btn-primary" onclick="startExam()">LOGIN</button>
    </div>

    <div id="exam-sec" class="hidden">
        <header>
            <div id="user-info">Student: <span id="display-name"></span></div>
            <div>Module: M2-R5 (Web Designing)</div>
            <button class="btn btn-finish" onclick="calculateResult()">FINISH EXAM</button>
        </header>

        <div class="exam-container">
            <div class="q-sidebar">
                <h3>Practical Questions</h3>
                <div class="q-item active" onclick="loadQ(0)" id="q0">Q1: Create an HTML Table with 2 rows.</div>
                <div class="q-item" onclick="loadQ(1)" id="q1">Q2: Create an Unordered List with 3 items.</div>
                <div class="q-item" onclick="loadQ(2)" id="q2">Q3: Create a Link to 'google.com'.</div>
            </div>
            <div class="editor-area">
                <div style="color: #888; margin-bottom: 10px;">Write HTML Code for the selected question:</div>
                <textarea id="code-editor" oninput="saveProgress()" placeholder="<html>..."></textarea>
            </div>
        </div>
    </div>

    <div id="result-sec" class="hidden">
        <div class="result-card">
            <h1 id="res-status">RESULT</h1>
            <p id="res-score" style="font-size: 20px;"></p>
            <p id="res-grade" style="font-weight: bold; font-size: 24px; color: var(--nielit-blue);"></p>
            <button class="btn btn-primary" onclick="location.reload()">RE-ATTEMPT</button>
        </div>
    </div>

    <script>
        let currentQ = 0;
        let userAnswers = ["", "", ""];
        
        // Correct tags to check for each question
        const validationRules = [
            ["<table", "<tr", "</table>"], // Q1 needs table
            ["<ul", "<li", "</ul>"],       // Q2 needs list
            ["<a", "href", "google.com"]   // Q3 needs link
        ];

        function startExam() {
            const name = document.getElementById('stuName').value;
            if(!name) return alert("Please enter name!");
            document.getElementById('display-name').innerText = name;
            document.getElementById('login-sec').classList.add('hidden');
            document.getElementById('exam-sec').classList.remove('hidden');
            loadQ(0);
        }

        function loadQ(idx) {
            // Save current code
            userAnswers[currentQ] = document.getElementById('code-editor').value;
            
            // UI Update
            document.getElementById(`q${currentQ}`).classList.remove('active');
            currentQ = idx;
            document.getElementById(`q${currentQ}`).classList.add('active');
            
            // Load saved code for this question
            document.getElementById('code-editor').value = userAnswers[idx];
        }

        function saveProgress() {
            userAnswers[currentQ] = document.getElementById('code-editor').value;
        }

        function calculateResult() {
            let marks = 0;

            userAnswers.forEach((ans, index) => {
                let isCorrect = true;
                validationRules[index].forEach(rule => {
                    if(!ans.toLowerCase().includes(rule.toLowerCase())) {
                        isCorrect = false;
                    }
                });
                if(isCorrect && ans.length > 10) marks += 33; // Approx 33 marks per question
            });

            if(marks > 95) marks = 100; // Rounding

            // Show Result Section
            document.getElementById('exam-sec').classList.add('hidden');
            document.getElementById('result-sec').classList.remove('hidden');

            const status = marks >= 50 ? "PASSED" : "FAILED";
            const grade = marks >= 85 ? "S" : marks >= 75 ? "A" : marks >= 65 ? "B" : marks >= 50 ? "C" : "F";

            document.getElementById('res-status').innerText = status;
            document.getElementById('res-status').style.color = marks >= 50 ? "green" : "red";
            document.getElementById('res-score').innerText = `Your Score: ${marks}/100`;
            document.getElementById('res-grade').innerText = marks >= 50 ? `Grade: ${grade}` : "Grade: F (Better luck next time)";
        }
    </script>
</body>
</html>
