<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SNT | Neural Admin Analytics</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background: #020617; color: #e2e8f0; font-family: 'Inter', sans-serif; overflow-x: hidden; }
        .neon-border { border: 1px solid rgba(56, 189, 248, 0.2); transition: 0.3s; }
        .neon-border:hover { border-color: #38bdf8; box-shadow: 0 0 15px rgba(56, 189, 248, 0.1); }
        .glass { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(16px); }
        .stats-card { background: linear-gradient(145deg, #0f172a, #1e293b); }
        
        /* Custom Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #020617; }
        ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #38bdf8; }

        @keyframes pulse-soft { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        .live-dot { height: 8px; width: 8px; background-color: #22c55e; border-radius: 50%; display: inline-block; animation: pulse-soft 2s infinite; }
    </style>
</head>
<body class="p-4 md:p-8">

    <div id="pin-gate" class="fixed inset-0 z-[2000] glass flex items-center justify-center">
        <div class="text-center p-8 bg-slate-900 rounded-3xl border border-sky-500/30 shadow-2xl">
            <i class="fas fa-user-shield text-4xl text-sky-500 mb-4"></i>
            <h2 class="text-xl font-bold mb-6">SECURE SYSTEM ACCESS</h2>
            <input type="password" id="gate-pin" maxlength="6" placeholder="ENTER PIN" class="bg-slate-950 border border-slate-700 p-4 rounded-xl text-center text-2xl tracking-[0.5em] w-48 focus:outline-none focus:border-sky-500 transition-all">
            <button onclick="checkGate()" class="block w-full mt-4 bg-sky-600 hover:bg-sky-500 p-3 rounded-xl font-bold transition-all">UNLOACK DATABASE</button>
        </div>
    </div>

    <div id="main-content" class="hidden max-w-7xl mx-auto">
        <div class="flex flex-col md:flex-row justify-between items-start md:items-center gap-4 mb-10">
            <div>
                <h1 class="text-4xl font-black tracking-tighter text-white italic">SNT <span class="text-sky-500">NEURAL</span></h1>
                <p class="text-slate-500 text-xs font-bold tracking-[0.3em] uppercase"><span class="live-dot mr-2"></span> System Live Activity</p>
            </div>
            <div class="flex gap-3">
                <button onclick="location.href='admin.html'" class="px-5 py-2.5 bg-slate-800 hover:bg-slate-700 rounded-xl text-xs font-bold border border-slate-700 transition-all">ADMIN DASHBOARD</button>
                <button onclick="location.reload()" class="w-10 h-10 flex items-center justify-center bg-sky-500/10 text-sky-500 rounded-xl border border-sky-500/20 hover:bg-sky-500 hover:text-white transition-all">
                    <i class="fas fa-sync-alt"></i>
                </button>
            </div>
        </div>

        <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
            <div class="stats-card p-6 rounded-3xl border border-slate-800">
                <p class="text-slate-400 text-xs font-bold uppercase mb-1">Total Users</p>
                <h3 id="stat-total" class="text-3xl font-black text-white">0</h3>
            </div>
            <div class="stats-card p-6 rounded-3xl border border-slate-800">
                <p class="text-emerald-400 text-xs font-bold uppercase mb-1">Active Now</p>
                <h3 id="stat-active" class="text-3xl font-black text-white">0</h3>
            </div>
            <div class="stats-card p-6 rounded-3xl border border-slate-800">
                <p class="text-amber-400 text-xs font-bold uppercase mb-1">Pending Sync</p>
                <h3 id="stat-pending" class="text-3xl font-black text-white">0</h3>
            </div>
            <div class="stats-card p-6 rounded-3xl border border-slate-800">
                <p class="text-sky-400 text-xs font-bold uppercase mb-1">System Health</p>
                <h3 class="text-3xl font-black text-white">99%</h3>
            </div>
        </div>

        <div class="glass rounded-[2.5rem] border border-slate-800 overflow-hidden shadow-2xl">
            <div class="p-6 border-b border-slate-800 flex flex-col md:flex-row gap-4">
                <div class="relative flex-1">
                    <i class="fas fa-search absolute left-4 top-1/2 -translate-y-1/2 text-slate-500"></i>
                    <input type="text" id="db-search" onkeyup="searchTable()" placeholder="Search by name, email or student ID..." class="w-full bg-slate-950/50 border border-slate-800 p-4 pl-12 rounded-2xl focus:outline-none focus:border-sky-500/50 transition-all">
                </div>
            </div>

            <div class="overflow-x-auto scroll-smooth">
                <table class="w-full text-left">
                    <thead class="bg-slate-900/50 text-slate-400">
                        <tr>
                            <th class="p-5 text-[10px] font-black uppercase tracking-widest">Student Profile</th>
                            <th class="p-5 text-[10px] font-black uppercase tracking-widest">Authentication</th>
                            <th class="p-5 text-[10px] font-black uppercase tracking-widest text-center">Identity</th>
                            <th class="p-5 text-[10px] font-black uppercase tracking-widest text-center">Status</th>
                            <th class="p-5 text-[10px] font-black uppercase tracking-widest text-right">Actions</th>
                        </tr>
                    </thead>
                    <tbody id="db-body" class="divide-y divide-slate-800/50">
                        </tbody>
                </table>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue, remove, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAOQtM_XYLqPgxMK1XBdfl0m7KoAseZRCA",
            authDomain: "snt-computer-institute.firebaseapp.com",
            projectId: "snt-computer-institute",
            databaseURL: "https://snt-computer-institute-default-rtdb.firebaseio.com",
            appId: "1:117580784781:web:73ba19d2d008beb3a5eec4"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Security Gate
        window.checkGate = () => {
            const pin = document.getElementById('gate-pin').value;
            if(pin === "912919") {
                document.getElementById('pin-gate').classList.add('hidden');
                document.getElementById('main-content').classList.remove('hidden');
                loadDatabase();
            } else {
                alert("ACCESS DENIED: INVALID NEURAL PIN");
            }
        };

        function loadDatabase() {
            const studentsRef = ref(db, 'students');
            onValue(studentsRef, (snapshot) => {
                const tbody = document.getElementById('db-body');
                tbody.innerHTML = "";
                
                if (snapshot.exists()) {
                    const data = snapshot.val();
                    const list = Object.entries(data);

                    // Update Stats
                    document.getElementById('stat-total').innerText = list.length;
                    document.getElementById('stat-pending').innerText = list.filter(s => s[1].registrationStatus === "Pending").length;
                    document.getElementById('stat-active').innerText = list.filter(s => s[1].registrationStatus !== "Pending").length;

                    list.reverse().forEach(([key, s]) => {
                        const row = document.createElement('tr');
                        row.className = "hover:bg-sky-500/[0.02] transition-all group";
                        row.innerHTML = `
                            <td class="p-5">
                                <div class="flex items-center gap-4">
                                    <div class="relative">
                                        <img src="${s.profilePicture || s.profilePic || 'https://via.placeholder.com/50'}" class="w-12 h-12 rounded-2xl border border-slate-700 object-cover shadow-lg group-hover:border-sky-500/50 transition-all">
                                        <div class="absolute -bottom-1 -right-1 w-4 h-4 bg-green-500 border-4 border-[#020617] rounded-full"></div>
                                    </div>
                                    <div>
                                        <div class="font-black text-white tracking-tight">${s.name || 'Anonymous'}</div>
                                        <div class="text-[10px] text-slate-500 font-bold uppercase tracking-widest">${s.mobile || 'No Mobile'}</div>
                                    </div>
                                </div>
                            </td>
                            <td class="p-5">
                                <div class="text-xs font-mono text-slate-400">${s.email}</div>
                                <div class="text-[9px] text-sky-500 font-black mt-1 uppercase tracking-tighter italic">Verified Google Account</div>
                            </td>
                            <td class="p-5 text-center font-mono font-bold text-sky-400 text-sm">
                                ${s.studentId || 'NOT_SET'}
                            </td>
                            <td class="p-5 text-center">
                                <button onclick="toggleStatus('${key}', '${s.registrationStatus}')" class="px-3 py-1.5 rounded-lg text-[9px] font-black uppercase border transition-all ${s.registrationStatus === 'Pending' ? 'bg-red-500/10 text-red-500 border-red-500/20 hover:bg-red-500 hover:text-white' : 'bg-emerald-500/10 text-emerald-500 border-emerald-500/20 hover:bg-emerald-500 hover:text-white'}">
                                    ${s.registrationStatus || 'Active'}
                                </button>
                            </td>
                            <td class="p-5 text-right">
                                <div class="flex justify-end gap-2">
                                    <button onclick="window.open('basic.html?search=${s.name}', '_blank')" class="w-8 h-8 rounded-lg bg-slate-800 flex items-center justify-center text-slate-400 hover:bg-sky-500 hover:text-white transition-all"><i class="fas fa-print text-xs"></i></button>
                                    <button onclick="deleteUser('${key}')" class="w-8 h-8 rounded-lg bg-slate-800 flex items-center justify-center text-slate-400 hover:bg-red-600 hover:text-white transition-all"><i class="fas fa-trash text-xs"></i></button>
                                </div>
                            </td>
                        </tr>
                    `;
                        tbody.appendChild(row);
                    });
                }
            });
        }

        window.toggleStatus = (key, current) => {
            const next = current === "Pending" ? "Active" : "Pending";
            if(confirm(`Change status to ${next}?`)) {
                update(ref(db, `students/${key}`), { registrationStatus: next });
            }
        };

        window.deleteUser = (key) => {
            if(confirm("DANGER: This will permanently erase this student from the neural database. Continue?")) {
                remove(ref(db, `students/${key}`));
            }
        };

        window.searchTable = () => {
            const q = document.getElementById('db-search').value.toLowerCase();
            const rows = document.querySelectorAll('#db-body tr');
            rows.forEach(r => r.style.display = r.innerText.toLowerCase().includes(q) ? '' : 'none');
        };
    </script>
</body>
</html>
