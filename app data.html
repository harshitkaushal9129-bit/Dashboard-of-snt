<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SNT | Neural Admin Analytics</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background: #020617; color: #e2e8f0; font-family: 'Inter', sans-serif; }
        .glass { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.05); }
        .stats-card { background: linear-gradient(145deg, #0f172a, #1e293b); border: 1px solid rgba(56, 189, 248, 0.1); }
        .avatar-container { position: relative; width: 48px; height: 48px; flex-shrink: 0; }
        .avatar-img { width: 100%; height: 100%; border-radius: 14px; object-fit: cover; border: 2px solid #334155; transition: 0.3s; }
        tr:hover .avatar-img { border-color: #38bdf8; box-shadow: 0 0 15px rgba(56, 189, 248, 0.3); }
        .status-pill { font-size: 9px; font-weight: 900; letter-spacing: 1px; padding: 5px 12px; border-radius: 20px; text-transform: uppercase; }
        .status-active { background: rgba(34, 197, 94, 0.1); color: #22c55e; border: 1px solid rgba(34, 197, 94, 0.2); }
        .status-pending { background: rgba(239, 68, 68, 0.1); color: #ef4444; border: 1px solid rgba(239, 68, 68, 0.2); }
        .status-guest { background: rgba(148, 163, 184, 0.1); color: #94a3b8; border: 1px solid rgba(148, 163, 184, 0.2); }
    </style>
</head>
<body class="p-4 md:p-8">

    <div id="pin-gate" class="fixed inset-0 z-[2000] glass flex items-center justify-center">
        <div class="text-center p-8 bg-slate-900 rounded-[2rem] border border-sky-500/30 shadow-2xl w-full max-w-xs">
            <div class="w-16 h-16 bg-sky-500/10 rounded-2xl flex items-center justify-center mx-auto mb-4 border border-sky-500/20">
                <i class="fas fa-fingerprint text-3xl text-sky-500"></i>
            </div>
            <h2 class="text-lg font-black mb-6 tracking-tighter">ADMIN AUTH</h2>
            <input type="password" id="gate-pin" maxlength="6" placeholder="••••••" class="bg-slate-950 border border-slate-700 p-4 rounded-xl text-center text-2xl tracking-[0.3em] w-full focus:outline-none focus:border-sky-500 transition-all text-white mb-4">
            <button onclick="checkGate()" class="w-full bg-sky-600 hover:bg-sky-500 p-4 rounded-xl font-black text-xs tracking-widest transition-all shadow-lg shadow-sky-900/20">VERIFY IDENTITY</button>
        </div>
    </div>

    <div id="delete-gate" class="fixed inset-0 z-[3000] glass hidden flex items-center justify-center">
        <div class="text-center p-8 bg-slate-950 rounded-[2rem] border border-rose-500/30 shadow-2xl w-full max-w-xs">
            <div class="w-16 h-16 bg-rose-500/10 rounded-2xl flex items-center justify-center mx-auto mb-4 border border-rose-500/20">
                <i class="fas fa-shield-alt text-3xl text-rose-500"></i>
            </div>
            <h2 class="text-lg font-black mb-2 tracking-tighter text-rose-500">CONFIRM DELETE</h2>
            <p class="text-[10px] text-slate-500 mb-6 font-bold uppercase tracking-widest">Enter PIN to execute</p>
            <input type="password" id="delete-pin" maxlength="6" placeholder="••••••" class="bg-black border border-slate-800 p-4 rounded-xl text-center text-2xl tracking-[0.3em] w-full focus:outline-none focus:border-rose-500 transition-all text-white mb-4">
            <div class="flex gap-2">
                <button onclick="closeDeleteGate()" class="flex-1 bg-slate-800 p-4 rounded-xl font-black text-[10px] tracking-widest border border-slate-700">CANCEL</button>
                <button id="confirm-delete-btn" class="flex-1 bg-rose-600 hover:bg-rose-500 p-4 rounded-xl font-black text-[10px] tracking-widest transition-all">DELETE</button>
            </div>
        </div>
    </div>

    <div id="main-content" class="hidden animate-fade-in">
        <header class="flex flex-col md:flex-row justify-between items-start md:items-center gap-6 mb-10">
            <div>
                <h1 class="text-3xl font-black tracking-tighter italic">SNT <span class="text-sky-500">DATABASE</span></h1>
                <div class="flex items-center gap-2 mt-1">
                    <span class="flex h-2 w-2 rounded-full bg-green-500 animate-pulse"></span>
                    <p class="text-slate-500 text-[10px] font-bold uppercase tracking-widest">Neural Link Established</p>
                </div>
            </div>
            <div class="flex gap-3">
                <a href="https://harshitkaushal9129-bit.github.io/Dashboard-of-snt/" target="_blank" class="px-6 py-3 bg-sky-600/10 text-sky-400 hover:bg-sky-600/20 rounded-2xl text-[10px] font-black tracking-widest border border-sky-500/20 transition-all flex items-center gap-2">
                   <i class="fas fa-external-link-alt"></i> OFFICIAL PORTAL
                </a>
                <button onclick="location.reload()" class="px-6 py-3 bg-slate-800 hover:bg-slate-700 rounded-2xl text-[10px] font-black tracking-widest border border-slate-700 transition-all">REFRESH</button>
            </div>
        </header>

        <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
            <div class="stats-card p-5 rounded-3xl">
                <p class="text-slate-500 text-[9px] font-black uppercase mb-1">Total Users</p>
                <h3 id="stat-total" class="text-2xl font-black">0</h3>
            </div>
            <div class="stats-card p-5 rounded-3xl">
                <p class="text-emerald-500 text-[9px] font-black uppercase mb-1">Active / Verified</p>
                <h3 id="stat-active" class="text-2xl font-black text-emerald-400">0</h3>
            </div>
            <div class="stats-card p-5 rounded-3xl">
                <p class="text-rose-500 text-[9px] font-black uppercase mb-1">Pending / Guest</p>
                <h3 id="stat-pending" class="text-2xl font-black text-rose-400">0</h3>
            </div>
            <div class="stats-card p-5 rounded-3xl border-sky-500/20">
                <p class="text-sky-500 text-[9px] font-black uppercase mb-1">Server Status</p>
                <h3 class="text-2xl font-black text-sky-400 font-mono text-[16px]">STABLE</h3>
            </div>
        </div>

        <div class="glass rounded-[2rem] overflow-hidden border border-slate-800 shadow-2xl">
            <div class="p-4 bg-slate-900/50 border-b border-slate-800">
                <input type="text" id="db-search" onkeyup="searchTable()" placeholder="Search by name, email, ID..." class="w-full bg-slate-950 border border-slate-800 p-4 rounded-2xl focus:outline-none focus:border-sky-500/50 text-sm">
            </div>

            <div class="overflow-x-auto">
                <table class="w-full text-left">
                    <thead class="bg-slate-950/50 text-slate-500">
                        <tr>
                            <th class="p-5 text-[10px] font-black uppercase tracking-widest">User Information</th>
                            <th class="p-5 text-[10px] font-black uppercase tracking-widest">Connection Details</th>
                            <th class="p-5 text-[10px] font-black uppercase tracking-widest text-center">Status</th>
                            <th class="p-5 text-[10px] font-black uppercase tracking-widest text-right">Operation</th>
                        </tr>
                    </thead>
                    <tbody id="db-body" class="divide-y divide-slate-800/40"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAOQtM_XYLqPgxMK1XBdfl0m7KoAseZRCA",
            authDomain: "snt-computer-institute.firebaseapp.com",
            projectId: "snt-computer-institute",
            databaseURL: "https://snt-computer-institute-default-rtdb.firebaseio.com",
            appId: "1:117580784781:web:73ba19d2d008beb3a5eec4"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const ADMIN_PIN = "912919";
        let userToDelete = null;

        window.checkGate = () => {
            if(document.getElementById('gate-pin').value === ADMIN_PIN) {
                document.getElementById('pin-gate').style.display = 'none';
                document.getElementById('main-content').classList.remove('hidden');
                loadData();
            } else { alert("Invalid Admin PIN"); }
        };

        // OPEN CUSTOM DELETE MODAL
        window.openDeleteGate = (key) => {
            userToDelete = key;
            document.getElementById('delete-gate').classList.remove('hidden');
            document.getElementById('delete-pin').value = "";
            document.getElementById('delete-pin').focus();
        };

        window.closeDeleteGate = () => {
            document.getElementById('delete-gate').classList.add('hidden');
            userToDelete = null;
        };

        document.getElementById('confirm-delete-btn').onclick = () => {
            if(document.getElementById('delete-pin').value === ADMIN_PIN) {
                remove(ref(db, `students/${userToDelete}`))
                    .then(() => {
                        closeDeleteGate();
                        alert("Deleted Successfully");
                    });
            } else {
                alert("Incorrect PIN! Action Aborted.");
            }
        };

        function loadData() {
            onValue(ref(db, 'students'), (snapshot) => {
                const tbody = document.getElementById('db-body');
                tbody.innerHTML = "";
                if (!snapshot.exists()) return;

                const data = Object.entries(snapshot.val());
                document.getElementById('stat-total').innerText = data.length;
                document.getElementById('stat-pending').innerText = data.filter(s => s[1].registrationStatus === "Pending" || s[1].registrationStatus === "Guest User").length;
                document.getElementById('stat-active').innerText = data.filter(s => s[1].registrationStatus === "Active").length;

                data.reverse().forEach(([key, s]) => {
                    const imgSource = s.profilePicture || s.profilePic || s.photoURL;
                    const status = s.registrationStatus || "Guest User";
                    let statusStyle = (status === "Active") ? "status-active" : (status === "Pending" ? "status-pending" : "status-guest");
                    
                    const row = `
                        <tr class="hover:bg-sky-500/[0.02] transition-all group">
                            <td class="p-5">
                                <div class="flex items-center gap-4">
                                    <div class="avatar-container">
                                        <img src="${imgSource || 'https://ui-avatars.com/api/?name='+s.name}" class="avatar-img" onerror="this.src='https://ui-avatars.com/api/?name=${s.name}&background=0f172a&color=38bdf8'">
                                    </div>
                                    <div>
                                        <div class="text-sm font-black text-white leading-tight">${s.name || 'Anonymous'}</div>
                                        <div class="text-[10px] text-slate-500 font-bold font-mono">${s.studentId || 'GUEST'}</div>
                                    </div>
                                </div>
                            </td>
                            <td class="p-5">
                                <div class="text-[11px] font-medium text-slate-400">${s.email || 'No Email'}</div>
                                <div class="text-[9px] text-sky-600 font-bold uppercase mt-1 tracking-widest italic">${s.mobile || 'No Phone'}</div>
                            </td>
                            <td class="p-5 text-center">
                                <span class="status-pill ${statusStyle}">${status}</span>
                            </td>
                            <td class="p-5 text-right">
                                <div class="flex justify-end gap-2">
                                    <button onclick="window.open('https://harshitkaushal9129-bit.github.io/snt-institute/basic.html?search=${s.name}', '_blank')" class="w-9 h-9 bg-slate-800 rounded-xl flex items-center justify-center text-slate-400 hover:text-white transition-all border border-slate-700"><i class="fas fa-eye text-xs"></i></button>
                                    <button onclick="openDeleteGate('${key}')" class="w-9 h-9 bg-slate-800/50 rounded-xl flex items-center justify-center text-slate-400 hover:bg-red-500 hover:text-white transition-all border border-slate-700"><i class="fas fa-trash-alt text-xs"></i></button>
                                </div>
                            </td>
                        </tr>
                    `;
                    tbody.innerHTML += row;
                });
            });
        }

        window.searchTable = () => {
            let q = document.getElementById('db-search').value.toLowerCase();
            document.querySelectorAll('#db-body tr').forEach(r => r.style.display = r.innerText.toLowerCase().includes(q) ? '' : 'none');
        };
    </script>
</body>
</html>
