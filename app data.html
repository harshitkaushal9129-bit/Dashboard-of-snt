<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SNT | Neural Admin Control v5.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;800&family=Inter:wght@400;900&display=swap');
        
        :root { --accent: #0ea5e9; --bg: #010409; --card: #0d1117; }
        body { background: var(--bg); color: #e2e8f0; font-family: 'Inter', sans-serif; overflow-x: hidden; }
        
        /* Glassmorphism & Cyber Effects */
        .glass { background: rgba(13, 17, 23, 0.8); backdrop-filter: blur(25px); border: 1px solid rgba(56, 189, 248, 0.1); }
        .auth-container { background: radial-gradient(circle at top, #1e293b 0%, #020617 100%); border: 1px solid rgba(56, 189, 248, 0.2); box-shadow: 0 0 60px rgba(0,0,0,1); }
        
        .pin-input { background: rgba(0, 0, 0, 0.5) !important; border: 2px solid #1e293b !important; font-family: 'JetBrains Mono', monospace; transition: 0.4s; }
        .pin-input:focus { border-color: var(--accent) !important; box-shadow: 0 0 20px rgba(14, 165, 233, 0.3); }
        
        .cyber-btn { background: linear-gradient(90deg, #0ea5e9, #2563eb); font-weight: 900; letter-spacing: 2px; transition: 0.3s; position: relative; overflow: hidden; }
        .cyber-btn:hover { transform: translateY(-2px); box-shadow: 0 5px 20px rgba(37, 99, 235, 0.4); }

        .stats-card { background: var(--card); border-bottom: 2px solid #1e293b; border-radius: 2rem; transition: 0.3s; }
        .stats-card:hover { border-color: var(--accent); transform: translateY(-3px); background: #161b22; }

        .status-pill { font-size: 9px; font-weight: 900; padding: 5px 12px; border-radius: 20px; text-transform: uppercase; letter-spacing: 1px; }
        .status-active { background: rgba(34, 197, 94, 0.1); color: #22c55e; border: 1px solid #22c55e33; }
        .status-pending { background: rgba(239, 68, 68, 0.1); color: #ef4444; border: 1px solid #ef444433; }

        .avatar-img { border-radius: 18px; object-fit: cover; border: 2px solid #1e293b; cursor: pointer; transition: 0.3s; }
        .avatar-img:hover { border-color: var(--accent); scale: 1.05; }

        .secure-blur { filter: blur(40px) scale(1.2); pointer-events: none; }
        
        @keyframes scan { 0% { top: 0; opacity: 0; } 50% { opacity: 1; } 100% { top: 100%; opacity: 0; } }
        .scan-line { width: 100%; height: 2px; background: #0ea5e9; position: absolute; animation: scan 3s linear infinite; box-shadow: 0 0 15px #0ea5e9; }
        
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
        .auth-error { animation: shake 0.2s ease-in-out 2; border-color: #ef4444 !important; }

        /* Custom Scroll */
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-thumb { background: #30363d; border-radius: 10px; }
    </style>
</head>
<body class="p-4 md:p-10">

    <div id="red-alert-overlay" class="fixed inset-0 bg-red-600/10 pointer-events-none opacity-0 transition-opacity z-[6000]"></div>

    <audio id="beep-success" src="https://assets.mixkit.co/active_storage/sfx/2568/2568-preview.mp3"></audio>
    <audio id="beep-error" src="https://assets.mixkit.co/active_storage/sfx/2573/2573-preview.mp3"></audio>

    <div id="pin-gate" class="fixed inset-0 z-[5000] bg-[#010409] flex items-center justify-center p-6">
        <div id="auth-box" class="auth-container w-full max-w-[420px] rounded-[3.5rem] p-12 relative overflow-hidden text-center">
            <div class="scan-line"></div>
            <div class="relative z-20">
                <div class="w-24 h-24 bg-sky-500/10 rounded-[2.5rem] flex items-center justify-center mx-auto mb-8 border border-sky-500/20 shadow-inner">
                    <i id="lock-icon" class="fas fa-fingerprint text-sky-500 text-4xl animate-pulse"></i>
                </div>
                <h2 class="text-3xl font-black text-white mb-2 tracking-tighter uppercase">Root Login</h2>
                <p id="auth-status" class="text-slate-500 text-[10px] mb-10 font-bold uppercase tracking-[0.4em]">Awaiting Identity Signature</p>
                <input type="password" id="gate-pin" maxlength="6" placeholder="••••••" class="pin-input w-full p-6 rounded-3xl text-center text-4xl tracking-[0.5em] text-sky-400 outline-none mb-6 shadow-2xl">
                <button onclick="checkGate()" class="cyber-btn w-full p-6 rounded-3xl text-white text-[11px] uppercase shadow-lg">Initialize Sequence</button>
            </div>
        </div>
    </div>

    <div id="main-content" class="hidden animate-fade-in">
        <header class="flex flex-col md:flex-row justify-between items-start md:items-center gap-8 mb-16">
            <div>
                <h1 class="text-6xl font-black italic tracking-tighter text-white">SNT <span class="text-sky-500 underline decoration-sky-500/30">CORE</span></h1>
                <div class="flex items-center gap-3 mt-3">
                    <div class="flex h-2 w-2 rounded-full bg-emerald-500 animate-ping"></div>
                    <p class="text-slate-500 font-bold text-[10px] uppercase tracking-[0.4em]">Database Sync Active: v5.0.2</p>
                </div>
            </div>
            <div class="flex gap-4">
                <a href="https://harshitkaushal9129-bit.github.io/Dashboard-of-snt/" target="_blank" class="px-8 py-5 bg-sky-500/5 text-sky-400 border border-sky-500/20 rounded-[1.5rem] text-[10px] font-black uppercase tracking-widest hover:bg-sky-500/10 transition-all flex items-center gap-3">
                    <i class="fas fa-satellite-dish"></i> Portal
                </a>
                <button onclick="location.reload()" class="w-16 h-16 glass rounded-[1.5rem] text-slate-400 hover:text-white transition-all flex items-center justify-center">
                    <i class="fas fa-sync-alt"></i>
                </button>
            </div>
        </header>

        <div class="grid grid-cols-2 lg:grid-cols-4 gap-6 mb-12">
            <div class="stats-card p-8">
                <p class="text-slate-500 text-[10px] font-black uppercase tracking-widest mb-2">Total Nodes</p>
                <h3 id="stat-total" class="text-5xl font-black tracking-tighter text-white">0</h3>
            </div>
            <div class="stats-card p-8 border-l-4 border-emerald-500">
                <p class="text-emerald-500/50 text-[10px] font-black uppercase tracking-widest mb-2">Verified</p>
                <h3 id="stat-active" class="text-5xl font-black tracking-tighter text-emerald-400">0</h3>
            </div>
            <div class="stats-card p-8 border-l-4 border-rose-500">
                <p class="text-rose-500/50 text-[10px] font-black uppercase tracking-widest mb-2">Pending</p>
                <h3 id="stat-pending" class="text-5xl font-black tracking-tighter text-rose-400">0</h3>
            </div>
            <div class="stats-card p-8 border-l-4 border-amber-500">
                <p class="text-amber-500/50 text-[10px] font-black uppercase tracking-widest mb-2">Neural Load</p>
                <h3 class="text-3xl font-black text-amber-400 tracking-tighter uppercase">Optimal</h3>
            </div>
        </div>

        <div class="glass rounded-[3rem] overflow-hidden border border-white/5 shadow-2xl">
            <div class="p-8 bg-white/[0.02] border-b border-white/5 flex flex-col md:flex-row gap-6 justify-between items-center">
                <div class="relative w-full max-w-md">
                    <i class="fas fa-search absolute left-6 top-1/2 -translate-y-1/2 text-slate-600"></i>
                    <input type="text" id="db-search" onkeyup="searchTable()" placeholder="Filter identity nodes..." class="w-full bg-black/40 border border-white/10 p-5 pl-14 rounded-2xl outline-none text-sm text-sky-400 placeholder:text-slate-700 focus:border-sky-500/40 transition-all">
                </div>
                <div class="text-[10px] font-black text-slate-500 uppercase tracking-widest bg-white/5 px-6 py-3 rounded-full border border-white/5">
                    Live Records <span id="record-count" class="text-sky-500 ml-2">0</span>
                </div>
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse">
                    <thead>
                        <tr class="bg-black/40 text-slate-500">
                            <th class="p-8 text-[10px] font-black uppercase tracking-widest">Student Node</th>
                            <th class="p-8 text-[10px] font-black uppercase tracking-widest">Neural Interaction</th>
                            <th class="p-8 text-[10px] font-black uppercase tracking-widest text-center">Status</th>
                            <th class="p-8 text-[10px] font-black uppercase tracking-widest text-right">Operations</th>
                        </tr>
                    </thead>
                    <tbody id="db-body" class="divide-y divide-white/5 bg-black/10">
                        </tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="image-view-gate" class="fixed inset-0 z-[7000] glass hidden flex items-center justify-center p-6">
        <div class="bg-[#0d1117] border border-white/10 rounded-[3rem] p-8 max-w-md w-full relative shadow-2xl">
            <button onclick="closeImageView()" class="absolute -top-4 -right-4 w-12 h-12 bg-slate-900 rounded-full flex items-center justify-center border border-white/10 z-50 hover:bg-rose-600 transition-colors shadow-xl">
                <i class="fas fa-times"></i>
            </button>
            <div class="relative overflow-hidden rounded-[2rem] aspect-square mb-8 bg-black border border-white/5">
                <img id="preview-img" src="" class="w-full h-full object-cover secure-blur">
                <div id="image-lock-status" class="absolute inset-0 flex flex-col items-center justify-center bg-black/80 backdrop-blur-xl">
                    <div class="w-16 h-16 bg-sky-500/10 rounded-full flex items-center justify-center mb-4 border border-sky-500/20">
                        <i class="fas fa-lock text-sky-500 text-xl"></i>
                    </div>
                    <p class="text-[10px] font-black tracking-[0.3em] uppercase text-white opacity-80">Decryption Required</p>
                </div>
            </div>
            <div id="image-auth-ui" class="space-y-4">
                <input type="password" id="image-pin-input" maxlength="6" placeholder="ADMIN PIN" class="pin-input w-full p-5 rounded-2xl text-center text-white text-2xl outline-none tracking-[0.4em]">
                <button onclick="unlockImagePreview()" class="cyber-btn w-full p-5 rounded-2xl text-[10px]">DECRYPT ASSET</button>
            </div>
            <div id="image-download-ui" class="hidden animate-fade-in">
                <a id="download-link" href="#" download class="w-full bg-emerald-600 hover:bg-emerald-500 p-5 rounded-2xl font-black text-[10px] flex items-center justify-center gap-3 transition-colors uppercase tracking-widest">
                    <i class="fas fa-download"></i> Save Identity Media
                </a>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue, remove, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAOQtM_XYLqPgxMK1XBdfl0m7KoAseZRCA",
            authDomain: "snt-computer-institute.firebaseapp.com",
            projectId: "snt-computer-institute",
            databaseURL: "https://snt-computer-institute-default-rtdb.firebaseio.com",
            appId: "1:117580784781:web:73ba19d2d008beb3a5eec4"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const ADMIN_PIN = "912919";

        // Gate Control
        window.checkGate = () => {
            const input = document.getElementById('gate-pin');
            const box = document.getElementById('auth-box');
            const status = document.getElementById('auth-status');
            const flash = document.getElementById('red-alert-overlay');

            if(input.value === ADMIN_PIN) {
                document.getElementById('beep-success').play();
                status.innerText = "IDENTITY VERIFIED";
                status.style.color = "#10b981";
                setTimeout(() => {
                    document.getElementById('pin-gate').style.opacity = '0';
                    setTimeout(() => {
                        document.getElementById('pin-gate').classList.add('hidden');
                        document.getElementById('main-content').classList.remove('hidden');
                        loadData();
                    }, 500);
                }, 800);
            } else {
                document.getElementById('beep-error').play();
                box.classList.add('auth-error');
                flash.style.opacity = "1";
                status.innerText = "INVALID SIGNATURE";
                status.style.color = "#ef4444";
                setTimeout(() => {
                    box.classList.remove('auth-error');
                    flash.style.opacity = "0";
                    input.value = "";
                }, 1000);
            }
        };

        // Student Data Processor
        function loadData() {
            onValue(ref(db, 'students'), (snap) => {
                const tbody = document.getElementById('db-body');
                tbody.innerHTML = "";
                const dataObj = snap.val() || {};
                const entries = Object.entries(dataObj);
                
                // Analytics
                const total = entries.length;
                const active = entries.filter(([k, s]) => s.registrationStatus === "Active").length;
                
                document.getElementById('stat-total').innerText = total;
                document.getElementById('stat-active').innerText = active;
                document.getElementById('stat-pending').innerText = total - active;
                document.getElementById('record-count').innerText = total;

                entries.reverse().forEach(([key, s], idx) => {
                    // PDF Activity Tracker
                    const viewData = s.viewedPDFs || {};
                    const totalViews = Object.values(viewData).reduce((a, b) => a + Number(b), 0);
                    
                    const profileImg = s.profilePicture || s.photoURL || `https://ui-avatars.com/api/?name=${s.name}&background=0f172a&color=38bdf8&bold=true`;
                    const status = s.registrationStatus || "GUEST";
                    const mobile = s.mobile || 'HIDDEN';

                    tbody.innerHTML += `
                        <tr class="hover:bg-white/[0.03] transition-all group">
                            <td class="p-8">
                                <div class="flex items-center gap-6">
                                    <img src="${profileImg}" onclick="openImageView('${profileImg}')" class="w-14 h-14 avatar-img shadow-lg group-hover:border-sky-500/50">
                                    <div>
                                        <div class="text-[13px] font-black text-white uppercase tracking-tighter">${s.name || 'ANON_NODE'}</div>
                                        <div class="text-[9px] text-sky-500 font-bold uppercase tracking-widest mt-1">${s.studentId || 'NOT_VERIFIED'}</div>
                                    </div>
                                </div>
                            </td>
                            <td class="p-8">
                                <div class="flex flex-col gap-2">
                                    <div class="flex justify-between items-center w-40">
                                        <span class="text-[10px] font-black ${totalViews > 0 ? 'text-emerald-400' : 'text-slate-600'} uppercase tracking-widest">
                                            <i class="fas fa-brain mr-1"></i> ${totalViews} Views
                                        </span>
                                        <span class="text-[8px] text-slate-500 font-bold italic">Level ${Math.floor(totalViews/10) + 1}</span>
                                    </div>
                                    <div class="w-40 h-1.5 bg-white/5 rounded-full overflow-hidden">
                                        <div class="h-full bg-gradient-to-r from-sky-600 to-sky-400 shadow-[0_0_10px_rgba(14,165,233,0.4)]" 
                                             style="width: ${Math.min(totalViews * 4, 100)}%"></div>
                                    </div>
                                </div>
                            </td>
                            <td class="p-8 text-center">
                                <span class="status-pill ${status === 'Active' ? 'status-active' : 'status-pending'}">
                                    ${status}
                                </span>
                            </td>
                            <td class="p-8 text-right flex justify-end gap-3">
                                <button onclick="window.open('https://harshitkaushal9129-bit.github.io/snt-institute/basic.html?search=${s.name}', '_blank')" 
                                        class="w-12 h-12 bg-sky-500/5 border border-sky-500/10 rounded-2xl text-sky-500 hover:bg-sky-500/20 transition-all flex items-center justify-center">
                                    <i class="fas fa-id-card"></i>
                                </button>
                                <button onclick="deleteStudent('${key}', '${s.name}')" 
                                        class="w-12 h-12 bg-rose-500/5 border border-rose-500/10 rounded-2xl text-rose-500/40 hover:text-rose-500 transition-all flex items-center justify-center">
                                    <i class="fas fa-trash-alt"></i>
                                </button>
                            </td>
                        </tr>`;
                });
            });
        }

        // Image Security Module
        window.openImageView = (url) => {
            document.getElementById('preview-img').src = url;
            document.getElementById('download-link').href = url;
            document.getElementById('image-view-gate').classList.remove('hidden');
        };

        window.closeImageView = () => {
            document.getElementById('image-view-gate').classList.add('hidden');
            document.getElementById('preview-img').classList.add('secure-blur');
            document.getElementById('image-lock-status').classList.remove('hidden');
            document.getElementById('image-auth-ui').classList.remove('hidden');
            document.getElementById('image-download-ui').classList.add('hidden');
            document.getElementById('image-pin-input').value = "";
        };

        window.unlockImagePreview = () => {
            if(document.getElementById('image-pin-input').value === ADMIN_PIN) {
                document.getElementById('beep-success').play();
                document.getElementById('preview-img').classList.remove('secure-blur');
                document.getElementById('image-lock-status').classList.add('hidden');
                document.getElementById('image-auth-ui').classList.add('hidden');
                document.getElementById('image-download-ui').classList.remove('hidden');
            } else {
                document.getElementById('beep-error').play();
                alert("DECRYPTION DENIED: ADMIN PIN MISMATCH");
            }
        };

        // Purge Function
        window.deleteStudent = (key, name) => {
            const verify = prompt(`DANGER: Type Admin PIN to permanently purge student [${name}] from neural core:`);
            if(verify === ADMIN_PIN) {
                remove(ref(db, 'students/' + key))
                .then(() => alert("Node Successfully Purged."))
                .catch((e) => alert("Purge Error: " + e));
            } else if (verify !== null) {
                document.getElementById('beep-error').play();
                alert("AUTHORIZATION FAILED.");
            }
        };

        // Real-time Search
        window.searchTable = () => {
            let q = document.getElementById('db-search').value.toLowerCase();
            document.querySelectorAll('#db-body tr').forEach(r => {
                r.style.display = r.innerText.toLowerCase().includes(q) ? '' : 'none';
            });
        };
    </script>
</body>
</html>
