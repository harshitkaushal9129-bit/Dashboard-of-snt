<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SNT - Registered Users</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #0f172a; color: white; font-family: 'Segoe UI', sans-serif; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); }
        .user-row:hover { background: rgba(56, 189, 248, 0.05); }
    </style>
</head>
<body class="p-4 md:p-10">

    <div class="max-w-5xl mx-auto">
        <header class="flex justify-between items-center mb-8">
            <div>
                <h1 class="text-2xl font-black tracking-tighter text-white">SNT <span class="text-sky-500">DATABASE</span></h1>
                <p id="count" class="text-slate-400 text-[10px] uppercase font-bold tracking-widest">Loading Users...</p>
            </div>
            <button onclick="history.back()" class="bg-slate-800 text-white px-5 py-2 rounded-xl text-[10px] font-black uppercase border border-white/10">Back</button>
        </header>

        <div class="glass rounded-3xl overflow-hidden shadow-2xl border border-white/5">
            <div class="overflow-x-auto">
                <table class="w-full text-left">
                    <thead>
                        <tr class="bg-sky-500/10 text-sky-400 border-b border-white/10">
                            <th class="p-4 text-[10px] font-black uppercase tracking-widest">Student / Gmail Name</th>
                            <th class="p-4 text-[10px] font-black uppercase tracking-widest">Email Address</th>
                            <th class="p-4 text-[10px] font-black uppercase tracking-widest">Student ID</th>
                            <th class="p-4 text-[10px] font-black uppercase tracking-widest">Status</th>
                        </tr>
                    </thead>
                    <tbody id="user-table-body">
                        </tbody>
                </table>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        // Aapka existing config
        const firebaseConfig = {
            apiKey: "AIzaSyAOQtM_XYLqPgxMK1XBdfl0m7KoAseZRCA",
            authDomain: "snt-computer-institute.firebaseapp.com",
            projectId: "snt-computer-institute",
            databaseURL: "https://snt-computer-institute-default-rtdb.firebaseio.com",
            appId: "1:117580784781:web:73ba19d2d008beb3a5eec4"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Seedha 'students' node ko read karna
        const studentsRef = ref(db, 'students');

        onValue(studentsRef, (snapshot) => {
            const tbody = document.getElementById('user-table-body');
            const countEl = document.getElementById('count');
            tbody.innerHTML = "";

            if (snapshot.exists()) {
                const students = snapshot.val();
                const studentList = Object.values(students);
                
                countEl.innerText = `${studentList.length} Registered Users Found`;

                studentList.forEach(student => {
                    const row = `
                        <tr class="user-row border-b border-white/5 transition-all">
                            <td class="p-4 flex items-center gap-3">
                                <img src="${student.profilePicture || student.profilePic || 'https://via.placeholder.com/40'}" class="w-9 h-9 rounded-full border border-sky-500/30 object-cover">
                                <div>
                                    <div class="text-sm font-bold text-white">${student.name || 'No Name'}</div>
                                    <div class="text-[9px] text-slate-500 font-bold uppercase tracking-tighter">${student.mobile || 'No Phone'}</div>
                                </div>
                            </td>
                            <td class="p-4 text-xs font-mono text-slate-400">${student.email}</td>
                            <td class="p-4 text-xs font-black text-sky-400">${student.studentId || 'N/A'}</td>
                            <td class="p-4 text-[10px]">
                                <span class="${student.registrationStatus === 'Pending' ? 'text-red-400 bg-red-400/10 border-red-400/20' : 'text-green-400 bg-green-400/10 border-green-400/20'} px-2 py-1 rounded border font-black uppercase">
                                    ${student.registrationStatus || 'Active'}
                                </span>
                            </td>
                        </tr>
                    `;
                    tbody.innerHTML += row;
                });
            } else {
                tbody.innerHTML = "<tr><td colspan='4' class='p-10 text-center text-slate-500'>No users found in database.</td></tr>";
            }
        });
    </script>
</body>
</html>
