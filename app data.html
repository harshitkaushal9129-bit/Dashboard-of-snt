<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SNT | Neural Admin Analytics</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;800&family=Inter:wght@400;900&display=swap');
        
        body { background: #010409; color: #e2e8f0; font-family: 'Inter', sans-serif; overflow-x: hidden; }
        .glass { background: rgba(13, 17, 23, 0.7); backdrop-filter: blur(25px); border: 1px solid rgba(56, 189, 248, 0.1); }
        
        .auth-container {
            background: radial-gradient(circle at top, #1e293b 0%, #020617 100%);
            border: 1px solid rgba(56, 189, 248, 0.2);
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.5), inset 0 0 20px rgba(56, 189, 248, 0.05);
            transition: all 0.3s ease;
        }

        .pin-input {
            background: rgba(0, 0, 0, 0.4) !important;
            border: 2px solid #1e293b !important;
            box-shadow: inset 0 2px 10px rgba(0,0,0,0.5);
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            font-family: 'JetBrains Mono', monospace;
        }

        .pin-input:focus {
            border-color: #0ea5e9 !important;
            box-shadow: 0 0 20px rgba(14, 165, 233, 0.2), inset 0 2px 10px rgba(0,0,0,0.5);
        }

        .cyber-btn {
            position: relative; overflow: hidden;
            background: linear-gradient(90deg, #0ea5e9, #2563eb);
            transition: all 0.3s; text-transform: uppercase;
            letter-spacing: 2px; font-weight: 900;
        }

        .scan-line {
            width: 100%; height: 2px; background: rgba(14, 165, 233, 0.5);
            position: absolute; top: 0; left: 0;
            animation: scan 3s linear infinite; z-index: 10;
            box-shadow: 0 0 15px #0ea5e9;
        }
        @keyframes scan { 0% { top: 0; opacity: 0; } 50% { opacity: 1; } 100% { top: 100%; opacity: 0; } }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }
        .auth-error { animation: shake 0.3s ease-in-out 2; border-color: #ef4444 !important; }
        
        #red-alert-overlay {
            position: fixed; inset: 0; background: rgba(239, 68, 68, 0.15);
            pointer-events: none; opacity: 0; transition: opacity 0.2s; z-index: 6000;
        }

        .stats-card { background: #0d1117; border-left: 4px solid #0ea5e9; transition: 0.3s; border-radius: 2rem; }
        .avatar-img { border-radius: 14px; object-fit: cover; border: 2px solid #1e293b; transition: 0.3s; cursor: pointer; }
        .secure-blur { filter: blur(30px) scale(1.1); pointer-events: none; }
        .status-pill { font-size: 9px; font-weight: 900; padding: 5px 12px; border-radius: 20px; text-transform: uppercase; }
        .status-active { background: rgba(34, 197, 94, 0.1); color: #22c55e; border: 1px solid #22c55e33; }
        .status-guest { background: rgba(239, 68, 68, 0.1); color: #ef4444; border: 1px solid #ef444433; }
    </style>
</head>
<body class="p-4 md:p-8">

    <div id="red-alert-overlay"></div>

    <audio id="beep-success" src="https://assets.mixkit.co/active_storage/sfx/2568/2568-preview.mp3"></audio>
    <audio id="beep-error" src="https://assets.mixkit.co/active_storage/sfx/2573/2573-preview.mp3"></audio>

    <div id="pin-gate" class="fixed inset-0 z-[5000] bg-[#010409] flex items-center justify-center p-4">
        <div id="auth-box" class="auth-container w-full max-w-[380px] rounded-[2.5rem] p-10 relative overflow-hidden text-center">
            <div class="scan-line"></div>
            <div class="relative z-20">
                <div class="mb-8 text-center">
                    <div id="lock-icon-container" class="w-20 h-20 bg-sky-500/10 rounded-3xl flex items-center justify-center mx-auto mb-4 border border-sky-500/20 shadow-inner">
                        <i id="lock-icon" class="fas fa-fingerprint text-4xl text-sky-500 animate-pulse"></i>
                    </div>
                    <h2 id="auth-title" class="text-2xl font-black tracking-tighter text-white">SYSTEM AUTH</h2>
                    <p id="auth-status" class="text-[10px] text-sky-500/60 font-bold tracking-[0.3em] uppercase mt-1">Awaiting Signature</p>
                </div>
                <div class="space-y-4">
                    <input type="password" id="gate-pin" maxlength="6" placeholder="••••••" class="pin-input w-full p-5 rounded-2xl text-center text-3xl tracking-[0.5em] text-sky-400 outline-none">
                    <button onclick="checkGate()" class="cyber-btn w-full p-5 rounded-2xl text-white text-xs font-black shadow-lg">Execute Access</button>
                    <p class="text-[9px] text-slate-600 font-mono tracking-widest mt-4">SNT NEURAL CORE v4.2</p>
                </div>
            </div>
        </div>
    </div>

    <div id="main-content" class="hidden">
        <header class="flex flex-col md:flex-row justify-between items-start md:items-center gap-6 mb-10">
            <div>
                <h1 class="text-4xl font-black tracking-tighter italic">SNT <span class="text-sky-500">DATABASE</span></h1>
                <div class="flex items-center gap-2 mt-1">
                    <span class="flex h-2 w-2 rounded-full bg-green-500 animate-pulse"></span>
                    <p class="text-slate-500 text-[10px] font-bold uppercase tracking-widest">Neural Link Established</p>
                </div>
            </div>
            <div class="flex gap-3">
                <a href="https://harshitkaushal9129-bit.github.io/Dashboard-of-snt/" target="_blank" class="px-6 py-4 bg-sky-500/5 text-sky-400 border border-sky-500/20 rounded-2xl text-[10px] font-black tracking-widest hover:bg-sky-500/10 flex items-center gap-2">
                   <i class="fas fa-shield-alt"></i> Official Portal
                </a>
                <button onclick="location.reload()" class="px-6 py-4 bg-white/5 border border-white/10 rounded-2xl text-[10px] font-black tracking-widest hover:bg-white/10 transition-all">REFRESH</button>
            </div>
        </header>

        <div class="grid grid-cols-2 lg:grid-cols-4 gap-4 mb-8">
            <div class="stats-card p-6">
                <p class="text-slate-500 text-[10px] font-black uppercase mb-1">Population</p>
                <h3 id="stat-total" class="text-3xl font-black">0</h3>
            </div>
            <div class="stats-card p-6 border-emerald-500">
                <p class="text-emerald-500 text-[10px] font-black uppercase mb-1">Active</p>
                <h3 id="stat-active" class="text-3xl font-black text-emerald-400">0</h3>
            </div>
            <div class="stats-card p-6 border-rose-500">
                <p class="text-rose-500 text-[10px] font-black uppercase mb-1">Pending</p>
                <h3 id="stat-pending" class="text-3xl font-black text-rose-400">0</h3>
            </div>
            <div class="stats-card p-6 border-sky-500 text-sky-400">
                <p class="text-sky-500 text-[10px] font-black uppercase mb-1">Server</p>
                <h3 class="text-2xl font-black">STABLE</h3>
            </div>
        </div>

        <div class="glass rounded-[2.5rem] overflow-hidden border border-white/5 shadow-2xl">
            <div class="p-6 bg-white/5 border-b border-white/5">
                <input type="text" id="db-search" onkeyup="searchTable()" placeholder="Search neural nodes..." class="w-full bg-black/40 border border-white/10 p-5 rounded-2xl outline-none text-sm">
            </div>
            <div class="overflow-x-auto">
                <table class="w-full text-left">
                    <thead class="bg-black/20 text-slate-500">
                        <tr>
                            <th class="p-6 text-[10px] font-black uppercase tracking-widest">Identity Node</th>
                            <th class="p-6 text-[10px] font-black uppercase tracking-widest">Metadata</th>
                            <th class="p-6 text-[10px] font-black uppercase tracking-widest text-center">Status</th>
                            <th class="p-6 text-[10px] font-black uppercase tracking-widest text-right">Operations</th>
                        </tr>
                    </thead>
                    <tbody id="db-body" class="divide-y divide-white/5"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="image-view-gate" class="fixed inset-0 z-[4000] glass hidden flex items-center justify-center p-4">
        <div class="bg-[#0d1117] border border-white/5 rounded-[2.5rem] p-6 max-w-md w-full relative">
            <button onclick="closeImageView()" class="absolute -top-3 -right-3 w-10 h-10 bg-slate-800 rounded-full flex items-center justify-center border border-white/10 z-50 hover:bg-rose-600"><i class="fas fa-times"></i></button>
            <div class="relative overflow-hidden rounded-2xl aspect-square mb-6 bg-black">
                <img id="preview-img" src="" class="w-full h-full object-contain secure-blur">
                <div id="image-lock-status" class="absolute inset-0 flex flex-col items-center justify-center bg-black/60 backdrop-blur-md">
                    <i class="fas fa-lock text-4xl text-sky-500 mb-2"></i>
                    <p class="text-[10px] font-black tracking-widest uppercase">Encryption Active</p>
                </div>
            </div>
            <div id="image-auth-ui">
                <input type="password" id="image-pin-input" maxlength="6" placeholder="PIN" class="pin-input w-full p-4 rounded-xl text-center text-white mb-3 outline-none">
                <button onclick="unlockImagePreview()" class="cyber-btn w-full p-4 rounded-xl text-[10px]">DECRYPT DATA</button>
            </div>
            <div id="image-download-ui" class="hidden">
                <a id="download-link" href="#" download class="w-full bg-emerald-600 p-4 rounded-xl font-black text-[10px] flex items-center justify-center gap-2 mt-2">DOWNLOAD ORIGINAL</a>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAOQtM_XYLqPgxMK1XBdfl0m7KoAseZRCA",
            authDomain: "snt-computer-institute.firebaseapp.com",
            projectId: "snt-computer-institute",
            databaseURL: "https://snt-computer-institute-default-rtdb.firebaseio.com",
            appId: "1:117580784781:web:73ba19d2d008beb3a5eec4"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const ADMIN_PIN = "912919";

        window.checkGate = () => {
            const input = document.getElementById('gate-pin');
            const box = document.getElementById('auth-box');
            const status = document.getElementById('auth-status');
            const icon = document.getElementById('lock-icon');
            const flash = document.getElementById('red-alert-overlay');

            if(input.value === ADMIN_PIN) {
                document.getElementById('beep-success').play();
                status.innerText = "ACCESS GRANTED";
                status.style.color = "#10b981";
                icon.className = "fas fa-shield-check text-4xl text-emerald-500";
                
                setTimeout(() => {
                    document.getElementById('pin-gate').style.display = 'none';
                    document.getElementById('main-content').classList.remove('hidden');
                    loadData();
                }, 600);
            } else {
                document.getElementById('beep-error').play();
                box.classList.add('auth-error');
                flash.style.opacity = "1";
                status.innerText = "ACCESS DENIED";
                status.style.color = "#ef4444";
                
                setTimeout(() => {
                    box.classList.remove('auth-error');
                    flash.style.opacity = "0";
                    status.innerText = "Awaiting Signature";
                    status.style.color = "";
                    input.value = "";
                }, 1200);
            }
        };

        window.openImageView = (url) => {
            document.getElementById('preview-img').src = url;
            document.getElementById('download-link').href = url;
            document.getElementById('image-view-gate').classList.remove('hidden');
        };

        window.closeImageView = () => {
            document.getElementById('image-view-gate').classList.add('hidden');
            document.getElementById('preview-img').classList.add('secure-blur');
            document.getElementById('image-lock-status').classList.remove('hidden');
            document.getElementById('image-auth-ui').classList.remove('hidden');
            document.getElementById('image-download-ui').classList.add('hidden');
            document.getElementById('image-pin-input').value = "";
        };

        window.unlockImagePreview = () => {
            if(document.getElementById('image-pin-input').value === ADMIN_PIN) {
                document.getElementById('preview-img').classList.remove('secure-blur');
                document.getElementById('image-lock-status').classList.add('hidden');
                document.getElementById('image-auth-ui').classList.add('hidden');
                document.getElementById('image-download-ui').classList.remove('hidden');
            } else { document.getElementById('beep-error').play(); }
        };

        window.deleteStudent = (key) => {
            const verify = prompt("CRITICAL: Enter Admin PIN to authorize node purge:");
            if(verify === ADMIN_PIN) {
                remove(ref(db, 'students/' + key))
                .then(() => { alert("Node Purged Successfully."); })
                .catch((e) => { alert("Purge Failed: " + e); });
            } else if (verify !== null) {
                document.getElementById('beep-error').play();
                alert("AUTHORIZATION FAILED: Invalid PIN.");
            }
        };

        function loadData() {
            onValue(ref(db, 'students'), (snapshot) => {
                const tbody = document.getElementById('db-body');
                tbody.innerHTML = "";
                if (!snapshot.exists()) {
                    document.getElementById('stat-total').innerText = 0;
                    document.getElementById('stat-active').innerText = 0;
                    document.getElementById('stat-pending').innerText = 0;
                    return;
                }

                const data = Object.entries(snapshot.val());
                const total = data.length;
                const active = data.filter(([k, s]) => s.registrationStatus === "Active").length;
                const pending = total - active;

                document.getElementById('stat-total').innerText = total;
                document.getElementById('stat-active').innerText = active;
                document.getElementById('stat-pending').innerText = pending;

                data.reverse().forEach(([key, s]) => {
                    const img = s.profilePicture || s.profilePic || s.photoURL || `https://ui-avatars.com/api/?name=${s.name}&background=0f172a&color=38bdf8`;
                    const st = s.registrationStatus || "GUEST";
                    
                    const row = `
                        <tr class="hover:bg-white/5 transition-all">
                            <td class="p-6">
                                <div class="flex items-center gap-4">
                                    <img src="${img}" onclick="openImageView('${img}')" class="w-12 h-12 avatar-img">
                                    <div><div class="text-sm font-black text-white">${s.name || 'ANON'}</div><div class="text-[9px] text-sky-500 font-mono">${s.studentId || 'N/A'}</div></div>
                                </div>
                            </td>
                            <td class="p-6 text-[11px] text-slate-400 font-medium">${s.email || 'N/A'}<br><span class="text-[9px] text-sky-600 font-bold italic">${s.mobile || ''}</span></td>
                            <td class="p-6 text-center"><span class="status-pill ${st === 'Active' ? 'status-active' : 'status-guest'}">${st}</span></td>
                            <td class="p-6 text-right flex justify-end gap-2">
                                <button onclick="window.open('https://harshitkaushal9129-bit.github.io/snt-institute/basic.html?search=${s.name}', '_blank')" class="w-10 h-10 bg-white/5 rounded-xl text-slate-500 hover:text-sky-400 border border-white/5 flex items-center justify-center"><i class="fas fa-eye"></i></button>
                                <button onclick="deleteStudent('${key}')" class="w-10 h-10 bg-rose-500/5 rounded-xl text-rose-500/40 hover:text-rose-500 border border-white/5 flex items-center justify-center"><i class="fas fa-trash-alt"></i></button>
                            </td>
                        </tr>`;
                    tbody.innerHTML += row;
                });
            });
        }

        window.searchTable = () => {
            let q = document.getElementById('db-search').value.toLowerCase();
            document.querySelectorAll('#db-body tr').forEach(r => r.style.display = r.innerText.toLowerCase().includes(q) ? '' : 'none');
        };
    </script>
</body>
</html>
