<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SNT Admin - Media Upload</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #38bdf8; --bg: #0f172a; --danger: #ef4444; }
        body { font-family: 'Poppins', sans-serif; background: var(--bg); display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; color: white; flex-direction: column; padding: 20px; }
        .card { background: #1e293b; padding: 2rem; border-radius: 20px; width: 100%; max-width: 450px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.1); margin-bottom: 20px; }
        .form-group { margin-bottom: 1.2rem; }
        label { display: block; font-weight: 600; margin-bottom: 8px; font-size: 0.9rem; color: #94a3b8; }
        input, textarea, select { width: 100%; padding: 12px; border: 2px solid #334155; border-radius: 12px; background: #0f172a; color: white; outline: none; box-sizing: border-box; }
        input:focus, select:focus { border-color: var(--primary); }
        button { width: 100%; background: var(--primary); color: #0f172a; border: none; padding: 14px; border-radius: 12px; font-weight: 800; cursor: pointer; transition: 0.3s; }
        #status { margin-top: 15px; font-size: 0.85rem; color: var(--primary); display: none; text-align: center; }
        .tab-menu { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab { flex: 1; padding: 10px; background: #334155; border-radius: 10px; text-align: center; cursor: pointer; font-size: 0.8rem; font-weight: bold; }
        .active-tab { background: var(--primary); color: #0f172a; }

        /* Naya List Style */
        .list-container { width: 100%; max-width: 450px; background: #1e293b; border-radius: 20px; padding: 1rem; box-sizing: border-box; }
        .item-card { background: #0f172a; padding: 15px; border-radius: 12px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; border-left: 4px solid var(--primary); }
        .item-info { flex: 1; }
        .item-name { font-weight: 600; font-size: 0.9rem; margin: 0; }
        .item-meta { font-size: 0.75rem; color: #94a3b8; }
        .del-btn { background: var(--danger); color: white; border: none; padding: 8px 12px; border-radius: 8px; font-size: 0.75rem; cursor: pointer; width: auto; margin-left: 10px; }
    </style>
</head>
<body>

    <div class="card">
        <h2 id="title" style="margin-top:0; text-align:center;">📄 PDF Uploader</h2>
        
        <div class="tab-menu">
            <div id="pdfBtn" class="tab active-tab" onclick="setMode('pdf')">Upload PDF</div>
            <div id="imgBtn" class="tab" onclick="setMode('image')">Upload Image</div>
        </div>

        <form id="uploadForm">
            <div class="form-group" id="courseBox">
                <label>Course Category</label>
                <select id="category">
                    <option value="O Level">O Level</option>
                    <option value="CCC">CCC</option>
                    <option value="DCA & ADCA">DCA & ADCA</option>
                    <option value="Tally ERP 9">Tally ERP 9</option>
                    <option value="UPSSSC">UPSSSC</option>
                    <option value="Other">Other</option>
                    <option value="All">All Students</option>
                </select>
            </div>

            <div class="form-group">
                <label id="fileLabel">Select PDF File</label>
                <input type="file" id="mediaFile" required>
            </div>

            <div class="form-group">
                <label>File Name / Title</label>
                <input type="text" id="fileName" placeholder="E.g. Python Notes" required>
            </div>

            <div class="form-group">
                <label>Short Description</label>
                <textarea id="mediaDesc" rows="2" placeholder="Brief details..."></textarea>
            </div>

            <button type="submit" id="submitBtn">UPLOAD TO DATABASE</button>
            <div id="status">Uploading... Please wait...</div>
        </form>
    </div>

    <div class="list-container">
        <h3 style="text-align: center; font-size: 1rem; color: #94a3b8;">Uploaded Files</h3>
        <div id="mediaList"></div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAOQtM_XYLqPgxMK1XBdfl0m7KoAseZRCA",
            authDomain: "snt-computer-institute.firebaseapp.com",
            databaseURL: "https://snt-computer-institute-default-rtdb.firebaseio.com",
            projectId: "snt-computer-institute",
            storageBucket: "snt-computer-institute.firebasestorage.app",
            appId: "1:117580784781:web:73ba19d2d008beb3a5eec4"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        let mode = 'pdf';

        function setMode(m) {
            mode = m;
            document.getElementById('pdfBtn').className = m === 'pdf' ? 'tab active-tab' : 'tab';
            document.getElementById('imgBtn').className = m === 'image' ? 'tab active-tab' : 'tab';
            document.getElementById('courseBox').style.display = m === 'pdf' ? 'block' : 'none';
            document.getElementById('fileLabel').innerText = m === 'pdf' ? 'Select PDF File' : 'Select Image File';
            document.getElementById('title').innerText = m === 'pdf' ? '📄 PDF Uploader' : '🖼️ Image Uploader';
            loadData(); // Switch hone par list update karein
        }

        // --- FETCH DATA ---
        function loadData() {
            const path = mode === 'pdf' ? 'myPDFs' : 'myImages';
            db.ref(path).on('value', (snapshot) => {
                const listDiv = document.getElementById('mediaList');
                listDiv.innerHTML = "";
                if(snapshot.exists()) {
                    snapshot.forEach((child) => {
                        const data = child.val();
                        const key = child.key;
                        listDiv.innerHTML += `
                            <div class="item-card">
                                <div class="item-info">
                                    <p class="item-name">${data.name}</p>
                                    <span class="item-meta">${mode === 'pdf' ? data.category : 'Image'}</span>
                                </div>
                                <button class="del-btn" onclick="deleteItem('${key}')">Delete</button>
                            </div>
                        `;
                    });
                } else {
                    listDiv.innerHTML = "<p style='text-align:center; font-size:0.8rem; opacity:0.5;'>No files found.</p>";
                }
            });
        }

        // --- DELETE DATA ---
        window.deleteItem = function(key) {
            if(confirm("Are you sure you want to delete this?")) {
                const path = mode === 'pdf' ? 'myPDFs' : 'myImages';
                db.ref(path + "/" + key).remove().then(() => {
                    alert("Deleted Successfully!");
                });
            }
        }

        document.getElementById('uploadForm').onsubmit = function(e) {
            e.preventDefault();
            const file = document.getElementById('mediaFile').files[0];
            const btn = document.getElementById('submitBtn');
            const status = document.getElementById('status');

            if(!file) return;
            
            btn.disabled = true;
            status.style.display = "block";

            const reader = new FileReader();
            reader.onload = function(event) {
                const dataObj = {
                    name: document.getElementById('fileName').value,
                    data: event.target.result,
                    desc: document.getElementById('mediaDesc').value,
                    date: new Date().toISOString()
                };

                if(mode === 'pdf') dataObj.category = document.getElementById('category').value;

                const path = mode === 'pdf' ? 'myPDFs' : 'myImages';
                db.ref(path).push(dataObj).then(() => {
                    alert("Success!");
                    document.getElementById('uploadForm').reset();
                    btn.disabled = false;
                    status.style.display = "none";
                });
            };
            reader.readAsDataURL(file);
        };

        // Initial Load
        loadData();
    </script>
</body>
</html>
