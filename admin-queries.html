<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SNT Admin - Student Queries</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #0f172a; color: white; font-family: 'Segoe UI', sans-serif; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); }
        .query-card { border-left: 4px solid #38bdf8; transition: 0.3s; }
        .query-card:hover { transform: translateX(5px); background: rgba(56, 189, 248, 0.05); }
    </style>
</head>
<body class="p-4 md:p-8">
    <div id="admin-content" class="hidden max-w-4xl mx-auto">
        <header class="flex justify-between items-center mb-8">
            <div class="flex items-center gap-4">
                <button onclick="location.href='index.html'" class="w-10 h-10 rounded-full glass flex items-center justify-center text-sky-400"><i class="fas fa-home"></i></button>
                <h1 class="text-xl font-black tracking-tighter uppercase">Student <span class="text-sky-500">Queries</span></h1>
            </div>
            <div class="glass px-4 py-2 rounded-xl text-[10px] font-black text-sky-400 border border-sky-500/20 uppercase">
                Admin Mode
            </div>
        </header>

        <div id="queries-list" class="space-y-4">
            <div class="text-center py-20 opacity-50 italic">Loading student messages...</div>
        </div>
    </div>

    <div id="denied-screen" class="hidden flex flex-col items-center justify-center min-h-screen text-center p-6">
        <i class="fas fa-user-shield text-6xl text-red-500 mb-4"></i>
        <h2 class="text-2xl font-black mb-2">ACCESS DENIED</h2>
        <p class="text-slate-400 text-sm">This panel is restricted to the Chief Administrator only.</p>
        <button onclick="location.href='index.html'" class="mt-6 px-8 py-3 bg-sky-500 rounded-full font-bold text-xs">Return Home</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAOQtM_XYLqPgxMK1XBdfl0m7KoAseZRCA",
            authDomain: "snt-computer-institute.firebaseapp.com",
            projectId: "snt-computer-institute",
            databaseURL: "https://snt-computer-institute-default-rtdb.firebaseio.com",
            appId: "1:117580784781:web:73ba19d2d008beb3a5eec4"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const auth = getAuth(app);

        const ADMIN_EMAIL = "harshitkaushal9129@gmail.com";

        onAuthStateChanged(auth, (user) => {
            if (user && user.email === ADMIN_EMAIL) {
                document.getElementById('admin-content').classList.remove('hidden');
                loadQueries();
            } else {
                document.getElementById('denied-screen').classList.remove('hidden');
            }
        });

        async function loadQueries() {
            const queriesRef = ref(db, 'queries');
            const studentsRef = ref(db, 'students');

            // Sabse pehle students ka data map bana lo taki mobile number mil sake
            const studentSnap = await get(studentsRef);
            const studentMap = {};
            if (studentSnap.exists()) {
                Object.values(studentSnap.val()).forEach(s => {
                    studentMap[s.email] = s.mobile || s.phone || "No Number";
                });
            }

            onValue(queriesRef, (snapshot) => {
                const list = document.getElementById('queries-list');
                if (snapshot.exists()) {
                    const data = Object.values(snapshot.val()).reverse();
                    list.innerHTML = data.map(q => `
                        <div class="glass p-6 rounded-3xl query-card">
                            <div class="flex justify-between items-start mb-4">
                                <div>
                                    <h3 class="text-sky-400 font-black text-xs uppercase tracking-widest">${q.subject}</h3>
                                    <p class="text-[10px] text-slate-500 font-bold">${q.timestamp}</p>
                                </div>
                                <span class="text-[9px] bg-sky-500/10 text-sky-400 px-2 py-1 rounded border border-sky-500/20 font-black uppercase">${q.status || 'New'}</span>
                            </div>
                            <p class="text-sm text-slate-200 mb-6 italic">"${q.message}"</p>
                            <div class="flex items-center gap-3 border-t border-white/5 pt-4">
                                <div class="w-8 h-8 rounded-full bg-slate-800 flex items-center justify-center text-[10px] font-bold text-sky-500 border border-sky-500/20">
                                    ${q.name ? q.name[0] : 'S'}
                                </div>
                                <div>
                                    <p class="text-[11px] font-black text-white">${q.name || 'Unknown Student'}</p>
                                    <p class="text-[9px] text-slate-400 font-mono">${q.email} | <span class="text-green-500">${studentMap[q.email] || 'N/A'}</span></p>
                                </div>
                                <a href="https://wa.me/91${studentMap[q.email]}" target="_blank" class="ml-auto text-green-500 hover:scale-110 transition-transform">
                                    <i class="fab fa-whatsapp text-xl"></i>
                                </a>
                            </div>
                        </div>
                    `).join('');
                } else {
                    list.innerHTML = '<div class="text-center py-20 opacity-50 italic uppercase text-xs tracking-widest">No queries found in database.</div>';
                }
            });
        }
    </script>
</body>
</html>
