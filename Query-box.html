<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SNT - Query Box</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #0f172a; color: white; font-family: 'Segoe UI', sans-serif; overflow: hidden; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); }
        input, textarea { background: rgba(15, 23, 42, 0.5) !important; border: 1px solid rgba(56, 189, 248, 0.2) !important; color: white !important; transition: 0.3s; }
        input:focus, textarea:focus { border-color: #38bdf8 !important; outline: none; background: rgba(15, 23, 42, 0.8) !important; }
        
        /* Success Animation */
        #success-overlay { display: none; position: fixed; inset: 0; background: rgba(15, 23, 42, 0.95); z-index: 9999; flex-direction: column; align-items: center; justify-content: center; backdrop-filter: blur(10px); }
        .check-icon { font-size: 80px; color: #10b981; animation: pop 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        @keyframes pop { 0% { transform: scale(0); } 100% { transform: scale(1); } }
    </style>
</head>
<body class="p-4 md:p-8">

    <div id="success-overlay">
        <i class="fas fa-check-circle check-icon mb-4"></i>
        <h2 class="text-2xl font-black tracking-tighter uppercase">Query Sent!</h2>
        <p class="text-slate-400 text-xs mt-2 font-bold tracking-widest">REDIRECTING TO DASHBOARD...</p>
    </div>

    <div class="max-w-md mx-auto h-screen flex flex-col">
        <header class="flex items-center gap-4 mb-8">
            <button onclick="history.back()" class="w-10 h-10 rounded-full glass flex items-center justify-center text-sky-400 active:scale-90 transition-all"><i class="fas fa-arrow-left"></i></button>
            <h1 class="text-xl font-black tracking-tighter italic">SNT <span class="text-sky-500">HELP DESK</span></h1>
        </header>

        <div class="glass p-6 rounded-[32px] shadow-2xl border-t-4 border-sky-500 animate-fade-in">
            <div class="flex items-center gap-3 mb-6">
                <div class="w-1.5 h-6 bg-sky-500 rounded-full"></div>
                <p class="text-[10px] uppercase tracking-[0.3em] text-sky-400 font-black">Official Admin Query</p>
            </div>
            
            <div class="space-y-5">
                <div>
                    <label class="text-[10px] font-black text-slate-500 uppercase ml-2 tracking-widest">Subject</label>
                    <input type="text" id="query-subject" placeholder="e.g. Admission Inquiry" class="w-full p-4 rounded-2xl mt-1 text-sm font-bold tracking-wide">
                </div>
                <div>
                    <label class="text-[10px] font-black text-slate-500 uppercase ml-2 tracking-widest">Your Message</label>
                    <textarea id="query-msg" rows="6" placeholder="Type your problem here..." class="w-full p-4 rounded-2xl mt-1 text-sm font-semibold resize-none"></textarea>
                </div>
                
                <button onclick="sendQuery()" id="send-btn" class="w-full bg-sky-500 hover:bg-sky-400 text-slate-900 p-4 rounded-2xl font-black text-[11px] uppercase tracking-[0.2em] transition-all active:scale-95 shadow-xl shadow-sky-500/20 flex items-center justify-center gap-2">
                    <i class="fas fa-paper-plane text-sm"></i>
                    <span id="btn-text">Submit Query</span>
                </button>
            </div>
        </div>
        
        <p class="mt-auto mb-4 text-center text-[9px] font-bold text-slate-600 uppercase tracking-[0.3em]">Powered by SNT Security Layer</p>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, push, set } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        // Firebase Config (Don't Change These Unless You Update Firebase Project)
        const firebaseConfig = {
            apiKey: "AIzaSyAOQtM_XYLqPgxMK1XBdfl0m7KoAseZRCA",
            authDomain: "snt-computer-institute.firebaseapp.com",
            projectId: "snt-computer-institute",
            databaseURL: "https://snt-computer-institute-default-rtdb.firebaseio.com",
            appId: "1:117580784781:web:73ba19d2d008beb3a5eec4"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const auth = getAuth(app);

        let currentUser = null;
        onAuthStateChanged(auth, (user) => { 
            if(user) {
                currentUser = user; 
            } else {
                location.href='index.html'; 
            }
        });

        window.sendQuery = async () => {
            const subject = document.getElementById('query-subject').value.trim();
            const msg = document.getElementById('query-msg').value.trim();
            const btn = document.getElementById('send-btn');
            const btnText = document.getElementById('btn-text');

            if(!subject || !msg) {
                if(navigator.vibrate) navigator.vibrate(100);
                return alert("Please enter both Subject and Message.");
            }

            // UI Feedback: Disable button and show loading
            btn.disabled = true;
            btn.classList.replace('bg-sky-500', 'bg-slate-700');
            btnText.innerText = "UPLOADING TO CLOUD...";

            try {
                const queryRef = ref(db, 'queries');
                const newQuery = push(queryRef);
                
                await set(newQuery, {
                    uid: currentUser.uid,
                    email: currentUser.email,
                    name: currentUser.displayName,
                    subject: subject,
                    message: msg,
                    timestamp: new Date().toLocaleString(),
                    status: "Pending",
                    reply: "" // Empty for admin response
                });

                // SUCCESS FEEDBACK
                if(navigator.vibrate) navigator.vibrate([100, 50, 100]); // Success vibration
                document.getElementById('success-overlay').style.display = 'flex';
                
                setTimeout(() => {
                    history.back(); // Redirect back after 2 seconds
                }, 2000);

            } catch(e) { 
                console.error(e);
                alert("Cloud Error: Query failed to upload."); 
                btn.disabled = false;
                btn.classList.replace('bg-slate-700', 'bg-sky-500');
                btnText.innerText = "SUBMIT QUERY"; 
            }
        };
    </script>
</body>
</html>
