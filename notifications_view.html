<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SNT - Notice Board</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background: #0b0f1a; color: white; font-family: 'Inter', sans-serif; }
        .glass { background: rgba(30, 41, 59, 0.4); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.05); }
        .new-badge { background: linear-gradient(90deg, #0ea5e9, #2dd4bf); }
    </style>
</head>
<body class="p-4 sm:p-6">
    <div class="max-w-md mx-auto">
        <header class="flex justify-between items-center mb-8">
            <button onclick="history.back()" class="w-12 h-12 glass rounded-2xl flex items-center justify-center text-sky-400 active:scale-90 transition-all">
                <i class="fas fa-chevron-left"></i>
            </button>
            <div class="text-right">
                <h1 class="text-xl font-black italic tracking-tighter text-white">SNT <span class="text-sky-500">NEWS</span></h1>
                <p class="text-[9px] uppercase tracking-[0.3em] text-slate-500 font-bold">Official Updates</p>
            </div>
        </header>

        <div id="notif-list" class="space-y-6">
            <div class="flex justify-center py-20">
                <i class="fas fa-circle-notch animate-spin text-sky-500 text-2xl"></i>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAOQtM_XYLqPgxMK1XBdfl0m7KoAseZRCA",
            authDomain: "snt-computer-institute.firebaseapp.com",
            projectId: "snt-computer-institute",
            databaseURL: "https://snt-computer-institute-default-rtdb.firebaseio.com",
            appId: "1:117580784781:web:73ba19d2d008beb3a5eec4"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        onValue(ref(db, 'notifications'), (snapshot) => {
            const list = document.getElementById('notif-list');
            list.innerHTML = "";
            const now = new Date().getTime();

            if (snapshot.exists()) {
                const notices = Object.values(snapshot.val())
                    .filter(n => new Date(n.expiry).getTime() > now)
                    .sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));

                if(notices.length === 0) {
                    list.innerHTML = `<div class="text-center py-20 opacity-40"><i class="fas fa-bell-slash text-4xl mb-4"></i><p class="text-sm">No new announcements</p></div>`;
                    return;
                }

                notices.forEach((data, index) => {
                    const div = document.createElement('div');
                    div.className = "glass rounded-[2rem] overflow-hidden shadow-xl animate-in fade-in slide-in-from-bottom duration-500";
                    
                    const imgHtml = data.imageUrl ? 
                        `<div class="relative"><img src="${data.imageUrl}" class="w-full h-52 object-cover border-b border-white/5">
                         ${index === 0 ? '<span class="absolute top-4 left-4 new-badge text-[9px] font-black px-3 py-1 rounded-full shadow-lg">NEW</span>' : ''}
                        </div>` : '';

                    div.innerHTML = `
                        ${imgHtml}
                        <div class="p-6">
                            <div class="flex justify-between items-center mb-3">
                                <div class="flex items-center gap-2">
                                    <div class="w-1.5 h-1.5 bg-sky-500 rounded-full animate-pulse"></div>
                                    <span class="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Administrator</span>
                                </div>
                                <span class="text-[9px] text-slate-600 font-mono">${new Date(data.timestamp).toLocaleDateString()}</span>
                            </div>
                            <p class="text-[15px] font-medium leading-relaxed text-slate-200">${data.message}</p>
                        </div>
                    `;
                    list.appendChild(div);
                });
            } else {
                list.innerHTML = "<p class='text-center text-slate-500 py-10'>Nothing to show.</p>";
            }
        });
    </script>
</body>
</html>
