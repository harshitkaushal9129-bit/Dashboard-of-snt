<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SNT - Auto Ledger</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <style>
        body { background-color: #0f172a; color: white; font-family: 'Segoe UI', sans-serif; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); }
        .paid-card { border-left: 4px solid #10b981; }
        .pending-card { border-left: 4px solid #ef4444; background: rgba(239, 68, 68, 0.05); }
        .admission-card { border-left: 4px solid #f59e0b; }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-2xl mx-auto">
        <header class="flex justify-between items-center mb-8">
            <div class="flex items-center gap-4">
                <button onclick="history.back()" class="w-10 h-10 rounded-full glass flex items-center justify-center text-sky-400"><i class="fas fa-arrow-left"></i></button>
                <h1 onclick="askAdmin()" class="text-xl font-black tracking-tighter uppercase cursor-pointer italic">Fee <span id="title-color" class="text-emerald-500">Ledger</span></h1>
            </div>
            <div id="total-balance" class="glass px-4 py-2 rounded-xl text-[10px] font-black text-red-400 border border-red-500/20 uppercase">BAL: ₹0</div>
        </header>

        <div id="fee-container" class="space-y-4">
            <div class="text-center py-20 opacity-30 animate-pulse text-xs uppercase tracking-widest">Checking Records...</div>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAOQtM_XYLqPgxMK1XBdfl0m7KoAseZRCA",
            authDomain: "snt-computer-institute.firebaseapp.com",
            databaseURL: "https://snt-computer-institute-default-rtdb.firebaseio.com/",
            projectId: "snt-computer-institute",
            appId: "1:117580784781:web:73ba19d2d008beb3a5eec4"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const auth = firebase.auth();

        const MONTHS = ["January", "February", "March", "April", "May", "June", "July", "August", "September", "October", "November", "December"];
        const MONTHLY_FEE = 500; // Yahan apni monthly fee set karein

        auth.onAuthStateChanged((user) => {
            if (user) loadLedger(user.uid, user.email);
        });

        function loadLedger(uid, email) {
            db.ref('students').orderByChild('email').equalTo(email).on('value', (snap) => {
                if (!snap.exists()) return;
                const student = Object.values(snap.val())[0];
                renderLedger(student);
            });
        }

        function renderLedger(student) {
            const container = document.getElementById('fee-container');
            let html = '';
            let totalDue = 0;

            // 1. Admission Card
            if (student.registrationStatus === "Paid") {
                html += `
                <div class="glass p-5 rounded-2xl admission-card flex justify-between items-center mb-6">
                    <div>
                        <p class="text-[10px] text-slate-500 font-black uppercase tracking-widest">SNT Official</p>
                        <h3 class="font-black text-white text-lg">ADMISSION VERIFIED</h3>
                    </div>
                    <i class="fas fa-check-circle text-yellow-500 text-2xl"></i>
                </div>`;
            }

            // 2. Month-wise Logic
            const adDate = new Date(student.registrationDate || "2026-01-01");
            const curDate = new Date(); // Current system date
            
            let tempDate = new Date(adDate);
            tempDate.setDate(1); // Start from 1st of admission month

            const history = student.paymentHistory || [];

            while (tempDate <= curDate) {
                const monthName = MONTHS[tempDate.getMonth()];
                const year = tempDate.getFullYear();
                const monthYear = `${monthName} ${year}`;
                
                // Check if this month is paid
                const paidRecord = history.find(p => p.month === monthName);

                if (paidRecord) {
                    html += `
                    <div class="glass p-5 rounded-2xl paid-card flex justify-between items-center mb-3">
                        <div>
                            <p class="text-[10px] text-slate-500 font-bold uppercase tracking-widest">${paidRecord.date || monthYear}</p>
                            <h3 class="font-black text-white text-lg">₹${paidRecord.amount}</h3>
                            <p class="text-[9px] text-emerald-400 font-bold uppercase">${monthName}</p>
                        </div>
                        <span class="text-[9px] bg-emerald-500/10 text-emerald-500 px-3 py-1 rounded border border-emerald-500/20 font-black uppercase">PAID ✅</span>
                    </div>`;
                } else {
                    totalDue += MONTHLY_FEE;
                    html += `
                    <div class="glass p-5 rounded-2xl pending-card flex justify-between items-center mb-3">
                        <div>
                            <p class="text-[10px] text-slate-500 font-bold uppercase tracking-widest italic">Not Received</p>
                            <h3 class="font-black text-red-400 text-lg">₹${MONTHLY_FEE}</h3>
                            <p class="text-[9px] text-red-500/60 font-bold uppercase">${monthName}</p>
                        </div>
                        <span class="text-[9px] bg-red-500/10 text-red-500 px-3 py-1 rounded border border-red-500/20 font-black uppercase tracking-tighter">PENDING ⏳</span>
                    </div>`;
                }
                
                tempDate.setMonth(tempDate.getMonth() + 1);
            }

            document.getElementById('total-balance').innerText = `BAL: ₹${totalDue}`;
            container.innerHTML = html;
        }

        window.askAdmin = () => {
            const pin = prompt("ENTER MASTER PIN:");
            if (pin === "912919") window.location.href = "admin-dashboard.html";
        };
    </script>
</body>
</html>
