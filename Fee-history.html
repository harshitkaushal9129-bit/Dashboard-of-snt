<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SNT - Fee Ledger Pro</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <style>
        body { background-color: #0f172a; color: white; font-family: 'Segoe UI', sans-serif; overflow-x: hidden; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); }
        .fee-card { border-left: 4px solid #10b981; }
        .extra-card { border-left: 4px solid #38bdf8; }
        .admission-card { border-left: 4px solid #f59e0b; background: rgba(245, 158, 11, 0.05); }
        .admin-card { border-bottom: 1px solid rgba(255,255,255,0.05); transition: 0.3s; }
        .animate-fade { animation: fadeIn 0.5s ease-in; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-2xl mx-auto">
        <header class="flex justify-between items-center mb-8">
            <div class="flex items-center gap-4">
                <button onclick="history.back()" class="w-10 h-10 rounded-full glass flex items-center justify-center text-sky-400 active:scale-90"><i class="fas fa-arrow-left"></i></button>
                <h1 onclick="askAdmin()" class="text-xl font-black tracking-tighter uppercase cursor-pointer italic">
                    Fee <span id="title-color" class="text-emerald-500">Ledger</span>
                </h1>
            </div>
            <div id="total-balance" class="glass px-4 py-2 rounded-xl text-[10px] font-black text-slate-400 border border-white/10 uppercase tracking-widest">
                BAL: ₹0
            </div>
        </header>

        <div id="fee-container" class="space-y-4">
            <div class="flex flex-col items-center justify-center py-20 opacity-30">
                <i class="fas fa-circle-notch fa-spin text-2xl mb-4"></i>
                <p class="text-[10px] font-black tracking-[0.3em] uppercase">Syncing Records...</p>
            </div>
        </div>

        <p class="mt-10 text-center text-[8px] font-bold text-slate-600 uppercase tracking-[0.4em]">SNT Computer & Spoken Institute</p>
    </div>

    <script>
        // --- Firebase Config ---
        const firebaseConfig = {
            apiKey: "AIzaSyAOQtM_XYLqPgxMK1XBdfl0m7KoAseZRCA",
            authDomain: "snt-computer-institute.firebaseapp.com",
            databaseURL: "https://snt-computer-institute-default-rtdb.firebaseio.com/",
            projectId: "snt-computer-institute",
            appId: "1:117580784781:web:73ba19d2d008beb3a5eec4"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const auth = firebase.auth();

        auth.onAuthStateChanged((user) => {
            if (user) {
                loadStudentView(user.uid, user.email);
            } else {
                window.location.href = 'login.html';
            }
        });

        // --- Student View Logic ---
        function loadStudentView(uid, email) {
            const container = document.getElementById('fee-container');

            // 1. Pehle UID se dhoondo
            db.ref(`students/${uid}`).on('value', (snapshot) => {
                if (snapshot.exists()) {
                    renderData(snapshot.val());
                } else {
                    // 2. Backup: Email se dhoondo (Admission status ke liye)
                    db.ref('students').orderByChild('email').equalTo(email).once('value', (snap) => {
                        if (snap.exists()) {
                            const data = Object.values(snap.val())[0];
                            renderData(data);
                        } else {
                            container.innerHTML = `<div class="text-center py-20 opacity-30 text-xs font-black uppercase italic">No Record Found for ${email}</div>`;
                        }
                    });
                }
            });
        }

        function renderData(student) {
            const container = document.getElementById('fee-container');
            const balElement = document.getElementById('total-balance');
            
            const pending = student.pendingAmount || 0;
            balElement.innerText = `BAL: ₹${pending}`;
            balElement.style.color = pending > 0 ? '#ef4444' : '#10b981';

            let html = '';

            // ADMISSION STATUS CARD
            if (student.registrationStatus === "Paid") {
                html += `
                    <div class="glass p-5 rounded-2xl admission-card flex justify-between items-center mb-3 animate-fade">
                        <div>
                            <p class="text-[10px] text-slate-500 font-black uppercase tracking-widest">Enrollment</p>
                            <h3 class="font-black text-white text-lg italic">ADMISSION PAID</h3>
                            <p class="text-[9px] text-yellow-500 font-bold uppercase tracking-tighter">Identity Verified</p>
                        </div>
                        <i class="fas fa-check-circle text-yellow-500 text-xl opacity-50"></i>
                    </div>`;
            }

            // MONTHLY PAYMENTS
            if (student.paymentHistory && Array.isArray(student.paymentHistory)) {
                [...student.paymentHistory].reverse().forEach(pay => {
                    html += `
                        <div class="glass p-5 rounded-2xl fee-card flex justify-between items-center mb-3 animate-fade">
                            <div>
                                <p class="text-[10px] text-slate-500 font-black uppercase tracking-widest">${pay.date || 'Recieved'}</p>
                                <h3 class="font-black text-white text-lg">₹${pay.amount}</h3>
                                <p class="text-[9px] text-emerald-400 font-bold uppercase italic">${pay.month}</p>
                            </div>
                            <span class="text-[9px] bg-emerald-500/10 text-emerald-500 px-3 py-1 rounded-full border border-emerald-500/20 font-black uppercase tracking-tighter">SUCCESS ✅</span>
                        </div>`;
                });
            }

            // EXTRA CHARGES
            if (student.extraHistory && Array.isArray(student.extraHistory)) {
                [...student.extraHistory].reverse().forEach(ex => {
                    html += `
                        <div class="glass p-5 rounded-2xl extra-card flex justify-between items-center mb-3 opacity-90 animate-fade">
                            <div>
                                <h3 class="font-black text-white text-lg">₹${ex.amount}</h3>
                                <p class="text-[9px] text-sky-400 font-bold uppercase italic">${ex.reason}</p>
                            </div>
                            <span class="text-[8px] bg-sky-500/10 text-sky-400 px-2 py-1 rounded border border-sky-500/20 font-black uppercase">MISC</span>
                        </div>`;
                });
            }

            container.innerHTML = html || '<div class="text-center py-20 opacity-30 text-xs uppercase tracking-widest">Record is Empty</div>';
        }

        // --- Admin Master View ---
        window.askAdmin = () => {
            const pin = prompt("ENTER MASTER PIN:");
            if (pin === "912919") {
                db.ref('students').once('value', (snapshot) => {
                    const container = document.getElementById('fee-container');
                    const data = snapshot.val();
                    let adminHtml = '<h2 class="text-[10px] font-black text-sky-500 mb-4 tracking-[0.3em] uppercase">Master Ledger View</h2>';
                    
                    Object.keys(data).forEach(id => {
                        const s = data[id];
                        const bal = s.pendingAmount || 0;
                        adminHtml += `
                            <div class="glass p-4 rounded-3xl mb-3 border-l-2 ${bal > 0 ? 'border-red-500' : 'border-emerald-500'}">
                                <div class="flex justify-between items-center">
                                    <span class="text-xs font-black uppercase tracking-tight">${s.name || 'Student'}</span>
                                    <span class="text-[10px] font-black ${bal > 0 ? 'text-red-400' : 'text-emerald-400'}">₹${bal}</span>
                                </div>
                                <p class="text-[8px] text-slate-500 mt-1 uppercase">${s.registrationStatus === 'Paid' ? 'ADMISSION DONE' : 'ADMISSION PENDING'}</p>
                            </div>`;
                    });
                    container.innerHTML = adminHtml;
                    document.getElementById('title-color').innerText = "MASTER PANEL";
                });
            } else if (pin) { alert("WRONG PIN!"); }
        };
    </script>
</body>
</html>
