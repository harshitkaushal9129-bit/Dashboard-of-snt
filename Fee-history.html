<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SNT - Fee History</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #0f172a; color: white; font-family: 'Segoe UI', sans-serif; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); }
        .fee-card { border-left: 4px solid #10b981; }
        .pending-card { border-left: 4px solid #ef4444; }
    </style>
</head>
<body class="p-4 md:p-8">
    <div class="max-w-2xl mx-auto">
        <header class="flex justify-between items-center mb-8">
            <div class="flex items-center gap-4">
                <button onclick="history.back()" class="w-10 h-10 rounded-full glass flex items-center justify-center text-sky-400"><i class="fas fa-arrow-left"></i></button>
                <h1 class="text-xl font-black tracking-tighter uppercase">Fee <span class="text-emerald-500">Ledger</span></h1>
            </div>
            <div id="total-balance" class="glass px-4 py-2 rounded-xl text-[10px] font-black text-red-400 border border-red-500/20">
                BAL: ₹0
            </div>
        </header>

        <div id="fee-container" class="space-y-4">
            <div class="animate-pulse glass h-20 rounded-2xl"></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = { /* Aapka Config Yahan */ };
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const auth = getAuth(app);

        onAuthStateChanged(auth, (user) => {
            if(user) {
                // Fetch student's specific fee data
                onValue(ref(db, `fee_records/${user.uid}`), (snapshot) => {
                    const container = document.getElementById('fee-container');
                    if (snapshot.exists()) {
                        const data = snapshot.val();
                        document.getElementById('total-balance').innerText = "BAL: ₹" + (data.pendingAmount || 0);
                        
                        let html = '';
                        // Assuming payments is an array in your DB
                        if(data.payments) {
                            data.payments.reverse().forEach(pay => {
                                html += `
                                    <div class="glass p-5 rounded-2xl fee-card flex justify-between items-center">
                                        <div>
                                            <p class="text-[10px] text-slate-400 font-bold uppercase tracking-widest">${pay.date}</p>
                                            <h3 class="font-black text-white text-lg">₹${pay.amount}</h3>
                                            <p class="text-[9px] text-emerald-400 font-bold uppercase italic">${pay.method || 'Online'}</p>
                                        </div>
                                        <div class="text-right">
                                            <span class="text-[8px] bg-emerald-500/10 text-emerald-500 px-2 py-1 rounded border border-emerald-500/20 font-black uppercase italic">Paid</span>
                                        </div>
                                    </div>
                                `;
                            });
                            container.innerHTML = html;
                        }
                    } else {
                        container.innerHTML = '<p class="text-center text-slate-500 mt-10 font-bold italic uppercase text-xs">No fee records found.</p>';
                    }
                });
            }
        });
    </script>
</body>
</html>
