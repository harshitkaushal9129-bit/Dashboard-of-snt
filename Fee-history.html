<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SNT - Fee Ledger</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #0f172a; color: white; font-family: 'Segoe UI', sans-serif; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); }
        .fee-card { border-left: 4px solid #10b981; transition: 0.3s; }
        .pending-card { border-left: 4px solid #ef4444; }
        .admin-row { border-bottom: 1px solid rgba(255,255,255,0.05); }
        .status-paid { color: #10b981; font-weight: 900; }
        .status-due { color: #ef4444; font-weight: 900; }
        .hidden { display: none !important; }
    </style>
</head>
<body class="p-4 md:p-8">
    <div class="max-w-3xl mx-auto">
        <header class="flex justify-between items-center mb-8">
            <div class="flex items-center gap-4">
                <button onclick="history.back()" class="w-10 h-10 rounded-full glass flex items-center justify-center text-sky-400 active:scale-90"><i class="fas fa-arrow-left"></i></button>
                <h1 onclick="askAdmin()" class="text-xl font-black tracking-tighter uppercase cursor-pointer">Fee <span id="title-color" class="text-emerald-500">Ledger</span></h1>
            </div>
            <div id="total-balance" class="glass px-4 py-2 rounded-xl text-[10px] font-black text-red-400 border border-red-500/20 uppercase tracking-widest">
                BAL: ₹0
            </div>
        </header>

        <div id="admin-search" class="hidden mb-6">
            <div class="glass flex items-center px-4 py-3 rounded-2xl border border-emerald-500/20">
                <i class="fas fa-search text-emerald-500 mr-3"></i>
                <input type="text" id="studentSearch" placeholder="SEARCH STUDENT NAME..." class="bg-transparent border-none outline-none text-[11px] font-black uppercase tracking-widest w-full text-white">
            </div>
        </div>

        <div id="fee-container" class="space-y-4">
            <div class="animate-pulse glass h-20 rounded-2xl"></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAOQtM_XYLqPgxMK1XBdfl0m7KoAseZRCA",
            authDomain: "snt-computer-institute.firebaseapp.com",
            projectId: "snt-computer-institute",
            databaseURL: "https://snt-computer-institute-default-rtdb.firebaseio.com",
            appId: "1:117580784781:web:73ba19d2d008beb3a5eec4"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const auth = getAuth(app);

        let isAdmin = false;

        onAuthStateChanged(auth, (user) => {
            if(user) {
                loadStudentView(user.uid);
            }
        });

        // 1. Student View (Normal)
        function loadStudentView(uid) {
            onValue(ref(db, `fee_records/${uid}`), (snapshot) => {
                const container = document.getElementById('fee-container');
                if (snapshot.exists()) {
                    const data = snapshot.val();
                    document.getElementById('total-balance').innerText = "BAL: ₹" + (data.pendingAmount || 0);
                    
                    if(data.payments) {
                        let html = data.payments.reverse().map(pay => `
                            <div class="glass p-5 rounded-2xl fee-card flex justify-between items-center animate-fade-in">
                                <div>
                                    <p class="text-[10px] text-slate-400 font-black uppercase tracking-widest">${pay.date || 'No Date'}</p>
                                    <h3 class="font-black text-white text-lg">₹${pay.amount}</h3>
                                    <p class="text-[9px] text-emerald-400 font-bold uppercase italic">${pay.month || 'Current Month'}</p>
                                </div>
                                <div class="text-right">
                                    <span class="text-[9px] bg-emerald-500/10 text-emerald-500 px-3 py-1 rounded border border-emerald-500/20 font-black uppercase">PAID ✅</span>
                                </div>
                            </div>
                        `).join('');
                        container.innerHTML = html;
                    }
                } else {
                    container.innerHTML = '<div class="text-center py-20 opacity-40 italic uppercase text-[10px] tracking-[0.3em]">No personal records found.</div>';
                }
            });
        }

        // 2. Admin PIN Check
        window.askAdmin = () => {
            const pin = prompt("ENTER MASTER PIN TO VIEW ALL RECORDS:");
            if(pin === "912919") {
                isAdmin = true;
                document.getElementById('admin-search').classList.remove('hidden');
                document.getElementById('title-color').innerText = "MASTER PANEL";
                document.getElementById('title-color').classList.replace('text-emerald-500', 'text-sky-500');
                loadAdminView();
            } else {
                alert("ACCESS DENIED");
            }
        };

        // 3. Admin View (All Students Monthly Status)
        async function loadAdminView() {
            const feeRef = ref(db, 'fee_records');
            const studentRef = ref(db, 'students');
            
            // Get Student Names
            const stdSnap = await get(studentRef);
            const stdMap = {};
            if(stdSnap.exists()){
                Object.entries(stdSnap.val()).forEach(([id, info]) => {
                    stdMap[id] = info.name || "Unknown";
                });
            }

            onValue(feeRef, (snapshot) => {
                const container = document.getElementById('fee-container');
                if (snapshot.exists()) {
                    const allData = snapshot.val();
                    let html = '';
                    
                    Object.entries(allData).forEach(([uid, data]) => {
                        const name = stdMap[uid] || "New Student";
                        const bal = data.pendingAmount || 0;
                        
                        html += `
                            <div class="glass p-5 rounded-2xl border-l-4 ${bal > 0 ? 'border-red-500' : 'border-emerald-500'} mb-4 admin-card">
                                <div class="flex justify-between items-start mb-3">
                                    <div>
                                        <h2 class="font-black text-white uppercase text-sm tracking-tighter">${name}</h2>
                                        <p class="text-[9px] text-slate-500 font-mono italic">${uid.substring(0,10)}...</p>
                                    </div>
                                    <div class="text-right">
                                        <p class="text-[10px] font-black ${bal > 0 ? 'text-red-400' : 'text-emerald-400'} uppercase tracking-widest">DUE: ₹${bal}</p>
                                    </div>
                                </div>
                                <div class="grid grid-cols-3 gap-2 mt-2">
                                    <div class="text-[8px] font-bold text-slate-400 uppercase tracking-tighter bg-white/5 p-2 rounded text-center">
                                        Last Pay: <span class="text-white">${data.payments ? data.payments[data.payments.length-1].date : 'N/A'}</span>
                                    </div>
                                    <div class="text-[8px] font-bold text-slate-400 uppercase tracking-tighter bg-white/5 p-2 rounded text-center">
                                        Month: <span class="text-sky-400">${data.payments ? data.payments[data.payments.length-1].month : 'N/A'}</span>
                                    </div>
                                    <button onclick="window.location.href='https://wa.me/?text=Dear ${name}, your fee balance is ₹${bal}. Please pay soon.'" class="text-[8px] font-black bg-green-500/20 text-green-400 p-2 rounded text-center uppercase">Remind</button>
                                </div>
                            </div>
                        `;
                    });
                    container.innerHTML = html;

                    // Search Logic
                    document.getElementById('studentSearch').addEventListener('input', (e) => {
                        const term = e.target.value.toLowerCase();
                        document.querySelectorAll('.admin-card').forEach(card => {
                            const studentName = card.querySelector('h2').innerText.toLowerCase();
                            card.style.display = studentName.includes(term) ? 'block' : 'none';
                        });
                    });

                } else {
                    container.innerHTML = '<p class="text-center py-10 opacity-50 uppercase text-xs">No records in Database.</p>';
                }
            });
        }
    </script>
</body>
</html>
