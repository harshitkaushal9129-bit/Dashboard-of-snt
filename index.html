<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SNT Institute - Official Portal</title>
    
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#0f172a">
    <link rel="apple-touch-icon" href="./SNT.jpg">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        body { background-color: #0f172a; color: white; overflow-x: hidden; font-family: sans-serif; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); }
        .hidden { display: none !important; }
        .app-card { background: rgba(30, 41, 59, 0.6); border: 1px solid rgba(255,255,255,0.08); transition: 0.3s; cursor: pointer; }
        .app-card:hover { border-color: #38bdf8; transform: translateY(-3px); }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .animate-fade-in { animation: fadeIn 0.5s ease-in-out; }
        
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 100; display: none; align-items: center; justify-content: center; }
        .calc-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 15px; }
        .calc-btn { background: #1e293b; padding: 15px; border-radius: 12px; font-weight: bold; border: 1px solid #334155; color: white; transition: 0.2s; }
        .calc-btn:active { background: #38bdf8; transform: scale(0.95); }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <div id="auth-container" class="glass p-10 rounded-3xl w-full max-w-md shadow-2xl text-center">
        <img src="./SNT.jpg" class="w-24 h-24 mx-auto rounded-full border-2 border-sky-500 mb-6 shadow-lg shadow-sky-500/20">
        <h2 class="text-3xl font-bold text-sky-400 mb-2">SNT INSTITUTE</h2>
        <p class="text-slate-400 text-sm mb-8 italic">Authorized Access Only</p>

        <button onclick="loginWithGoogle()" class="w-full bg-white text-slate-900 p-4 rounded-2xl font-bold flex items-center justify-center gap-3 hover:bg-slate-200 transition-all shadow-xl active:scale-95">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" class="w-6">
            Continue with Google
        </button>
        <p class="mt-6 text-[10px] text-slate-500 uppercase tracking-widest">Powered by Firebase Security</p>
    </div>

    <div id="dashboard" class="hidden w-full max-w-5xl animate-fade-in">
        <header class="text-center mb-10">
            <div class="flex justify-between items-center mb-6">
                <button onclick="logout()" class="text-red-400 text-xs font-bold bg-red-900/20 px-4 py-2 rounded-lg border border-red-900/40 hover:bg-red-900/40">LOGOUT</button>
                <img id="user-profile-icon" src="./SNT.jpg" class="w-12 h-12 rounded-full border-2 border-sky-500 object-cover shadow-lg shadow-sky-500/20">
            </div>
            <h1 class="text-4xl font-black text-sky-400 uppercase tracking-tighter">SNT PORTAL</h1>
            <p id="user-display" class="text-slate-400 text-xs mt-2 font-mono"></p>
        </header>

        <div id="app-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4 pb-20">
            </div>
    </div>

    <div id="calc-modal" class="modal-overlay">
        <div class="glass p-6 rounded-3xl w-72 border border-sky-500/30 shadow-2xl">
            <div class="text-sky-400 text-[10px] font-bold tracking-widest mb-2 uppercase text-center">Security Check</div>
            <div id="calc-display" class="bg-slate-900 p-4 rounded-xl text-right text-2xl font-mono mb-4 border border-slate-700 h-16 flex items-center justify-end text-sky-400">0</div>
            <div class="calc-grid">
                <button class="calc-btn" onclick="pressNum('7')">7</button><button class="calc-btn" onclick="pressNum('8')">8</button><button class="calc-btn" onclick="pressNum('9')">9</button><button class="calc-btn bg-red-900/20 text-red-400" onclick="clearCalc()">C</button>
                <button class="calc-btn" onclick="pressNum('4')">4</button><button class="calc-btn" onclick="pressNum('5')">5</button><button class="calc-btn" onclick="pressNum('6')">6</button><button class="calc-btn" onclick="pressNum('0')">0</button>
                <button class="calc-btn" onclick="pressNum('1')">1</button><button class="calc-btn" onclick="pressNum('2')">2</button><button class="calc-btn" onclick="pressNum('3')">3</button>
                <button class="calc-btn bg-sky-600 text-white" onclick="verifyPass()">=</button>
            </div>
            <button onclick="closeCalc()" class="w-full mt-4 text-[10px] text-slate-500 uppercase font-bold">Cancel</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAOQtM_XYLqPgxMK1XBdfl0m7KoAseZRCA",
            authDomain: "snt-computer-institute.firebaseapp.com",
            projectId: "snt-computer-institute",
            appId: "1:117580784781:web:73ba19d2d008beb3a5eec4"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        // All links integrated
        const files = [
            { name: 'Dashboard', url: 'https://harshitkaushal9129-bit.github.io/snt-institute/dashboard.html', icon: 'fa-chart-pie', color: 'text-sky-400' },
            { name: 'Attendance', url: 'https://harshitkaushal9129-bit.github.io/snt-institute/attendence.html', icon: 'fa-calendar-check', color: 'text-green-400' },
            { name: 'Admin Panel', url: 'https://harshitkaushal9129-bit.github.io/snt-institute/admin.html', icon: 'fa-user-shield', color: 'text-red-400', locked: true },
            { name: 'ID Card', url: 'https://harshitkaushal9129-bit.github.io/snt-institute/id-card.html', icon: 'fa-id-card', color: 'text-yellow-400' },
            { name: 'Receipt', url: 'https://harshitkaushal9129-bit.github.io/snt-institute/receipt.html', icon: 'fa-file-invoice-dollar', color: 'text-orange-400' },
            { name: 'Verify', url: 'https://harshitkaushal9129-bit.github.io/snt-institute/verify.html', icon: 'fa-shield-alt', color: 'text-teal-400' },
            { name: 'Display', url: 'https://harshitkaushal9129-bit.github.io/snt-institute/display.html', icon: 'fa-desktop', color: 'text-pink-400', locked: true },
            { name: 'Calendar', url: 'https://harshitkaushal9129-bit.github.io/snt-institute/calendar.html', icon: 'fa-calendar-alt', color: 'text-blue-400' }
        ];

        // Render function
        function renderGrid() {
            const grid = document.getElementById('app-grid');
            grid.innerHTML = "";
            files.forEach(f => {
                const card = document.createElement('div');
                card.className = "app-card p-6 rounded-3xl text-center animate-fade-in";
                card.innerHTML = `
                    <i class="fas ${f.icon} text-3xl mb-3 ${f.color}"></i>
                    <p class="text-[10px] font-black uppercase tracking-widest">${f.name}</p>
                    ${f.locked ? '<i class="fas fa-lock text-[8px] text-slate-500 mt-2 block"></i>' : ''}
                `;
                card.onclick = () => {
                    if(f.locked) openCalc(f.url);
                    else window.location.href = f.url;
                };
                grid.appendChild(card);
            });
        }

        // Auth Functions
        window.loginWithGoogle = () => {
            signInWithPopup(auth, provider).catch(err => {
                console.error(err);
                alert("Login Failed: " + err.message);
            });
        };

        window.logout = () => signOut(auth);

        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('auth-container').classList.add('hidden');
                document.getElementById('dashboard').classList.remove('hidden');
                document.getElementById('user-display').innerText = user.email;
                document.getElementById('user-profile-icon').src = user.photoURL || "./SNT.jpg";
                renderGrid();
            } else {
                document.getElementById('auth-container').classList.remove('hidden');
                document.getElementById('dashboard').classList.add('hidden');
            }
        });

        // Calculator Logic
        let calcInput = ""; let targetUrl = "";
        window.openCalc = (url) => { 
            targetUrl = url; 
            document.getElementById('calc-modal').style.display = "flex"; 
            clearCalc(); 
        };
        window.closeCalc = () => document.getElementById('calc-modal').style.display = "none";
        window.pressNum = (n) => { 
            calcInput += n; 
            document.getElementById('calc-display').innerText = calcInput; 
        };
        window.clearCalc = () => { 
            calcInput = ""; 
            document.getElementById('calc-display').innerText = "0"; 
        };
        window.verifyPass = () => {
            if(calcInput === "1234") window.location.href = targetUrl;
            else { 
                alert("Wrong PIN!"); 
                clearCalc(); 
            }
        };
    </script>
</body>
</html>
