<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SNT Institute - Official Portal</title>
    
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#0f172a">
    <link rel="apple-touch-icon" href="./SNT.jpg">
    <link rel="icon" type="image/jpeg" href="SNT.jpg">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        body { background-color: #0f172a; color: white; overflow-x: hidden; font-family: 'Segoe UI', Tahoma, sans-serif; user-select: none; -webkit-tap-highlight-color: transparent; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); }
        .hidden { display: none !important; }
        .app-card { background: rgba(30, 41, 59, 0.6); border: 1px solid rgba(255,255,255,0.08); transition: 0.3s; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; aspect-ratio: 1/1; }
        .app-card:active { border-color: #38bdf8; transform: scale(0.95); background: rgba(56, 189, 248, 0.1); }
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 1000; display: none; align-items: center; justify-content: center; backdrop-filter: blur(8px); }
        .calc-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 15px; }
        .calc-btn { background: #1e293b; padding: 20px 10px; border-radius: 12px; font-weight: bold; border: 1px solid #334155; color: white; font-size: 1.2rem; text-align: center; }
        .calc-btn:active { background: #334155; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.5s ease-out forwards; }
        
        .info-row { display: flex; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .info-label { color: #94a3b8; font-size: 10px; text-transform: uppercase; font-weight: 800; letter-spacing: 1px; }
        .info-value { color: #f8fafc; font-size: 12px; font-weight: 600; }
        
        /* Contact Buttons */
        .contact-btn { padding: 8px; border-radius: 10px; font-size: 11px; font-weight: bold; display: flex; align-items: center; justify-content: center; gap: 6px; transition: 0.2s; }
    </style>
</head>
<body oncontextmenu="return false;">

    <div id="auth-container" class="flex flex-col items-center justify-center min-h-screen p-4">
        <div class="glass p-10 rounded-3xl w-full max-w-md shadow-2xl text-center border-t-4 border-sky-500">
            <img src="./SNT.jpg" class="w-28 h-28 mx-auto rounded-full border-4 border-sky-500 mb-6 shadow-2xl">
            <h2 class="text-3xl font-black text-white mb-2 tracking-tighter">SNT INSTITUTE</h2>
            <p class="text-sky-400 text-[10px] mb-8 uppercase tracking-[0.4em] font-bold opacity-80">Digital Student Portal</p>

            <button onclick="loginWithGoogle()" class="w-full bg-white text-slate-900 p-4 rounded-2xl font-black flex items-center justify-center gap-3 hover:bg-slate-200 transition-all shadow-xl active:scale-95">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" class="w-6">
                LOGIN WITH GOOGLE
            </button>
            <p class="mt-8 text-[9px] text-slate-500 uppercase tracking-widest font-bold">Secure Access Only</p>
        </div>
    </div>

    <div id="dashboard" class="hidden w-full max-w-5xl mx-auto p-4 md:p-8 animate-fade-in">
        <header class="flex justify-between items-center mb-8">
            <button onclick="logout()" class="text-red-400 text-[9px] font-black bg-red-900/20 px-4 py-2 rounded-lg border border-red-900/40 uppercase tracking-widest active:scale-90">Logout</button>
            <div class="text-center">
                <h1 class="text-xl font-black text-white tracking-tighter italic">SNT <span class="text-sky-500 font-black">OFFICIAL</span></h1>
            </div>
            <div class="flex gap-2">
                <button onclick="openInfo()" class="w-10 h-10 rounded-full glass flex items-center justify-center text-sky-400 active:scale-90">
                    <i class="fas fa-circle-info"></i>
                </button>
                <button onclick="shareApp()" class="w-10 h-10 rounded-full glass flex items-center justify-center text-sky-400 active:scale-90">
                    <i class="fas fa-share-nodes"></i>
                </button>
            </div>
        </header>

        <div id="profile-section" class="glass p-6 rounded-3xl mb-8 flex items-center gap-5 border-l-4 border-sky-500 shadow-2xl">
            <div class="relative">
                <img id="user-img" src="./SNT.jpg" class="w-20 h-20 rounded-full border-2 border-sky-500 object-cover bg-slate-800">
                <div class="absolute bottom-1 right-1 w-4 h-4 bg-green-500 border-2 border-[#0f172a] rounded-full"></div>
            </div>
            <div class="flex-1">
                <h3 id="user-name" class="text-lg font-black text-white leading-tight mb-0.5">Loading...</h3>
                <p id="user-email" class="text-slate-400 text-[10px] font-mono mb-2 italic opacity-60"></p>
                
                <p class="text-sky-300 text-[11px] font-bold flex items-center gap-2 mb-3">
                    <i class="fas fa-phone-alt text-[9px]"></i> <span id="mobile-val">Fetching...</span>
                </p>

                <div class="flex gap-2">
                    <span id="user-roll" class="text-[9px] bg-sky-500/10 text-sky-400 px-3 py-1 rounded border border-sky-500/20 font-black uppercase">ID: ...</span>
                    <span id="user-status-badge" class="text-[9px] bg-green-500/10 text-green-400 px-3 py-1 rounded border border-green-500/20 font-black uppercase">Member</span>
                </div>
            </div>
        </div>

        <div id="app-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4 pb-24"></div>
    </div>

    <div id="info-modal" class="modal-overlay">
        <div class="glass p-8 rounded-3xl w-80 border border-sky-500/30 shadow-2xl relative">
            <div class="text-center mb-6">
                <div class="w-16 h-16 bg-sky-500/20 rounded-2xl flex items-center justify-center mx-auto mb-4">
                    <i class="fas fa-microchip text-sky-400 text-2xl"></i>
                </div>
                <h2 class="text-xl font-black tracking-tighter uppercase">System Info</h2>
            </div>
            
            <div class="space-y-1 mb-6">
                <div class="info-row"><span class="info-label">Battery</span><span id="info-battery" class="info-value">Detecting...</span></div>
                <div class="info-row"><span class="info-label">Time</span><span id="info-time" class="info-value">00:00</span></div>
                <div class="info-row"><span class="info-label">Version</span><span class="info-value">2.0.4 Premium</span></div>
                <div class="info-row border-none"><span class="info-label">Developer</span><span class="info-value text-sky-400">Harshit Kaushal</span></div>
            </div>

            <p class="text-[9px] text-slate-500 font-black uppercase tracking-widest text-center mb-3">Contact Developer</p>
            <div class="grid grid-cols-2 gap-3">
                <a href="https://wa.me/919129191898" target="_blank" class="contact-btn bg-green-600/20 text-green-400 border border-green-600/30 active:scale-95">
                    <i class="fab fa-whatsapp"></i> WhatsApp
                </a>
                <a href="tel:9129191898" class="contact-btn bg-sky-600/20 text-sky-400 border border-sky-600/30 active:scale-95">
                    <i class="fas fa-phone"></i> Call Now
                </a>
            </div>

            <button onclick="closeInfo()" class="w-full mt-6 bg-slate-800 text-slate-400 p-3 rounded-xl font-black text-[10px] uppercase tracking-widest active:scale-95">Close</button>
        </div>
    </div>

    <div id="calc-modal" class="modal-overlay">
        <div class="glass p-6 rounded-3xl w-72 border border-sky-500/30 shadow-2xl">
            <div class="text-[10px] text-center font-black text-sky-500 uppercase tracking-[0.3em] mb-4">Security Access</div>
            <div id="calc-display" class="bg-slate-950 p-4 rounded-xl text-right text-2xl font-mono mb-5 border border-slate-800 h-16 flex items-center justify-end text-sky-400 shadow-inner">0</div>
            <div class="calc-grid">
                <button class="calc-btn" onclick="pressNum('7')">7</button><button class="calc-btn" onclick="pressNum('8')">8</button><button class="calc-btn" onclick="pressNum('9')">9</button><button class="calc-btn bg-red-900/20 text-red-500" onclick="clearCalc()">C</button>
                <button class="calc-btn" onclick="pressNum('4')">4</button><button class="calc-btn" onclick="pressNum('5')">5</button><button class="calc-btn" onclick="pressNum('6')">6</button><button class="calc-btn" onclick="pressNum('0')">0</button>
                <button class="calc-btn" onclick="pressNum('1')">1</button><button class="calc-btn" onclick="pressNum('2')">2</button><button class="calc-btn" onclick="pressNum('3')">3</button>
                <button class="calc-btn bg-sky-600 text-white" onclick="verifyPass()">OK</button>
            </div>
            <button onclick="closeCalc()" class="w-full mt-6 text-[10px] text-slate-500 uppercase font-bold text-center">Cancel</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getDatabase, ref, onValue, query, orderByChild, equalTo } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAOQtM_XYLqPgxMK1XBdfl0m7KoAseZRCA",
            authDomain: "snt-computer-institute.firebaseapp.com",
            projectId: "snt-computer-institute",
            databaseURL: "https://snt-computer-institute-default-rtdb.firebaseio.com",
            appId: "1:117580784781:web:73ba19d2d008beb3a5eec4"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);
        const provider = new GoogleAuthProvider();

        const menuItems = [
            { name: 'Dashboard', url: 'https://harshitkaushal9129-bit.github.io/snt-institute/Index.html', icon: 'fa-chart-pie', color: 'text-sky-400' },
            { name: 'Attendance', url: 'https://harshitkaushal9129-bit.github.io/snt-institute/attendence.html', icon: 'fa-calendar-check', color: 'text-green-400' },
            { name: 'Admin', url: 'https://harshitkaushal9129-bit.github.io/snt-institute/admin.html', icon: 'fa-user-shield', color: 'text-red-400', locked: true },
            { name: 'ID Card', url: 'https://harshitkaushal9129-bit.github.io/snt-institute/id-card.html', icon: 'fa-id-card', color: 'text-yellow-400' },
           { name: 'PDF Center', url: 'https://harshitkaushal9129-bit.github.io/Dashboard-of-snt/pdf.html', icon: 'fa-file-pdf', color: 'text-red-500' },
            { name: 'Receipt', url: 'https://harshitkaushal9129-bit.github.io/snt-institute/receipt.html', icon: 'fa-file-invoice-dollar', color: 'text-orange-400' },
            { name: 'Verify', url: 'https://harshitkaushal9129-bit.github.io/snt-institute/verify.html', icon: 'fa-shield-alt', color: 'text-teal-400' },
            { name: 'Display', url: 'https://harshitkaushal9129-bit.github.io/Dashboard-of-snt/display.html', icon: 'fa-desktop', color: 'text-pink-400', locked: true },
            { name: 'ID Verify', url: 'https://harshitkaushal9129-bit.github.io/snt-institute/id-verify.html', icon: 'fa-user-check', color: 'text-emerald-400' },
            { name: 'V-Receipt', url: 'https://harshitkaushal9129-bit.github.io/snt-institute/v-receipt.html', icon: 'fa-receipt', color: 'text-indigo-400' },
            { name: 'Calendar', url: 'https://harshitkaushal9129-bit.github.io/snt-institute/calendar.html', icon: 'fa-calendar-alt', color: 'text-blue-400' },
            { name: 'Basic Info', url: 'https://harshitkaushal9129-bit.github.io/snt-institute/basic.html', icon: 'fa-database', color: 'text-gray-400' }
        ];

        window.loginWithGoogle = () => signInWithPopup(auth, provider);
        window.logout = () => signOut(auth).then(() => location.reload());
        window.shareApp = () => { if (navigator.share) navigator.share({ title: 'SNT Portal', url: window.location.href }); };

        window.openInfo = async () => {
            document.getElementById('info-modal').style.display = "flex";
            if (navigator.getBattery) {
                const b = await navigator.getBattery();
                document.getElementById('info-battery').innerText = Math.round(b.level * 100) + "% " + (b.charging ? "⚡" : "🔋");
            }
            const now = new Date();
            document.getElementById('info-time').innerText = now.getHours() + ":" + String(now.getMinutes()).padStart(2, '0');
        };
        window.closeInfo = () => document.getElementById('info-modal').style.display = "none";

        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('auth-container').classList.add('hidden');
                document.getElementById('dashboard').classList.remove('hidden');
                
                const studentsRef = ref(db, 'students');
                const emailQuery = query(studentsRef, orderByChild('email'), equalTo(user.email));

                onValue(emailQuery, (snapshot) => {
                    if (snapshot.exists()) {
                        const rawData = snapshot.val();
                        const sData = Object.values(rawData)[0];
                        document.getElementById('user-name').innerText = sData.name || user.displayName;
                        document.getElementById('user-email').innerText = user.email;
                        document.getElementById('user-img').src = sData.profilePicture || sData.profilePic || user.photoURL || "./SNT.jpg";
                        document.getElementById('user-roll').innerText = "ID: " + (sData.studentId || "N/A");
                        document.getElementById('mobile-val').innerText = sData.mobile || sData.phone || "Not Linked";
                        
                        const statusEl = document.getElementById('user-status-badge');
                        if(sData.registrationStatus === "Pending") {
                            statusEl.innerText = "Pending";
                            statusEl.className = "text-[9px] bg-red-500/10 text-red-400 px-3 py-1 rounded border border-red-500/20 font-black uppercase";
                        } else {
                            statusEl.innerText = "Active";
                            statusEl.className = "text-[9px] bg-green-500/10 text-green-400 px-3 py-1 rounded border border-green-500/20 font-black uppercase";
                        }
                    } else {
                        document.getElementById('user-name').innerText = user.displayName;
                        document.getElementById('user-email').innerText = user.email;
                        document.getElementById('user-roll').innerText = "GUEST";
                        document.getElementById('mobile-val').innerText = "Update Profile";
                    }
                });
                renderMenu();
            } else {
                document.getElementById('auth-container').classList.remove('hidden');
                document.getElementById('dashboard').classList.add('hidden');
            }
        });

        function renderMenu() {
            const grid = document.getElementById('app-grid');
            grid.innerHTML = menuItems.map(item => `
                <div class="app-card p-4 rounded-3xl text-center shadow-lg" 
                     onclick="${item.locked ? `openCalc('${item.url}')` : `location.href='${item.url}'`}">
                    <i class="fas ${item.icon} text-3xl mb-3 ${item.color}"></i>
                    <p class="text-[9px] font-black uppercase tracking-widest text-slate-300">${item.name}</p>
                </div>
            `).join('');
        }

        let calcValue = ""; let target = "";
        window.openCalc = (url) => { target = url; document.getElementById('calc-modal').style.display = "flex"; clearCalc(); };
        window.closeCalc = () => document.getElementById('calc-modal').style.display = "none";
        window.pressNum = (n) => { if(calcValue.length < 6) calcValue += n; document.getElementById('calc-display').innerText = calcValue; };
        window.clearCalc = () => { calcValue = ""; document.getElementById('calc-display').innerText = "0"; };
        window.verifyPass = () => {
            if(calcValue === "912919") location.href = target;
            else { alert("PIN Incorrect!"); clearCalc(); }
        };

        document.onkeydown = e => { 
            if (e.keyCode == 123 || (e.ctrlKey && e.shiftKey && (e.keyCode == 73 || e.keyCode == 74))) return false; 
        };
    </script>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').catch(err => console.log('SW Fail'));
            });
        }
    </script>
</body>
</html>
