            /* index.html ke <style> mein ye add karein */
* {
    -webkit-user-select: none; /* Chrome/Safari */
    -moz-user-select: none;    /* Firefox */
    -ms-user-select: none;     /* IE10+ */
    user-select: none;         /* Standard */
    -webkit-user-drag: none;   /* Images drag nahi hongi */
}

        body { background-color: #0f172a; color: white; overflow-x: hidden; font-family: 'Segoe UI', Tahoma, sans-serif; user-select: none; -webkit-tap-highlight-color: transparent; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); }
        .hidden { display: none !important; }
        
        .app-card { background: rgba(30, 41, 59, 0.6); border: 1px solid rgba(255,255,255,0.08); transition: 0.3s; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; aspect-ratio: 1/1; border-radius: 24px; }
        .app-card:active { border-color: #38bdf8; transform: scale(0.95); background: rgba(56, 189, 248, 0.1); }
        
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 1000; display: none; align-items: center; justify-content: center; backdrop-filter: blur(8px); }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.5s ease-out forwards; }
        
        .info-row { display: flex; justify-content: space-between; align-items: center; padding: 14px 0; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .info-label { color: #94a3b8; font-size: 10px; text-transform: uppercase; font-weight: 800; letter-spacing: 1.5px; }
        .info-value { color: #f8fafc; font-size: 12px; font-weight: 600; }
        
        .social-link-icon { font-size: 20px; transition: 0.2s; cursor: pointer; }
        .qr-card { background: white; color: #1e293b; padding: 24px; border-radius: 30px; text-align: center; width: 300px; position: relative; }

        .search-box { background: rgba(30, 41, 59, 0.5); border: 1px solid rgba(56, 189, 248, 0.2); transition: 0.3s; }
        .search-box:focus-within { border-color: #38bdf8; background: rgba(30, 41, 59, 0.8); }
    </style>
</head>
<body oncontextmenu="return false;">

    <div id="dashboard" class="hidden w-full max-w-5xl mx-auto p-4 md:p-8 animate-fade-in">

            <h1 class="text-xl font-black text-white tracking-tighter italic">SNT <span class="text-sky-500 font-black">OFFICIAL</span></h1>

        <div id="profile-section" class="glass p-6 rounded-3xl mb-6 flex items-center gap-5 border-l-4 border-sky-500 shadow-2xl">

                <input type="text" id="appSearch" placeholder="SEARCH SERVICES..." class="bg-transparent border-none outline-none text-[11px] font-bold uppercase tracking-widest w-full text-white placeholder:text-slate-500">

    <div id="info-modal" class="modal-overlay">

            <div class="space-y-0 px-2">

                <div class="info-row"><span class="info-label">Version</span><span class="info-value">2.2.10 Pro</span></div>
                <div class="info-row"><span class="info-label">Developer</span><span class="info-value text-sky-400">Harshit Kaushal</span></div>
                <div class="info-row"><span class="info-label">Instagram</span><a href="https://www.instagram.com/invites/contact/?igsh=vucokp5w5lf4&utm_content=gji134o" target="_blank" class="text-pink-500 social-link-icon"><i class="fab fa-instagram"></i></a></div>
                <div class="info-row"><span class="info-label">YouTube</span><a href="https://youtube.com/@programmingby-kaushalji?si=OuViX3t9PwjNHUMB" target="_blank" class="text-red-500 social-link-icon"><i class="fab fa-youtube"></i></a></div>
                <div class="info-row"><span class="info-label">WhatsApp</span><a href="https://wa.me/919129191898" target="_blank" class="text-green-500 social-link-icon"><i class="fab fa-whatsapp"></i></a></div>
                <div class="info-row border-none"><span class="info-label">Support UPI</span><i onclick="openQR()" class="fas fa-qrcode text-sky-400 social-link-icon"></i></div>

            <button onclick="closeInfo()" class="w-full mt-8 bg-slate-800/50 text-slate-400 p-4 rounded-2xl font-black text-[11px] uppercase tracking-widest border border-white/5 active:scale-95 transition-all">Close Panel</button>

    <div id="qr-modal" class="modal-overlay" onclick="closeQR()">
        <div class="qr-card animate-fade-in" onclick="event.stopPropagation()">
            <div class="flex justify-between items-center mb-4">
                <h3 class="font-black text-slate-900 uppercase text-xs tracking-widest">Scan to Support</h3>
                <button onclick="closeQR()" class="text-slate-400 hover:text-red-500"><i class="fas fa-times-circle text-xl"></i></button>
            </div>
            <div class="bg-slate-100 p-4 rounded-2xl mb-4">
                <img src="https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=upi://pay?pa=mandavikaushal913@okaxis&pn=Harshit%20Kaushal&cu=INR" class="mx-auto w-44 h-44 shadow-sm">
            </div>
            <p class="text-xs font-black text-sky-600 break-all">mandavikaushal913@okaxis</p>
        </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getDatabase, ref, onValue, get, set, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAOQtM_XYLqPgxMK1XBdfl0m7KoAseZRCA",
            authDomain: "snt-computer-institute.firebaseapp.com",
            projectId: "snt-computer-institute",
            databaseURL: "https://snt-computer-institute-default-rtdb.firebaseio.com",
            appId: "1:117580784781:web:73ba19d2d008beb3a5eec4"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);
        const provider = new GoogleAuthProvider();

        // 1. Service Worker & Notification Handler
        if ('serviceWorker' in navigator) {
            navigator.serviceWorker.register('./sw.js').then(reg => {
                console.log('Service Worker Active');
            });
        }

        function triggerLockScreenNotification(title, message) {
            if ('serviceWorker' in navigator && Notification.permission === 'granted') {
                navigator.serviceWorker.ready.then(function(registration) {
                    registration.showNotification(title, {
                        body: message,
                        icon: './SNT.jpg',
                        badge: './SNT.jpg',
                        vibrate: [500, 110, 500, 110, 450, 110, 200, 110, 170, 40, 450, 110, 200, 110, 170, 40],
                        tag: 'snt-dynamic-update',
                        requireInteraction: true 
                    });
                });
            }
        }

        // 2. Main Logic: Auth + Student Name + Database Notification
        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('auth-container').classList.add('hidden');
                document.getElementById('dashboard').classList.remove('hidden');
                
                const hr = new Date().getHours();
                const greet = hr < 12 ? "Good Morning" : hr < 17 ? "Good Afternoon" : "Good Evening";
                document.getElementById('greeting-msg').innerText = greet;

                onValue(ref(db, 'students'), (snapshot) => {
                    if (snapshot.exists()) {
                        const sData = Object.values(snapshot.val()).find(s => s.email === user.email);
                        if (sData) {
                            const studentFirstName = sData.name.split(' ')[0];
                            document.getElementById('user-name').innerText = sData.name || user.displayName;
                            document.getElementById('user-email').innerText = user.email;
                            document.getElementById('user-img').src = sData.profilePic || sData.profilePicture || user.photoURL;
                            document.getElementById('user-roll').innerText = "ID: " + (sData.studentId || "NEW");
                            
                            const statusEl = document.getElementById('user-status-badge');
                            const status = sData.registrationStatus || "Guest User";
                            statusEl.innerText = status;
                            statusEl.className = status === "Active" ? 
                                "text-[9px] bg-green-500/10 text-green-400 px-3 py-1 rounded border border-green-500/20 font-black uppercase" : 
                                "text-[9px] bg-slate-500/10 text-slate-400 px-3 py-1 rounded border border-slate-500/20 font-black uppercase";

                            // DYNAMIC NOTIFICATION LISTENER
                            onValue(ref(db, 'notifications'), (notifSnap) => {
                                if (notifSnap.exists()) {
                                    const notices = Object.values(notifSnap.val());
                                    const latestNotif = notices[notices.length - 1]; // Get latest upload
                                    
                                    // Use last_notif_id to prevent repeat popups
                                    const lastSeenId = localStorage.getItem('last_notif_id');
                                    
                                    if (latestNotif.id !== lastSeenId) {
                                        Notification.requestPermission().then(perm => {
                                            if (perm === 'granted') {
                                                triggerLockScreenNotification(
                                                    `Namaste, ${studentFirstName}!`, 
                                                    latestNotif.text || latestNotif.message || "SNT Portal par naya update aaya hai."
                                                );
                                                localStorage.setItem('last_notif_id', latestNotif.id);
                                            }
                                        });
                                    }
                                }
                            });
                        }
                    }
                });

                renderMenu();
            }
        });

        // 3. Grid Menu
        function renderMenu() {
            const menuItems = [
                { name: 'Dashboard', url: 'https://harshitkaushal9129-bit.github.io/snt-institute/Index.html', icon: 'fa-chart-pie', color: 'text-sky-400' },
                { name: 'Attendance', url: 'https://harshitkaushal9129-bit.github.io/Dashboard-of-snt/attendence.html', icon: 'fa-calendar-check', color: 'text-green-400' },
                { name: 'Certificate', url: 'https://harshitkaushal9129-bit.github.io/snt-institute/basic.html', icon: 'fa-user-shield', color: 'text-red-400' },
                { name: 'ID Card', url: 'https://harshitkaushal9129-bit.github.io/snt-institute/id-card.html', icon: 'fa-id-card', color: 'text-yellow-400' },
                { name: 'PDF Center', url: 'https://harshitkaushal9129-bit.github.io/Pdf-reader/index.html', icon: 'fa-file-pdf', color: 'text-red-500' },
                { name: 'Receipt', url: 'https://harshitkaushal9129-bit.github.io/snt-institute/receipt.html', icon: 'fa-file-invoice-dollar', color: 'text-orange-400' },
                { name: 'Display', url: 'https://harshitkaushal9129-bit.github.io/Dashboard-of-snt/display.html', icon: 'fa-desktop', color: 'text-pink-400' },
                { name: 'Calendar', url: 'https://harshitkaushal9129-bit.github.io/Dashboard-of-snt/calendar.html', icon: 'fa-calendar-alt', color: 'text-blue-400' }, 
                { name: 'CBT Exam', url: 'https://harshitkaushal9129-bit.github.io/snt-institute/quiz.html', icon: 'fa-laptop-code', color: 'text-emerald-400' },
                { name: 'Exam Form', url: 'https://harshitkaushal9129-bit.github.io/snt-institute/examination.html', icon: 'fa-file-signature', color: 'text-orange-400' },
                { name: 'Admit Card', url: 'https://harshitkaushal9129-bit.github.io/snt-institute/admit_card.html', icon: 'fa-address-card', color: 'text-blue-400' },
                { name: 'Results', url: './result-history.html', icon: 'fa-history', color: 'text-orange-400' },
            ];
            const grid = document.getElementById('app-grid');
            grid.innerHTML = menuItems.map(item => `
                <div class="app-card p-4" onclick="location.href='${item.url}'">
                    <i class="fas ${item.icon} text-3xl mb-3 ${item.color}"></i>
                    <p class="text-[9px] font-black uppercase text-slate-300 text-center">${item.name}</p>
                </div>
            `).join('');
            
            document.getElementById('appSearch').addEventListener('input', (e) => {
                const term = e.target.value.toLowerCase();
                document.querySelectorAll('.app-card').forEach(card => {
                    card.style.display = card.querySelector('p').innerText.toLowerCase().includes(term) ? 'flex' : 'none';
                });
            });
        }

        // 4. Utility Functions
        window.loginWithGoogle = async () => {
            try {
                const result = await signInWithPopup(auth, provider);
                const user = result.user;
                const snapshot = await get(ref(db, 'students'));
                let existingId = null;
                if (snapshot.exists()) {
                    existingId = Object.keys(snapshot.val()).find(key => snapshot.val()[key].email === user.email);
                }
                if (existingId) {
                    await update(ref(db, `students/${existingId}`), { lastLogin: new Date().toLocaleString(), profilePic: user.photoURL });
                } else {
                    await set(ref(db, `students/${user.uid}`), { name: user.displayName, email: user.email, profilePic: user.photoURL, registrationStatus: "Guest User", joinDate: new Date().toLocaleString(), studentId: "NEW" });
                }
            } catch (error) { console.error("Login Error", error); }
        };

        window.logout = () => signOut(auth).then(() => location.reload());
        window.openNotifications = () => { location.href = './notifications_view.html'; };
        window.openInfo = async () => { 
            document.getElementById('info-modal').style.display = "flex"; 
            if (navigator.getBattery) { 
                const b = await navigator.getBattery(); 
                document.getElementById('info-battery').innerText = Math.round(b.level * 100) + "%"; 
            } 
        };
        window.closeInfo = () => document.getElementById('info-modal').style.display = "none";
        window.openQR = () => document.getElementById('qr-modal').style.display = "flex";
        window.closeQR = () => document.getElementById('qr-modal').style.display = "none";
        window.shareApp = () => { if (navigator.share) navigator.share({ title: 'SNT Portal', url: window.location.href }); };
    </script>
    <script>
/**
 * SNT PORTAL - MULTI-LAYER SECURITY SHIELD
 * Developer: Harshit Kaushal
 * Purpose: Block DevTools, Inspect Element, and Source View
 */

(function() {
    // 1. Right-Click Block (Mouse and Touch)
    document.addEventListener('contextmenu', (e) => e.preventDefault());

    // 2. Keyboard Shortcuts Block (F12, Ctrl+Shift+I, J, C, U, S)
    document.onkeydown = function(e) {
        if (
            e.keyCode === 123 || // F12
            (e.ctrlKey && e.shiftKey && (e.keyCode === 73 || e.keyCode === 74 || e.keyCode === 67)) || // Ctrl+Shift+I, J, C
            (e.ctrlKey && (e.keyCode === 85 || e.keyCode === 83)) // Ctrl+U (Source), Ctrl+S (Save)
        ) {
            alert("Security Alert: SNT Portal Restricted Action!");
            return false;
        }
    };

    // 3. Selection, Dragging, and Copy-Paste Block
    document.addEventListener('selectstart', (e) => e.preventDefault());
    document.addEventListener('dragstart', (e) => e.preventDefault());
    document.addEventListener('copy', (e) => e.preventDefault());

    // 4. Advanced DevTools Detection & Auto-Reload
    // Agar koi user browser window ka size chota karke DevTools kholne ki koshish karega
    const devtoolsDetector = function() {
        const threshold = 160;
        const widthDiff = window.outerWidth - window.innerWidth > threshold;
        const heightDiff = window.outerHeight - window.innerHeight > threshold;

        if (widthDiff || heightDiff) {
            // DevTools detect hote hi page reload kar do ya alert dikhao
            window.location.reload();
            console.clear();
        }
    };

    // Har 500ms par check karega
    setInterval(devtoolsDetector, 500);

    // 5. Console Cleansing
    // Agar koi kisi tarah console tak pahuch jaye, toh usey kuch dikhega nahi
    setInterval(() => {
        console.clear();
        console.log("%cSTOP! ACCESS DENIED", "color: red; font-size: 30px; font-weight: bold;");
        console.log("%cSNT Official Portal - Developed by Harshit Kaushal", "color: skyblue; font-size: 14px;");
    }, 1000);

    // 6. CSS Layer Injection (Selection Shield)
    const style = document.createElement('style');
    style.innerHTML = `
        * {
            -webkit-user-select: none !important;
            -moz-user-select: none !important;
            -ms-user-select: none !important;
            user-select: none !important;
            -webkit-touch-callout: none !important;
            -webkit-user-drag: none !important;
        }
    `;
    document.head.appendChild(style);
    
    console.log("SNT Security Layer: Active");
})();
</script>
