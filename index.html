<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SNT Portal Pro</title>
    
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#020617">
    <link rel="apple-touch-icon" href="./SNT.jpg">
    <link rel="icon" type="image/jpeg" href="SNT.jpg">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        body { background-color: #020617; color: white; overflow-x: hidden; font-family: 'Segoe UI', system-ui, sans-serif; user-select: none; -webkit-tap-highlight-color: transparent; }
        .glass { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,0.05); }
        .hidden { display: none !important; }
        
        /* App Cards */
        .app-card { background: rgba(30, 41, 59, 0.4); border: 1px solid rgba(255,255,255,0.05); transition: 0.3s cubic-bezier(0.4, 0, 0.2, 1); cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; aspect-ratio: 1/1; border-radius: 28px; }
        .app-card:active { transform: scale(0.9); background: rgba(56, 189, 248, 0.1); border-color: #38bdf8; }
        
        /* Premium Calculator Design */
        .calc-modal { position: fixed; inset: 0; background: rgba(2, 6, 23, 0.98); z-index: 3000; display: none; align-items: center; justify-content: center; backdrop-filter: blur(15px); }
        .calc-box { width: 320px; background: #0f172a; border-radius: 40px; padding: 30px; border: 1px solid rgba(56, 189, 248, 0.2); box-shadow: 0 0 50px rgba(56, 189, 248, 0.1); }
        .calc-screen { background: #020617; border-radius: 20px; padding: 20px; text-align: right; margin-bottom: 25px; border: 1px solid rgba(255,255,255,0.05); }
        .calc-screen .val { font-family: 'Courier New', monospace; font-size: 2.2rem; color: #38bdf8; text-shadow: 0 0 10px rgba(56, 189, 248, 0.5); font-weight: bold; height: 40px; }
        .calc-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 12px; }
        .c-btn { height: 60px; border-radius: 18px; display: flex; items-center; justify-content: center; font-size: 1.25rem; font-weight: 800; transition: 0.2s; background: #1e293b; color: #f8fafc; border: none; }
        .c-btn:active { background: #38bdf8; color: #0f172a; transform: scale(0.9); }
        .c-btn-action { background: #334155; color: #ef4444; }
        .c-btn-ok { background: #0369a1; color: white; grid-column: span 2; }

        /* Info Drawer */
        #info-drawer { position: fixed; inset: 0; background: #020617; z-index: 2000; display: none; flex-direction: column; padding: 24px; animation: slideUp 0.4s cubic-bezier(0.4, 0, 0.2, 1); }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.5s ease-out forwards; }
    </style>
</head>
<body oncontextmenu="return false;">

    <div id="auth-container" class="flex flex-col items-center justify-center min-h-screen p-4">
        <div class="glass p-10 rounded-[45px] w-full max-w-md text-center border-b-8 border-sky-600 shadow-2xl">
            <img src="./SNT.jpg" class="w-24 h-24 mx-auto rounded-full border-4 border-sky-500 mb-6 shadow-lg">
            <h2 class="text-3xl font-black mb-1 tracking-tighter">SNT PORTAL</h2>
            <p class="text-sky-500 text-[9px] mb-10 uppercase tracking-[0.5em] font-bold">Secure Student OS</p>
            <button onclick="loginWithGoogle()" class="w-full bg-white text-slate-950 p-4 rounded-3xl font-black flex items-center justify-center gap-3 active:scale-95 transition-all shadow-xl">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" class="w-6"> LOGIN WITH GOOGLE
            </button>
        </div>
    </div>

    <div id="dashboard" class="hidden w-full max-w-5xl mx-auto p-4 md:p-8 animate-fade-in">
        <header class="flex justify-between items-center mb-8">
            <button onclick="toggleInfo(true)" class="w-12 h-12 rounded-2xl glass flex items-center justify-center text-sky-400 active:scale-90">
                <i class="fas fa-grid-2 text-lg"></i><i class="fas fa-info-circle"></i>
            </button>
            <div class="text-center">
                <h1 class="text-xl font-black italic tracking-tighter">SNT <span class="text-sky-500">PRO</span></h1>
            </div>
            <button onclick="logout()" class="w-12 h-12 rounded-2xl glass flex items-center justify-center text-red-500 active:scale-90">
                <i class="fas fa-power-off"></i>
            </button>
        </header>

        <div id="profile-section" class="glass p-6 rounded-[35px] mb-8 flex items-center gap-5 border-l-4 border-sky-500 shadow-xl">
            <div class="relative">
                <img id="user-img" src="./SNT.jpg" class="w-20 h-20 rounded-full border-2 border-sky-500 bg-slate-800 object-cover">
                <div class="absolute bottom-1 right-1 w-4 h-4 bg-green-500 border-2 border-[#020617] rounded-full shadow-sm"></div>
            </div>
            <div class="flex-1">
                <h3 id="user-name" class="text-lg font-black leading-tight tracking-tight">Loading...</h3>
                <p id="user-email" class="text-slate-500 text-[10px] font-mono mb-2 italic opacity-70"></p>
                <div class="flex gap-2">
                    <span id="user-roll" class="text-[9px] bg-sky-500/10 text-sky-400 px-3 py-1 rounded-lg border border-sky-500/20 font-black">ID: ...</span>
                    <span id="user-status-badge" class="text-[9px] bg-green-500/10 text-green-400 px-3 py-1 rounded-lg border border-green-500/20 font-black">ACTIVE</span>
                </div>
            </div>
        </div>

        <div id="app-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4 pb-28"></div>
    </div>

    <div id="info-drawer">
        <div class="flex justify-between items-center mb-10">
            <div>
                <h2 class="text-2xl font-black text-white tracking-tighter">System Info</h2>
                <p class="text-sky-500 text-[10px] font-bold tracking-widest uppercase">Version 2.2.0 Build</p>
            </div>
            <button onclick="toggleInfo(false)" class="w-12 h-12 rounded-full bg-slate-900 flex items-center justify-center text-white active:scale-90">
                <i class="fas fa-times text-xl"></i>
            </button>
        </div>

        <div class="space-y-4 flex-1">
            <div class="glass p-6 rounded-[30px] grid grid-cols-2 gap-4">
                <div class="bg-slate-900/50 p-4 rounded-2xl border border-white/5">
                    <p class="text-[9px] text-slate-500 font-bold uppercase mb-1">Lead Dev</p>
                    <p class="text-xs font-bold uppercase tracking-wider">Harshit Kaushal</p>
                </div>
                <div class="bg-slate-900/50 p-4 rounded-2xl border border-white/5">
                    <p class="text-[9px] text-slate-500 font-bold uppercase mb-1">Status</p>
                    <p class="text-xs font-bold text-green-500 uppercase tracking-wider">Operational</p>
                </div>
                <div class="bg-slate-900/50 p-4 rounded-2xl col-span-2 flex justify-between items-center border border-white/5">
                    <div>
                        <p class="text-[9px] text-slate-500 font-bold uppercase mb-1">Network Time</p>
                        <p id="current-time-sync" class="text-lg font-mono font-bold text-sky-400">00:00:00</p>
                    </div>
                    <i class="fas fa-bolt text-sky-900 text-3xl"></i>
                </div>
            </div>
        </div>
        <div class="text-center pb-6">
            <p class="text-slate-700 text-[9px] font-black tracking-[0.4em] uppercase">SNT IT Division • 2026</p>
        </div>
    </div>

    <div id="calc-modal" class="calc-modal">
        <div class="calc-box animate-fade-in">
            <div class="text-center mb-6">
                <i class="fas fa-lock text-sky-500 mb-2"></i>
                <p class="text-[10px] font-black text-slate-500 tracking-[0.3em] uppercase">Enter Master PIN</p>
            </div>
            <div class="calc-screen">
                <div id="calc-display" class="val">0</div>
            </div>
            <div class="calc-grid">
                <button class="c-btn" onclick="pressNum('7')">7</button><button class="c-btn" onclick="pressNum('8')">8</button><button class="c-btn" onclick="pressNum('9')">9</button><button class="c-btn c-btn-action" onclick="clearCalc()">AC</button>
                <button class="c-btn" onclick="pressNum('4')">4</button><button class="c-btn" onclick="pressNum('5')">5</button><button class="c-btn" onclick="pressNum('6')">6</button><button class="c-btn c-btn-action" onclick="deleteLast()"><i class="fas fa-backspace"></i></button>
                <button class="c-btn" onclick="pressNum('1')">1</button><button class="c-btn" onclick="pressNum('2')">2</button><button class="c-btn" onclick="pressNum('3')">3</button><button class="c-btn" onclick="pressNum('0')">0</button>
                <button class="c-btn c-btn-action" onclick="closeCalc()" style="color:white">Exit</button>
                <button class="c-btn c-btn-ok" onclick="verifyPass()">VERIFY</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getDatabase, ref, onValue, query, orderByChild, equalTo } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAOQtM_XYLqPgxMK1XBdfl0m7KoAseZRCA",
            authDomain: "snt-computer-institute.firebaseapp.com",
            projectId: "snt-computer-institute",
            databaseURL: "https://snt-computer-institute-default-rtdb.firebaseio.com",
            appId: "1:117580784781:web:73ba19d2d008beb3a5eec4"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);
        const provider = new GoogleAuthProvider();

        const menuItems = [
            { name: 'Dashboard', url: './Index.html', icon: 'fa-chart-pie', color: 'text-sky-400' },
            { name: 'Attendance', url: './attendence.html', icon: 'fa-calendar-check', color: 'text-green-400' },
            { name: 'Admin', url: './admin.html', icon: 'fa-user-shield', color: 'text-red-400', locked: true },
            { name: 'ID Card', url: './id-card.html', icon: 'fa-id-card', color: 'text-yellow-400' },
            { name: 'Verify', url: './verify.html', icon: 'fa-shield-alt', color: 'text-teal-400' },
            { name: 'Display', url: './display.html', icon: 'fa-desktop', color: 'text-pink-400', locked: true },
            { name: 'Receipt', url: './receipt.html', icon: 'fa-file-invoice-dollar', color: 'text-orange-400' },
            { name: 'History', url: './calendar.html', icon: 'fa-history', color: 'text-blue-400' }
        ];

        window.loginWithGoogle = () => signInWithPopup(auth, provider);
        window.logout = () => signOut(auth).then(() => location.reload());

        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('auth-container').classList.add('hidden');
                document.getElementById('dashboard').classList.remove('hidden');
                onValue(query(ref(db, 'students'), orderByChild('email'), equalTo(user.email)), (snap) => {
                    if (snap.exists()) {
                        const s = Object.values(snap.val())[0];
                        document.getElementById('user-name').innerText = s.name || user.displayName;
                        document.getElementById('user-email').innerText = user.email;
                        document.getElementById('user-img').src = s.profilePicture || s.profilePic || user.photoURL || "./SNT.jpg";
                        document.getElementById('user-roll').innerText = "ID: " + (s.studentId || "USER");
                    } else {
                        document.getElementById('user-name').innerText = user.displayName;
                        document.getElementById('user-email').innerText = user.email;
                    }
                });
                renderMenu();
            }
        });

        function renderMenu() {
            const grid = document.getElementById('app-grid');
            grid.innerHTML = menuItems.map(item => `
                <div class="app-card p-4 text-center shadow-lg" onclick="${item.locked ? `openCalc('${item.url}')` : `location.href='${item.url}'`}">
                    <i class="fas ${item.icon} text-3xl mb-3 ${item.color}"></i>
                    <p class="text-[9px] font-black uppercase tracking-widest text-slate-400">${item.name}</p>
                </div>
            `).join('');
        }

        // --- CALCULATOR LOGIC ---
        let calcVal = ""; let target = "";
        window.openCalc = (url) => { target = url; document.getElementById('calc-modal').style.display = "flex"; clearCalc(); };
        window.closeCalc = () => document.getElementById('calc-modal').style.display = "none";
        window.pressNum = (n) => { if(calcVal.length < 6) { calcVal += n; updateDisplay(); } };
        window.deleteLast = () => { calcVal = calcVal.slice(0, -1); updateDisplay(); };
        window.clearCalc = () => { calcVal = ""; updateDisplay(); };
        function updateDisplay() { document.getElementById('calc-display').innerText = calcVal || "0"; }
        window.verifyPass = () => {
            if(calcVal === "912919") location.href = target;
            else { alert("PIN Incorrect!"); clearCalc(); }
        };

        // --- INFO DRAWER ---
        window.toggleInfo = (show) => { document.getElementById('info-drawer').style.display = show ? "flex" : "none"; };

        // --- TIME SYNC ---
        setInterval(() => {
            document.getElementById('current-time-sync').innerText = new Date().toLocaleTimeString();
        }, 1000);

        

        // --- SECURITY BLOCK ---
        document.onkeydown = e => { if (e.keyCode == 123 || (e.ctrlKey && e.shiftKey && (e.keyCode == 73 || e.keyCode == 74))) return false; };
    </script>
    <script>

// --- SERVICE WORKER REGISTRATION ---
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js').then(() => console.log("SW Registered")).catch(err => console.log("SW Fail", err));
            });
        }

        
    </script>
</body>
</html>
