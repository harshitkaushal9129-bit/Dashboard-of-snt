<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SNT Institute - Google Login</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        body { background-color: #0f172a; color: white; font-family: sans-serif; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); }
        .hidden { display: none !important; }
        .app-card { background: rgba(30, 41, 59, 0.6); border: 1px solid rgba(255,255,255,0.08); transition: 0.3s; cursor: pointer; }
        .app-card:hover { border-color: #38bdf8; transform: translateY(-3px); }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <div id="auth-container" class="glass p-10 rounded-3xl w-full max-w-md shadow-2xl text-center">
        <img src="./SNT.jpg" class="w-24 h-24 mx-auto rounded-full border-2 border-sky-500 mb-6">
        <h2 class="text-3xl font-bold text-sky-400 mb-2">SNT Portal</h2>
        <p class="text-slate-400 text-sm mb-8">Login with your verified Gmail account</p>

        <button onclick="loginWithGoogle()" class="w-full bg-white text-slate-900 p-4 rounded-xl font-bold flex items-center justify-center gap-3 hover:bg-slate-200 transition-all shadow-lg">
            <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" class="w-6">
            Sign in with Google
        </button>
    </div>

    <div id="dashboard" class="hidden w-full max-w-5xl animate-fade-in">
        <header class="flex justify-between items-center mb-10">
            <button onclick="logout()" class="text-red-400 font-bold bg-red-900/20 px-6 py-2 rounded-xl border border-red-900/50">Logout</button>
            <div class="text-center">
                <h1 class="text-3xl font-bold text-sky-400 uppercase tracking-widest">SNT Institute</h1>
                <p id="user-info" class="text-sm text-slate-400 mt-1"></p>
            </div>
            <img id="user-img" src="./SNT.jpg" class="w-14 h-14 rounded-full border-2 border-sky-500 object-cover">
        </header>
        <div id="app-grid" class="grid grid-cols-2 md:grid-cols-4 gap-6"></div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAOQtM_XYLqPgxMK1XBdfl0m7KoAseZRCA",
            authDomain: "snt-computer-institute.firebaseapp.com",
            projectId: "snt-computer-institute",
            appId: "1:117580784781:web:73ba19d2d008beb3a5eec4"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const provider = new GoogleAuthProvider();

        // --- GOOGLE LOGIN ---
        window.loginWithGoogle = () => {
            signInWithPopup(auth, provider)
            .then(() => console.log("Success!"))
            .catch(e => alert("Error: " + e.message));
        };

        // --- AUTH OBSERVER ---
        onAuthStateChanged(auth, (user) => {
            const authUi = document.getElementById('auth-container');
            const dashUi = document.getElementById('dashboard');
            
            if (user) {
                authUi.classList.add('hidden');
                dashUi.classList.remove('hidden');
                document.getElementById('user-info').innerText = user.displayName + " (" + user.email + ")";
                document.getElementById('user-img').src = user.photoURL || "./SNT.jpg";
                renderApps();
            } else {
                authUi.classList.remove('hidden');
                dashUi.classList.add('hidden');
            }
        });

        function renderApps() {
            const grid = document.getElementById('app-grid');
            const apps = [
                { name: 'Dashboard', icon: 'fa-chart-line', color: 'text-sky-400' },
                { name: 'Attendance', icon: 'fa-user-check', color: 'text-green-400' },
                { name: 'Profile', icon: 'fa-id-badge', color: 'text-pink-400' },
                { name: 'Admin', icon: 'fa-user-shield', color: 'text-red-400' }
            ];
            grid.innerHTML = apps.map(a => `
                <div class="app-card p-8 rounded-3xl text-center">
                    <i class="fas ${a.icon} text-4xl mb-4 ${a.color}"></i>
                    <p class="text-xs font-bold uppercase tracking-widest">${a.name}</p>
                </div>
            `).join('');
        }

        window.logout = () => signOut(auth);
    </script>
</body>
</html>
