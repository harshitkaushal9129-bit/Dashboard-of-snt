<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SNT Institute - Secure Login</title>
    
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#0f172a">
    <link rel="apple-touch-icon" href="./SNT.jpg">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        body { background-color: #0f172a; color: white; overflow-x: hidden; font-family: sans-serif; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); }
        .hidden { display: none !important; }
        .app-card { background: rgba(30, 41, 59, 0.6); border: 1px solid rgba(255,255,255,0.08); transition: 0.3s; cursor: pointer; }
        .app-card:hover { border-color: #38bdf8; transform: translateY(-3px); }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .animate-fade-in { animation: fadeIn 0.5s ease-in-out; }
        
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); z-index: 100; display: none; align-items: center; justify-content: center; }
        .calc-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 15px; }
        .calc-btn { background: #1e293b; padding: 15px; border-radius: 12px; font-weight: bold; border: 1px solid #334155; color: white; }
        .calc-btn:active { background: #38bdf8; }
        
        input::-webkit-outer-spin-button,
        input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
    </style>
</head>
<body class="flex items-center justify-center min-h-screen p-4">

    <div id="auth-container" class="glass p-8 rounded-3xl w-full max-w-md shadow-2xl">
        <div class="text-center mb-6">
            <img src="./SNT.jpg" class="w-20 h-20 mx-auto rounded-full border-2 border-sky-500 mb-4">
            <h2 id="auth-title" class="text-2xl font-bold text-sky-400">Welcome Back</h2>
            <p id="auth-subtitle" class="text-slate-400 text-sm">Please login to continue</p>
        </div>

        <div id="reg-methods" class="hidden flex bg-slate-800 p-1 rounded-xl mb-6">
            <button onclick="setMethod('email')" id="m-email" class="flex-1 py-2 rounded-lg text-xs font-bold bg-sky-600">EMAIL</button>
            <button onclick="setMethod('phone')" id="m-phone" class="flex-1 py-2 rounded-lg text-xs font-bold">MOBILE</button>
        </div>

        <div class="space-y-4">
            <div id="email-group">
                <input type="email" id="email" placeholder="Email Address" class="w-full p-4 rounded-xl bg-slate-800 border border-slate-700 focus:outline-none focus:border-sky-500 text-white mb-4">
                <input type="password" id="password" placeholder="Password" class="w-full p-4 rounded-xl bg-slate-800 border border-slate-700 focus:outline-none focus:border-sky-500 text-white">
            </div>

            <div id="phone-group" class="hidden">
                <input type="tel" id="mobile-input" placeholder="+91 XXXXXXXXXX" class="w-full p-4 rounded-xl bg-slate-800 border border-slate-700 focus:outline-none focus:border-sky-500 text-white mb-2">
                <div id="recaptcha-container" class="mb-2"></div>
                <div id="otp-area" class="hidden">
                    <input type="number" id="otp-input" placeholder="Enter 6-digit OTP" class="w-full p-4 rounded-xl bg-slate-800 border border-slate-700 focus:outline-none focus:border-sky-500 text-white">
                </div>
            </div>

            <button id="mainBtn" onclick="handleAuth()" class="w-full bg-sky-600 hover:bg-sky-500 p-4 rounded-xl font-bold transition-all shadow-lg">Login</button>
        </div>

        <p class="mt-6 text-center text-sm text-slate-400">
            <span id="toggleText">Don't have an account?</span>
            <button onclick="toggleAuthMode()" id="toggleBtn" class="text-sky-400 font-bold ml-1">Register</button>
        </p>
    </div>

    <div id="dashboard" class="hidden w-full max-w-5xl animate-fade-in">
        <header class="text-center mb-10">
            <div class="flex justify-between items-center mb-6">
                <button onclick="logout()" class="text-red-400 text-sm font-bold bg-red-900/20 px-4 py-2 rounded-lg border border-red-900/50">Logout</button>
                <img id="user-profile-icon" src="./SNT.jpg" onclick="toggleUserModal()" class="w-12 h-12 rounded-full border border-sky-500 cursor-pointer object-cover">
            </div>
            <h1 class="text-3xl font-bold text-sky-400 uppercase tracking-tighter">SNT Dashboard</h1>
            <p id="user-display" class="text-slate-400 text-sm italic mt-1"></p>
        </header>

        <div id="app-grid" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-4 pb-20"></div>
    </div>

    <div id="user-modal" class="modal-overlay">
        <div class="glass p-8 rounded-3xl w-80 text-center relative">
            <button onclick="toggleUserModal()" class="absolute top-4 right-4 text-slate-400"><i class="fas fa-times"></i></button>
            <img id="modal-profile-img" src="./SNT.jpg" class="w-24 h-24 mx-auto rounded-full border-2 border-sky-500 mb-4 object-cover">
            <h3 class="text-xl font-bold text-sky-400">My Profile</h3>
            <div class="text-left space-y-2 mt-4 text-sm text-slate-300">
                <p>Name: <span id="modal-name" class="text-white font-bold">Loading...</span></p>
                <p>Contact: <span id="modal-contact" class="text-white font-bold"></span></p>
            </div>
            <button onclick="deleteAccount()" class="w-full mt-6 py-2 text-xs text-red-500 border border-red-900/30 rounded-lg uppercase font-bold">Delete Account</button>
        </div>
    </div>

    <div id="calc-modal" class="modal-overlay">
        <div class="glass p-6 rounded-3xl w-72 border border-sky-500/30">
            <div class="flex justify-between items-center mb-4 text-sky-400 text-[10px] font-bold tracking-widest uppercase">Admin Verification</div>
            <div id="calc-display" class="bg-slate-900 p-4 rounded-xl text-right text-2xl font-mono mb-4 border border-slate-700 h-16 flex items-center justify-end">0</div>
            <div class="calc-grid">
                <button class="calc-btn" onclick="pressNum('7')">7</button><button class="calc-btn" onclick="pressNum('8')">8</button><button class="calc-btn" onclick="pressNum('9')">9</button><button class="calc-btn bg-orange-900/20 text-orange-400" onclick="clearCalc()">C</button>
                <button class="calc-btn" onclick="pressNum('4')">4</button><button class="calc-btn" onclick="pressNum('5')">5</button><button class="calc-btn" onclick="pressNum('6')">6</button><button class="calc-btn" onclick="pressNum('0')">0</button>
                <button class="calc-btn" onclick="pressNum('1')">1</button><button class="calc-btn" onclick="pressNum('2')">2</button><button class="calc-btn" onclick="pressNum('3')">3</button>
                <button class="calc-btn bg-sky-600 text-white" onclick="verifyPass()">=</button>
            </div>
            <p id="calc-error" class="text-red-500 text-[10px] text-center mt-3 hidden">INVALID PIN</p>
            <button onclick="closeCalc()" class="w-full mt-2 text-[10px] text-slate-500 uppercase">Cancel</button>
        </div>
    </div>

    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                .then(reg => console.log('SW Registered'))
                .catch(err => console.log('SW Failed', err));
            });
        }
    </script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, onAuthStateChanged, signOut, deleteUser, RecaptchaVerifier, signInWithPhoneNumber } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getDatabase, ref, get, child } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAOQtM_XYLqPgxMK1XBdfl0m7KoAseZRCA",
            authDomain: "snt-computer-institute.firebaseapp.com",
            databaseURL: "https://snt-computer-institute-default-rtdb.firebaseio.com/",
            projectId: "snt-computer-institute",
            storageBucket: "snt-computer-institute.firebasestorage.app",
            messagingSenderId: "117580784781",
            appId: "1:117580784781:web:73ba19d2d008beb3a5eec4"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        // Grid Data
        const files = [
            { name: 'Dashboard', url: 'https://harshitkaushal9129-bit.github.io/snt-institute/dashboard.html', icon: 'fa-chart-pie', color: 'text-sky-400' },
            { name: 'Attendance', url: 'https://harshitkaushal9129-bit.github.io/snt-institute/attendence.html', icon: 'fa-calendar-check', color: 'text-green-400' },
            { name: 'Admin', url: 'https://harshitkaushal9129-bit.github.io/snt-institute/admin.html', icon: 'fa-user-shield', color: 'text-red-400' },
            { name: 'Display', url: 'https://harshitkaushal9129-bit.github.io/snt-institute/display.html', icon: 'fa-desktop', color: 'text-pink-400', locked: true },
            { name: 'Verify', url: 'https://harshitkaushal9129-bit.github.io/snt-institute/verify.html', icon: 'fa-shield-alt', color: 'text-teal-400' }
        ];

        const grid = document.getElementById('app-grid');
        files.forEach(f => {
            const card = document.createElement('div');
            card.className = "app-card p-6 rounded-3xl text-center animate-fade-in";
            card.innerHTML = `<i class="fas ${f.icon} text-3xl mb-3 ${f.color}"></i><p class="text-[10px] font-black uppercase tracking-widest">${f.name}</p>`;
            card.onclick = () => { if(f.locked) openCalc(f.url); else window.location.href = f.url; };
            grid.appendChild(card);
        });

        // --- AUTH SYSTEM ---
        let isLoginMode = true;
        let regMethod = 'email';
        let confirmationResult = null;

        window.toggleAuthMode = () => {
            isLoginMode = !isLoginMode;
            document.getElementById('auth-title').innerText = isLoginMode ? "Welcome Back" : "Create Account";
            document.getElementById('mainBtn').innerText = isLoginMode ? "Login" : "Register";
            document.getElementById('toggleBtn').innerText = isLoginMode ? "Register" : "Login";
            document.getElementById('reg-methods').classList.toggle('hidden', isLoginMode);
            if(isLoginMode) setMethod('email');
        };

        window.setMethod = (m) => {
            regMethod = m;
            document.getElementById('email-group').classList.toggle('hidden', m === 'phone');
            document.getElementById('phone-group').classList.toggle('hidden', m === 'email');
            document.getElementById('m-email').classList.toggle('bg-sky-600', m === 'email');
            document.getElementById('m-phone').classList.toggle('bg-sky-600', m === 'phone');
        };

        window.handleAuth = async () => {
            if(isLoginMode) {
                const email = document.getElementById('email').value.trim();
                const pass = document.getElementById('password').value;
                signInWithEmailAndPassword(auth, email, pass).catch(err => alert(err.message));
            } else {
                if(regMethod === 'email') {
                    const email = document.getElementById('email').value.trim();
                    const pass = document.getElementById('password').value;
                    createUserWithEmailAndPassword(auth, email, pass).catch(err => alert(err.message));
                } else {
                    const phone = document.getElementById('mobile-input').value.trim();
                    if(!confirmationResult) {
                        window.recaptchaVerifier = new RecaptchaVerifier(auth, 'recaptcha-container', { size: 'normal' });
                        signInWithPhoneNumber(auth, phone, window.recaptchaVerifier)
                        .then(res => {
                            confirmationResult = res;
                            document.getElementById('otp-area').classList.remove('hidden');
                            alert("OTP Sent!");
                        }).catch(e => alert(e.message));
                    } else {
                        const otp = document.getElementById('otp-input').value;
                        confirmationResult.confirm(otp).catch(e => alert("Invalid OTP"));
                    }
                }
            }
        };

        // Profile Logic
        onAuthStateChanged(auth, async (user) => {
            document.getElementById('auth-container').classList.toggle('hidden', !!user);
            document.getElementById('dashboard').classList.toggle('hidden', !user);
            if (user) {
                const contact = user.email || user.phoneNumber;
                document.getElementById('user-display').innerText = contact;
                try {
                    const snap = await get(child(ref(db), 'students'));
                    if (snap.exists()) {
                        const students = snap.val();
                        for (let id in students) {
                            if (students[id].email === user.email || students[id].mobile === user.phoneNumber) {
                                document.getElementById('user-profile-icon').src = students[id].profilePicture || "./SNT.jpg";
                                document.getElementById('modal-profile-img').src = students[id].profilePicture || "./SNT.jpg";
                                document.getElementById('modal-name').innerText = students[id].name;
                                document.getElementById('modal-contact').innerText = contact;
                                break;
                            }
                        }
                    }
                } catch (e) { console.error(e); }
            }
        });

        window.logout = () => signOut(auth);
        
        // Calculator PIN
        let calcInput = ""; let targetUrl = "";
        window.openCalc = (url) => { targetUrl = url; document.getElementById('calc-modal').style.display = "flex"; clearCalc(); };
        window.closeCalc = () => document.getElementById('calc-modal').style.display = "none";
        window.pressNum = (n) => { calcInput += n; document.getElementById('calc-display').innerText = calcInput; };
        window.clearCalc = () => { calcInput = ""; document.getElementById('calc-display').innerText = "0"; };
        window.verifyPass = () => {
            if(calcInput === "1234") window.location.href = targetUrl;
            else { document.getElementById('calc-error').classList.remove('hidden'); clearCalc(); }
        };

        window.toggleUserModal = () => {
            const m = document.getElementById('user-modal');
            m.style.display = (m.style.display === "flex") ? "none" : "flex";
        };
    </script>
</body>
</html>
