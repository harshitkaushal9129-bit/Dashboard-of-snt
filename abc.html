<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>SNT Portal</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-900 text-white min-h-screen flex items-center justify-center">

<!-- LOGIN -->
<div id="loginBox" class="text-center">
  <h1 class="text-3xl font-bold mb-4">SNT INSTITUTE</h1>
  <button onclick="login()" class="bg-white text-black px-6 py-3 rounded">
    Login with Google
  </button>
</div>

<!-- DASHBOARD -->
<div id="dashboard" style="display:none" class="text-center w-full max-w-md">
  <h2 id="name" class="text-xl font-bold"></h2>
  <p id="email" class="text-gray-400"></p>

  <div id="apps" class="grid grid-cols-2 gap-4 mt-6"></div>

  <button onclick="logout()" class="mt-6 text-red-400">
    Logout
  </button>
</div>

<!-- FIREBASE -->
<script type="module">

import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut }
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
import { getDatabase, ref, query, orderByChild, equalTo, onValue }
from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyAOQtM_XYLqPgxMK1XBdfl0m7KoAseZRCA",
  authDomain: "snt-computer-institute.firebaseapp.com",
  projectId: "snt-computer-institute",
  databaseURL: "https://snt-computer-institute-default-rtdb.firebaseio.com",
  appId: "1:117580784781:web:73ba19d2d008beb3a5eec4"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);
const provider = new GoogleAuthProvider();

let currentRole = "student";

const BASE_URL = "https://harshitkaushal9129-bit.github.io/Dashboard-of-snt/";

const menu = [
 { name:"Dashboard", url: BASE_URL + "dashboard.html" },
 { name:"Attendance", url: BASE_URL + "attendance.html" },
 { name:"ID Card", url: BASE_URL + "id-card.html" },
 { name:"Receipt", url: BASE_URL + "receipt.html" },
 { name:"Verify", url: BASE_URL + "verify.html" },
 { name:"Admin Panel", url: BASE_URL + "admin.html", adminOnly:true }
];

// LOGIN
window.login = () => signInWithPopup(auth, provider);

// LOGOUT
window.logout = () => signOut(auth);

// AUTH CHECK
onAuthStateChanged(auth, user=>{
  if(user){

    loginBox.style.display="none";
    dashboard.style.display="block";

    const q = query(
      ref(db,"students"),
      orderByChild("email"),
      equalTo(user.email)
    );

    onValue(q, snap=>{
      if(snap.exists()){
        const data = Object.values(snap.val())[0];
        name.innerText = data.name;
        email.innerText = data.email;
        currentRole = data.role || "student";
      }else{
        name.innerText = user.displayName;
        email.innerText = user.email;
      }
      renderMenu();
    });

  }else{
    loginBox.style.display="block";
    dashboard.style.display="none";
  }
});

// RENDER MENU
function renderMenu(){
  let html="";
  menu.forEach(item=>{
    if(item.adminOnly && currentRole!=="admin") return;
    html += `
      <button onclick="openPage('${item.url}')" 
      class="bg-slate-700 p-4 rounded">
      ${item.name}
      </button>
    `;
  });
  apps.innerHTML = html;
}

window.openPage = (url)=> location.href=url;

</script>

</body>
</html>
