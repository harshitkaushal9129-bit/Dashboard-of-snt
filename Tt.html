<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SNT Institute - Official Portal</title>
    
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#0f172a">
    <link rel="apple-touch-icon" href="SNT.jpg">
    <link rel="icon" type="image/jpeg" href="SNT.jpg">

    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>

    <style>
        * { -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; outline: none; }
        body { background-color: #0f172a; color: white; font-family: 'Segoe UI', system-ui, sans-serif; min-height: 100vh; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); }
        
        .view-android #app-grid { grid-template-columns: repeat(2, 1fr); gap: 15px; }
        .view-laptop #app-grid { grid-template-columns: repeat(4, 1fr); gap: 20px; }

        .app-card { background: rgba(30, 41, 59, 0.6); border-radius: 24px; transition: 0.3s; cursor: pointer; aspect-ratio: 1/1; display: flex; flex-direction: column; align-items: center; justify-content: center; border: 1px solid rgba(255,255,255,0.05); }
        .app-card:active { transform: scale(0.95); background: rgba(56, 189, 248, 0.1); border-color: #38bdf8; }

        .bottom-nav { position: fixed; bottom: 0; width: 100%; height: 70px; background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(10px); display: flex; border-top: 1px solid rgba(255,255,255,0.1); z-index: 1000; }
        .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #64748b; }
        .nav-item.active { color: #38bdf8; }
        
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 2000; display: none; align-items: center; justify-content: center; padding: 20px; backdrop-filter: blur(8px); }
        #u-id-top { user-select: text !important; }
    </style>
</head>
<body class="view-android" id="main-body" oncontextmenu="return false;">

    <div id="auth-container" class="flex items-center justify-center min-h-screen p-6">
        <div class="glass p-8 rounded-[40px] w-full max-w-sm text-center border-t-4 border-sky-500">
            <img src="SNT.jpg" class="w-24 h-24 mx-auto rounded-full mb-6 border-2 border-sky-500 shadow-xl">
            <h2 class="text-2xl font-black mb-2 uppercase italic">SNT Institute</h2>
            <p class="text-[10px] text-sky-400 uppercase tracking-[0.3em] mb-8 font-bold">Official Portal</p>
            <button onclick="loginWithGoogle()" class="w-full bg-white text-slate-900 py-4 rounded-2xl font-black flex items-center justify-center gap-3 active:scale-95">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" class="w-5"> LOGIN WITH GOOGLE
            </button>
        </div>
    </div>

    <div id="dashboard" class="hidden pb-24">
        <header class="p-5 flex justify-between items-center max-w-5xl mx-auto">
            <select onchange="switchView(this.value)" class="bg-slate-800 text-[10px] font-bold p-2 rounded-lg border border-sky-500/30 text-sky-400 outline-none">
                <option value="view-android">MOBILE VIEW</option>
                <option value="view-laptop">LAPTOP VIEW</option>
            </select>
            <div class="flex gap-3">
                <button id="installBtn" class="hidden bg-sky-500 text-white text-[10px] font-black px-3 py-2 rounded-lg uppercase">Install</button>
                <button onclick="openInfo()" class="w-10 h-10 rounded-full glass text-sky-400"><i class="fas fa-info-circle"></i></button>
            </div>
        </header>

        <section id="home-tab" class="tab-content px-5 max-w-5xl mx-auto">
            <div class="glass p-5 rounded-[30px] mb-6 flex items-center gap-4 border-l-4 border-sky-500">
                <img id="u-img-home" src="SNT.jpg" class="w-14 h-14 rounded-full border-2 border-sky-500 object-cover">
                <div>
                    <p id="greeting" class="text-[9px] text-sky-400 font-bold uppercase tracking-widest"></p>
                    <h3 id="u-name-home" class="text-lg font-black italic">Loading...</h3>
                </div>
            </div>
            <div id="app-grid" class="grid"></div>
        </section>

        <section id="profile-tab" class="tab-content hidden px-5 max-w-xl mx-auto">
            <div class="text-center py-6">
                <img id="u-img-profile" src="SNT.jpg" class="w-28 h-28 rounded-full border-4 border-sky-500 mx-auto mb-4 object-cover shadow-2xl">
                <h2 id="u-name-profile" class="text-xl font-black">---</h2>
                <p id="u-id-top" class="text-sky-400 text-xs font-bold tracking-widest mt-1">ID: --</p>
            </div>
            
            <div class="grid grid-cols-2 gap-4 mb-6">
                <div class="glass p-4 rounded-2xl text-center">
                    <p class="text-[8px] text-slate-400 uppercase font-black mb-1">Course Enrolled</p>
                    <p id="u-course" class="font-bold text-white text-[11px]">---</p>
                </div>
                <div class="glass p-4 rounded-2xl text-center">
                    <p class="text-[8px] text-slate-400 uppercase font-black mb-1">WhatsApp No.</p>
                    <p id="u-phone" class="font-bold text-green-400 text-[11px]">---</p>
                </div>
            </div>

            <div class="glass p-5 rounded-3xl space-y-5">
                <div class="flex items-center gap-4">
                    <div class="w-10 h-10 rounded-xl bg-sky-500/10 flex items-center justify-center text-sky-400"><i class="fas fa-user-friends"></i></div>
                    <div><p class="text-[8px] text-slate-500 uppercase font-bold">Father's Name</p><p id="u-father" class="text-sm font-bold">---</p></div>
                </div>
                <div class="flex items-center gap-4">
                    <div class="w-10 h-10 rounded-xl bg-purple-500/10 flex items-center justify-center text-purple-400"><i class="fas fa-map-marked-alt"></i></div>
                    <div><p class="text-[8px] text-slate-500 uppercase font-bold">Full Address</p><p id="u-addr" class="text-xs font-bold text-slate-300">---</p></div>
                </div>
                <div class="flex items-center gap-4">
                    <div class="w-10 h-10 rounded-xl bg-orange-500/10 flex items-center justify-center text-orange-400"><i class="fas fa-clock"></i></div>
                    <div><p class="text-[8px] text-slate-500 uppercase font-bold">Batch Timing</p><p id="u-batch" class="text-sm font-bold">---</p></div>
                </div>
            </div>
            
            <button onclick="logout()" class="w-full mt-8 p-4 rounded-2xl bg-red-500/10 border border-red-500/20 text-red-500 font-black text-xs uppercase tracking-widest">Sign Out Account</button>
        </section>

        <nav class="bottom-nav">
            <div class="nav-item active" onclick="switchTab('home', this)"><i class="fas fa-th-large mb-1"></i><span class="text-[9px] font-black">DASHBOARD</span></div>
            <div class="nav-item" onclick="switchTab('profile', this)"><i class="fas fa-user-circle mb-1"></i><span class="text-[9px] font-black">MY PROFILE</span></div>
        </nav>
    </div>

    <div id="info-modal" class="modal-overlay">
        <div class="glass p-8 rounded-[40px] w-full max-w-xs text-center">
            <h3 class="font-black mb-6 italic tracking-widest">PORTAL INFO</h3>
            <div class="space-y-4 text-[11px] font-bold">
                <div class="flex justify-between border-b border-white/5 pb-2"><span>Developer</span><span class="text-sky-400">Harshit Kaushal</span></div>
                <div class="flex justify-between border-b border-white/5 pb-2"><span>Official Link</span><a href="https://harshitkaushal9129-bit.github.io/Dashboard-of-snt/" class="text-sky-400 underline">Visit Portal</a></div>
            </div>
            <button onclick="closeInfo()" class="w-full mt-8 bg-sky-500 py-4 rounded-2xl font-black text-xs uppercase">Close</button>
        </div>
    </div>

    <script>
        const firebaseConfig = { 
            apiKey: "AIzaSyAOQtM_XYLqPgxMK1XBdfl0m7KoAseZRCA", 
            authDomain: "snt-computer-institute.firebaseapp.com", 
            databaseURL: "https://snt-computer-institute-default-rtdb.firebaseio.com/", 
            projectId: "snt-computer-institute", 
            appId: "1:117580784781:web:73ba19d2d008beb3a5eec4" 
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const auth = firebase.auth();
        const provider = new firebase.auth.GoogleAuthProvider();

        auth.onAuthStateChanged((user) => {
            if (user) {
                document.getElementById('auth-container').classList.add('hidden');
                document.getElementById('dashboard').classList.remove('hidden');
                loadStudentData(user.email);
                renderMenu();
            }
        });

        function loadStudentData(email) {
            db.ref('students').orderByChild('email').equalTo(email).on('value', (snap) => {
                if (snap.exists()) {
                    const key = Object.keys(snap.val())[0];
                    const data = snap.val()[key];

                    // Home & Global
                    document.getElementById('u-name-home').innerText = data.name || 'Student';
                    document.getElementById('u-img-home').src = data.profilePicture || 'SNT.jpg';
                    const hr = new Date().getHours();
                    document.getElementById('greeting').innerText = hr < 12 ? "Good Morning" : hr < 17 ? "Good Afternoon" : "Good Evening";

                    // Profile Tab - Using your exact keywords
                    document.getElementById('u-name-profile').innerText = data.name || '---';
                    document.getElementById('u-img-profile').src = data.profilePicture || 'SNT.jpg';
                    document.getElementById('u-id-top').innerText = "ID: " + (data.studentId || 'N/A');
                    document.getElementById('u-phone').innerText = data.mobile || data.phone || '---';
                    document.getElementById('u-father').innerText = data.fatherName || '---';
                    document.getElementById('u-addr').innerText = data.address || '---';
                    
                    // Arrays check for Courses and Batches
                    let courseList = data.courses ? (Array.isArray(data.courses) ? data.courses.join(', ') : data.courses) : '---';
                    document.getElementById('u-course').innerText = courseList;
                    
                    let batchList = data.batches ? (Array.isArray(data.batches) ? data.batches.join(', ') : data.batches) : '---';
                    document.getElementById('u-batch').innerText = batchList;
                }
            });
        }

        function renderMenu() {
            const items = [
                { n: 'Attendance', u: 'https://harshitkaushal9129-bit.github.io/Dashboard-of-snt/attendence.html', i: 'fa-calendar-check', c: 'text-green-400' },
                { n: 'ID Card', u: 'https://harshitkaushal9129-bit.github.io/snt-institute/id-card.html', i: 'fa-id-card', c: 'text-yellow-400' },
                { n: 'CBT Exam', u: 'https://harshitkaushal9129-bit.github.io/snt-institute/quiz.html', i: 'fa-laptop-code', c: 'text-sky-400' },
                { n: 'Fees Receipt', u: 'https://harshitkaushal9129-bit.github.io/snt-institute/receipt.html', i: 'fa-file-invoice-dollar', c: 'text-orange-400' }
            ];
            document.getElementById('app-grid').innerHTML = items.map(m => `
                <div class="app-card" onclick="location.href='${m.u}'">
                    <i class="fas ${m.i} text-2xl ${m.c} mb-3"></i>
                    <span class="text-[10px] font-black text-slate-300 uppercase tracking-tighter">${m.n}</span>
                </div>`).join('');
        }

        window.loginWithGoogle = () => auth.signInWithPopup(provider);
        window.logout = () => auth.signOut().then(() => location.reload());
        window.switchTab = (t, el) => {
            document.querySelectorAll('.tab-content').forEach(s => s.classList.add('hidden'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById(t + '-tab').classList.remove('hidden');
            el.classList.add('active');
        };
        window.switchView = (v) => document.getElementById('main-body').className = v;
        window.openInfo = () => document.getElementById('info-modal').style.display = 'flex';
        window.closeInfo = () => document.getElementById('info-modal').style.display = 'none';

        // PWA Installer
        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            document.getElementById('installBtn').classList.remove('hidden');
        });

        document.getElementById('installBtn').addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                deferredPrompt = null;
                document.getElementById('installBtn').classList.add('hidden');
            }
        });
    </script>
</body>
</html>
