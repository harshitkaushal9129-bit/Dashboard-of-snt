<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SNT Institute - Official Portal</title>
    
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#0f172a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="apple-touch-icon" href="./SNT.jpg">
    <link rel="icon" type="image/jpeg" href="SNT.jpg">

    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        * { -webkit-user-select: none; user-select: none; -webkit-tap-highlight-color: transparent; outline: none; }
        body { background-color: #0f172a; color: white; font-family: 'Segoe UI', system-ui, sans-serif; min-height: 100vh; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); }
        
        /* Responsive Grid */
        .view-android #app-grid { grid-template-columns: repeat(2, 1fr); gap: 15px; }
        .view-laptop #app-grid { grid-template-columns: repeat(4, 1fr); gap: 20px; }

        .app-card { background: rgba(30, 41, 59, 0.6); border-radius: 24px; transition: 0.3s; cursor: pointer; aspect-ratio: 1/1; display: flex; flex-direction: column; align-items: center; justify-content: center; border: 1px solid rgba(255,255,255,0.05); }
        .app-card:active { transform: scale(0.95); background: rgba(56, 189, 248, 0.1); border-color: #38bdf8; }

        .bottom-nav { position: fixed; bottom: 0; width: 100%; height: 70px; background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(10px); display: flex; border-top: 1px solid rgba(255,255,255,0.1); z-index: 1000; }
        .nav-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; color: #64748b; }
        .nav-item.active { color: #38bdf8; }
        
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 2000; display: none; align-items: center; justify-content: center; padding: 20px; }
    </style>
</head>
<body class="view-android" id="main-body">

    <div id="auth-container" class="flex items-center justify-center min-h-screen p-6">
        <div class="glass p-8 rounded-[40px] w-full max-w-sm text-center border-t-4 border-sky-500">
            <img src="./SNT.jpg" class="w-24 h-24 mx-auto rounded-full mb-6 border-2 border-sky-500 shadow-xl">
            <h2 class="text-2xl font-black mb-2">SNT INSTITUTE</h2>
            <p class="text-[10px] text-sky-400 uppercase tracking-[0.3em] mb-8">Official Student Portal</p>
            <button onclick="loginWithGoogle()" class="w-full bg-white text-slate-900 py-4 rounded-2xl font-black flex items-center justify-center gap-3 active:scale-95">
                <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" class="w-5"> LOGIN WITH GOOGLE
            </button>
        </div>
    </div>

    <div id="dashboard" class="hidden pb-24">
        <header class="p-5 flex justify-between items-center max-w-5xl mx-auto">
            <div class="flex gap-2">
                <select id="view-selector" onchange="switchView(this.value)" class="bg-slate-800 text-[10px] font-bold p-2 rounded-lg border border-sky-500/30 text-sky-400">
                    <option value="view-android">MOBILE</option>
                    <option value="view-laptop">LAPTOP</option>
                </select>
                <button id="installBtn" class="hidden bg-sky-500 text-white text-[10px] font-black px-3 rounded-lg uppercase">Install App</button>
            </div>
            <button onclick="openInfo()" class="w-10 h-10 rounded-full glass text-sky-400"><i class="fas fa-info-circle"></i></button>
        </header>

        <section id="home-tab" class="tab-content px-5 max-w-5xl mx-auto">
            <div class="glass p-5 rounded-[30px] mb-6 flex items-center gap-4">
                <img id="user-img-home" src="./SNT.jpg" class="w-14 h-14 rounded-full border-2 border-sky-500">
                <div>
                    <p id="greeting-msg" class="text-[9px] text-sky-400 font-bold uppercase"></p>
                    <h3 id="user-name-home" class="text-lg font-black italic">Student Name</h3>
                </div>
            </div>
            <div id="app-grid" class="grid"></div>
        </section>

        <section id="profile-tab" class="tab-content hidden px-5 max-w-xl mx-auto">
            <div class="text-center py-6">
                <img id="user-img-large" src="./SNT.jpg" class="w-28 h-28 rounded-full border-4 border-sky-500 mx-auto mb-4">
                <h2 id="user-name-profile" class="text-xl font-black">---</h2>
                <p id="user-email-profile" class="text-sky-400 text-xs">---</p>
            </div>
            
            <div class="grid grid-cols-2 gap-4 mb-6">
                <div class="glass p-4 rounded-2xl text-center">
                    <p class="text-[8px] text-slate-400 uppercase font-bold">Student ID</p>
                    <p id="prof-id" class="font-bold text-sky-400">LOADING</p>
                </div>
                <div class="glass p-4 rounded-2xl text-center">
                    <p class="text-[8px] text-slate-400 uppercase font-bold">Course</p>
                    <p id="prof-course" class="font-bold text-white text-xs">---</p>
                </div>
            </div>

            <div class="glass p-5 rounded-3xl space-y-4">
                <div class="flex items-center gap-4">
                    <i class="fas fa-phone-alt text-green-400 w-5"></i>
                    <div>
                        <p class="text-[8px] text-slate-500 uppercase">Mobile Number</p>
                        <p id="prof-phone" class="text-sm font-bold">Not Linked</p>
                    </div>
                </div>
                <div class="flex items-center gap-4">
                    <i class="fas fa-map-marker-alt text-red-400 w-5"></i>
                    <div>
                        <p class="text-[8px] text-slate-500 uppercase">Center</p>
                        <p class="text-sm font-bold">SNT Rudauli, Ayodhya</p>
                    </div>
                </div>
            </div>
            <button onclick="logout()" class="w-full mt-8 p-4 rounded-2xl bg-red-500/10 border border-red-500/20 text-red-500 font-black text-xs uppercase">Sign Out</button>
        </section>

        <nav class="bottom-nav">
            <div class="nav-item active" onclick="switchTab('home', this)"><i class="fas fa-home mb-1"></i><span class="text-[9px] font-bold">HOME</span></div>
            <div class="nav-item" onclick="switchTab('profile', this)"><i class="fas fa-user mb-1"></i><span class="text-[9px] font-bold">PROFILE</span></div>
        </nav>
    </div>

    <div id="info-modal" class="modal-overlay">
        <div class="glass p-8 rounded-[40px] w-full max-w-xs">
            <h3 class="text-center font-black mb-6 italic">PORTAL INFORMATION</h3>
            <div class="space-y-4 text-xs">
                <div class="flex justify-between border-b border-white/5 pb-2"><span>Developer</span><span class="text-sky-400">Harshit Kaushal</span></div>
                <div class="flex justify-between border-b border-white/5 pb-2"><span>Official Portal</span><a href="https://harshitkaushal9129-bit.github.io/Dashboard-of-snt/" class="text-sky-400 underline italic">Link</a></div>
                <div class="flex justify-center gap-6 py-2 text-lg">
                    <a href="tel:919129191898" class="text-sky-400"><i class="fas fa-phone"></i></a>
                    <a href="https://wa.me/919129191898" class="text-green-500"><i class="fab fa-whatsapp"></i></a>
                </div>
            </div>
            <button onclick="closeInfo()" class="w-full mt-6 bg-sky-500 py-3 rounded-xl font-bold">CLOSE</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = { 
            apiKey: "AIzaSyAOQtM_XYLqPgxMK1XBdfl0m7KoAseZRCA", 
            authDomain: "snt-computer-institute.firebaseapp.com", 
            projectId: "snt-computer-institute", 
            databaseURL: "https://snt-computer-institute-default-rtdb.firebaseio.com", 
            appId: "1:117580784781:web:73ba19d2d008beb3a5eec4" 
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);
        const provider = new GoogleAuthProvider();

        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('auth-container').classList.add('hidden');
                document.getElementById('dashboard').classList.remove('hidden');
                
                const hr = new Date().getHours();
                document.getElementById('greeting-msg').innerText = hr < 12 ? "Good Morning" : hr < 17 ? "Good Afternoon" : "Good Evening";
                
                // Real-time Student Data
                onValue(ref(db, 'students'), (snapshot) => {
                    const data = snapshot.val();
                    if (data) {
                        const student = Object.values(data).find(s => s.email?.toLowerCase() === user.email.toLowerCase());
                        if (student) {
                            document.getElementById('user-name-home').innerText = student.name || user.displayName;
                            document.getElementById('user-name-profile').innerText = student.name || user.displayName;
                            document.getElementById('user-email-profile').innerText = user.email;
                            document.getElementById('prof-id').innerText = student.studentId || "PENDING";
                            document.getElementById('prof-course').innerText = student.course || "N/A";
                            document.getElementById('prof-phone').innerText = student.phone || "Not Linked";
                            if(student.profilePic) {
                                document.getElementById('user-img-home').src = student.profilePic;
                                document.getElementById('user-img-large').src = student.profilePic;
                            }
                        }
                    }
                });
                renderMenu();
            }
        });

        window.renderMenu = () => {
            const menu = [
                { n: 'Attendance', u: 'https://harshitkaushal9129-bit.github.io/Dashboard-of-snt/attendence.html', i: 'fa-calendar-check', c: 'text-green-400' },
                { n: 'ID Card', u: 'https://harshitkaushal9129-bit.github.io/snt-institute/id-card.html', i: 'fa-id-card', c: 'text-yellow-400' },
                { n: 'CBT Exam', u: 'https://harshitkaushal9129-bit.github.io/snt-institute/quiz.html', i: 'fa-laptop-code', c: 'text-sky-400' },
                { n: 'Results', u: './result-history.html', i: 'fa-poll', c: 'text-orange-400' }
            ];
            document.getElementById('app-grid').innerHTML = menu.map(m => `
                <div class="app-card" onclick="location.href='${m.u}'">
                    <i class="fas ${m.i} text-2xl ${m.c} mb-2"></i>
                    <span class="text-[10px] font-bold text-slate-300 uppercase">${m.n}</span>
                </div>`).join('');
        };

        window.loginWithGoogle = () => signInWithPopup(auth, provider);
        window.logout = () => signOut(auth).then(() => location.reload());
        window.switchTab = (t, el) => {
            document.querySelectorAll('.tab-content').forEach(s => s.classList.add('hidden'));
            document.querySelectorAll('.nav-item').forEach(n => n.classList.remove('active'));
            document.getElementById(t + '-tab').classList.remove('hidden');
            el.classList.add('active');
        };
        window.switchView = (v) => document.getElementById('main-body').className = v;
        window.openInfo = () => document.getElementById('info-modal').style.display = 'flex';
        window.closeInfo = () => document.getElementById('info-modal').style.display = 'none';

        // PWA Installer Logic
        let deferredPrompt;
        window.addEventListener('beforeinstallprompt', (e) => {
            e.preventDefault();
            deferredPrompt = e;
            document.getElementById('installBtn').classList.remove('hidden');
        });

        document.getElementById('installBtn').addEventListener('click', async () => {
            if (deferredPrompt) {
                deferredPrompt.prompt();
                const { outcome } = await deferredPrompt.userChoice;
                if (outcome === 'accepted') document.getElementById('installBtn').classList.add('hidden');
                deferredPrompt = null;
            }
        });
    </script>
</body>
</html>
