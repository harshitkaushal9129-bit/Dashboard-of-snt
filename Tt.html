<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SNT - Cloud PDF Explorer</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background-color: #0f172a; color: white; font-family: 'Segoe UI', sans-serif; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); }
        .pdf-card { background: rgba(30, 41, 59, 0.4); border-radius: 20px; border: 1px solid rgba(255,255,255,0.05); transition: 0.3s; }
        .pdf-card:hover { border-color: #ef4444; background: rgba(239, 68, 68, 0.05); transform: translateY(-3px); }
        .delete-btn { color: #ef4444; background: rgba(239, 68, 68, 0.1); border-radius: 12px; transition: 0.2s; }
        .delete-btn:hover { background: #ef4444; color: white; }
    </style>
</head>
<body class="p-4 md:p-10">

    <div class="max-w-5xl mx-auto">
        <div class="flex flex-col md:flex-row justify-between items-center mb-10 gap-6">
            <div>
                <h1 class="text-4xl font-black italic tracking-tighter text-white">
                    SNT <span class="text-sky-500 underline decoration-red-500">CLOUD</span>
                </h1>
                <p class="text-slate-500 text-[10px] font-bold uppercase tracking-[0.4em] mt-1">Official PDF Management System</p>
            </div>
            
            <div class="glass px-10 py-4 rounded-3xl border-t-4 border-red-500 flex items-center gap-6 shadow-2xl">
                <div class="text-center">
                    <span id="pdf-count" class="text-4xl font-black text-white block">00</span>
                    <p class="text-[9px] font-black text-red-500 uppercase tracking-widest">Total Files</p>
                </div>
                <div class="w-[1px] h-10 bg-white/10"></div>
                <i class="fas fa-database text-3xl text-sky-500 opacity-50"></i>
            </div>
        </div>

        <div class="glass flex items-center px-6 py-4 rounded-2xl mb-8">
            <i class="fas fa-search text-sky-500 mr-4"></i>
            <input type="text" id="searchPdf" placeholder="Search pdf by name..." class="bg-transparent border-none outline-none text-xs font-bold uppercase tracking-widest w-full text-white placeholder:text-slate-600">
        </div>

        <div id="pdf-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6">
            <div id="loader" class="col-span-full py-20 text-center opacity-50">
                <i class="fas fa-spinner fa-spin text-4xl mb-4 text-sky-500"></i>
                <p class="text-[10px] font-black tracking-widest uppercase">Fetching PDF Data...</p>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAOQtM_XYLqPgxMK1XBdfl0m7KoAseZRCA",
            authDomain: "snt-computer-institute.firebaseapp.com",
            databaseURL: "https://snt-computer-institute-default-rtdb.firebaseio.com",
            projectId: "snt-computer-institute",
            storageBucket: "snt-computer-institute.firebasestorage.app",
            messagingSenderId: "117580784781",
            appId: "1:117580784781:web:73ba19d2d008beb3a5eec4"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const pdfGrid = document.getElementById('pdf-grid');
        const pdfCount = document.getElementById('pdf-count');
        const loader = document.getElementById('loader');

        // Fetch Data logic
        const pdfRef = ref(db, 'pdfs');
        onValue(pdfRef, (snapshot) => {
            pdfGrid.innerHTML = "";
            loader.style.display = "none";

            if (snapshot.exists()) {
                const data = snapshot.val();
                const items = Object.entries(data);
                pdfCount.innerText = items.length < 10 ? `0${items.length}` : items.length;

                items.forEach(([key, val]) => {
                    const html = `
                        <div class="pdf-card p-6 flex flex-col justify-between" data-name="${val.name.toLowerCase()}">
                            <div class="flex items-start justify-between mb-6">
                                <div class="w-12 h-12 bg-red-500/10 rounded-2xl flex items-center justify-center text-red-500 border border-red-500/20">
                                    <i class="fas fa-file-pdf text-2xl"></i>
                                </div>
                                <button onclick="deletePdf('${key}')" class="delete-btn w-10 h-10 flex items-center justify-center">
                                    <i class="fas fa-trash-alt text-sm"></i>
                                </button>
                            </div>
                            <div>
                                <h3 class="text-sm font-black text-white uppercase tracking-tight truncate mb-1">${val.name}</h3>
                                <p class="text-[9px] text-slate-500 font-bold uppercase mb-4 tracking-widest">${val.date || 'System File'}</p>
                                <a href="${val.url}" target="_blank" class="block w-full bg-sky-500 text-center py-3 rounded-xl text-[10px] font-black uppercase tracking-widest hover:bg-sky-600 transition-all shadow-lg shadow-sky-500/20">
                                    View Document
                                </a>
                            </div>
                        </div>
                    `;
                    pdfGrid.insertAdjacentHTML('beforeend', html);
                });
            } else {
                pdfCount.innerText = "00";
                pdfGrid.innerHTML = `<div class="col-span-full py-20 text-center opacity-30"><i class="fas fa-folder-open text-5xl mb-4"></i><p class="font-black uppercase text-xs tracking-widest">No Cloud Data Found</p></div>`;
            }
        });

        // Global Delete Function
        window.deletePdf = (key) => {
            if(confirm("⚠ PERMANENT DELETE?\nThis file will be removed from SNT Servers immediately.")) {
                remove(ref(db, `pdfs/${key}`))
                .then(() => console.log("File Removed"))
                .catch(err => alert("Error: " + err.message));
            }
        };

        // Search logic
        document.getElementById('searchPdf').addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            document.querySelectorAll('.pdf-card').forEach(card => {
                const name = card.getAttribute('data-name');
                card.style.display = name.includes(term) ? 'block' : 'none';
            });
        });

    </script>
</body>
</html>
