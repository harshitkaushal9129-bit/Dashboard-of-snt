<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SNT - Student Rankings</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background: #0f172a; color: white; font-family: 'Segoe UI', sans-serif; overflow-x: hidden; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); }
        .rank-1 { border-left: 4px solid #fbbf24; background: rgba(251, 191, 36, 0.15); box-shadow: 0 0 20px rgba(251, 191, 36, 0.1); } /* Gold */
        .rank-2 { border-left: 4px solid #94a3b8; background: rgba(148, 163, 184, 0.15); } /* Silver */
        .rank-3 { border-left: 4px solid #b45309; background: rgba(180, 83, 9, 0.15); }    /* Bronze */
        .animate-fade-in { animation: fadeIn 0.5s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="p-4 md:p-8">

    <div class="max-w-2xl mx-auto">
        <div class="flex items-center justify-between mb-8">
            <button onclick="window.location.href='https://harshitkaushal9129-bit.github.io/Dashboard-of-snt/'" class="text-sky-400 hover:text-white transition-colors">
                <i class="fas fa-arrow-left text-xl"></i>
            </button>
            <h1 class="text-2xl font-black italic uppercase tracking-tighter">SNT <span class="text-sky-500">LEADERBOARD</span></h1>
            <i class="fas fa-trophy text-yellow-400 text-2xl"></i>
        </div>

        <div id="rank-list" class="space-y-3">
            <div class="text-center opacity-50 py-10">
                <i class="fas fa-circle-notch animate-spin text-2xl mb-2"></i>
                <p>Loading Rankings...</p>
            </div>
        </div>

        <div class="mt-8 text-center">
            <p class="text-[10px] text-slate-500 uppercase tracking-widest font-bold">Official Portal: SNT Computer Institute</p>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAOQtM_XYLqPgxMK1XBdfl0m7KoAseZRCA",
            authDomain: "snt-computer-institute.firebaseapp.com",
            projectId: "snt-computer-institute",
            databaseURL: "https://snt-computer-institute-default-rtdb.firebaseio.com",
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Fetch Rankings from 'exam_results' (matching quiz.html)
        onValue(ref(db, 'exam_results'), (snapshot) => {
            const listContainer = document.getElementById('rank-list');
            
            if (snapshot.exists()) {
                const results = Object.values(snapshot.val());
                
                // Har student ka sirf BEST score dikhane ke liye logic
                const bestScoresMap = {};
                results.forEach(res => {
                    if (!bestScoresMap[res.studentId] || res.score > bestScoresMap[res.studentId].score) {
                        bestScoresMap[res.studentId] = res;
                    }
                });

                // Sort by highest score
                const rankedStudents = Object.values(bestScoresMap)
                    .sort((a, b) => b.score - a.score);

                renderRankings(rankedStudents);
            } else {
                listContainer.innerHTML = "<p class='text-center opacity-50'>No quiz records found yet.</p>";
            }
        });

        function renderRankings(list) {
            const listContainer = document.getElementById('rank-list');
            listContainer.innerHTML = "";

            list.forEach((student, index) => {
                const rank = index + 1;
                let rankClass = "glass";
                let medal = "";

                if (rank === 1) { rankClass = "rank-1"; medal = "🥇"; }
                else if (rank === 2) { rankClass = "rank-2"; medal = "🥈"; }
                else if (rank === 3) { rankClass = "rank-3"; medal = "🥉"; }

                listContainer.innerHTML += `
                    <div class="${rankClass} p-4 rounded-2xl flex items-center gap-4 animate-fade-in" style="animation-delay: ${index * 0.1}s">
                        <span class="w-8 font-black text-lg ${rank <= 3 ? 'text-white' : 'text-slate-500'}">
                            ${rank <= 3 ? medal : '#' + rank}
                        </span>
                        
                        <div class="flex-1">
                            <h4 class="font-bold text-sm uppercase tracking-tight">${student.studentName}</h4>
                            <p class="text-[10px] text-slate-400 font-mono">${student.courseName || 'General Exam'}</p>
                        </div>

                        <div class="text-right">
                            <span class="text-sky-400 font-black text-xl">${student.score}</span>
                            <p class="text-[8px] text-slate-500 uppercase font-bold">Marks</p>
                        </div>
                    </div>
                `;
            });
        }
    </script>
</body>
</html>
