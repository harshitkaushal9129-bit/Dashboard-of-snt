<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SNT Institute - Media Upload</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #6366f1; --bg: #0f172a; }
        body { font-family: 'Poppins', sans-serif; background: var(--bg); display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; color: white; }
        .card { background: #1e293b; padding: 2rem; border-radius: 15px; width: 90%; max-width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); text-align: center; border: 1px solid rgba(255,255,255,0.1); }
        .form-group { margin-bottom: 1.2rem; text-align: left; }
        label { display: block; font-weight: 600; margin-bottom: 8px; font-size: 0.9rem; color: #94a3b8; }
        input, textarea, select { width: 100%; padding: 12px; border: 2px solid #334155; border-radius: 8px; box-sizing: border-box; background: #0f172a; color: white; outline: none; }
        input:focus, select:focus { border-color: var(--primary); }
        button { width: 100%; background: var(--primary); color: white; border: none; padding: 12px; border-radius: 8px; font-weight: 600; cursor: pointer; margin-top: 10px; transition: 0.3s; }
        button:disabled { background: #475569; cursor: not-allowed; }
        #status { margin-top: 15px; font-size: 0.85rem; color: #6366f1; display: none; font-weight: bold; }
        h2 { margin-bottom: 1.5rem; color: #f8fafc; }
        .upload-type { display: flex; gap: 10px; margin-bottom: 20px; }
        .type-btn { flex: 1; padding: 10px; background: #334155; border-radius: 8px; cursor: pointer; font-size: 0.8rem; }
        .active-type { background: var(--primary); }
    </style>
</head>
<body>
    <div class="card">
        <h2 id="mainTitle">📄 Media Uploader</h2>
        
        <div class="upload-type">
            <div id="pdfTab" class="type-btn active-type" onclick="switchMode('pdf')">PDF Upload</div>
            <div id="imgTab" class="type-btn" onclick="switchMode('image')">Image Upload</div>
        </div>

        <form id="uploadForm">
            <div class="form-group" id="courseContainer">
                <label>Course Select Karein</label>
                <select id="category" required>
                    <option value="" disabled selected>Course chunein...</option>
                    <option value="Computer Basics">Computer Basics</option>
                    <option value="C++ Language">C++ Language</option>
                    <option value="Java">Java</option>
                    <option value="DCA & ADCA">DCA & ADCA</option>
                    <option value="CCC">CCC</option>
                    <option value="Python">Python</option>
                    <option value="Tally ERP 9">Tally ERP 9</option>
                    <option value="Other">Other</option>
                </select>
            </div>

            <div class="form-group">
                <label id="fileLabel">PDF Select Karein (Max 4MB)</label>
                <input type="file" id="mediaFile" accept="application/pdf" required>
            </div>

            <div class="form-group">
                <label>Description</label>
                <textarea id="mediaDesc" rows="2" placeholder="Kuch jaankari likhein..." required></textarea>
            </div>

            <button type="submit" id="submitBtn">Save Karein</button>
            <div id="status">Database mein save ho raha hai...</div>
        </form>
        
        <a href="pdf.html" style="display:block; margin-top:15px; text-decoration:none; color:#64748b; font-size:0.9rem;">View Library →</a>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>

    <script>
        // Firebase Config (Same as yours)
        const firebaseConfig = {
            apiKey: "AIzaSyAOQtM_XYLqPgxMK1XBdfl0m7KoAseZRCA",
            authDomain: "snt-computer-institute.firebaseapp.com",
            databaseURL: "https://snt-computer-institute-default-rtdb.firebaseio.com",
            projectId: "snt-computer-institute",
            storageBucket: "snt-computer-institute.firebasestorage.app",
            messagingSenderId: "117580784781",
            appId: "1:117580784781:web:73ba19d2d008beb3a5eec4"
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        let currentMode = 'pdf';

        function switchMode(mode) {
            currentMode = mode;
            const courseCont = document.getElementById('courseContainer');
            const fileInput = document.getElementById('mediaFile');
            const fileLabel = document.getElementById('fileLabel');
            const title = document.getElementById('mainTitle');
            
            document.getElementById('pdfTab').classList.toggle('active-type', mode === 'pdf');
            document.getElementById('imgTab').classList.toggle('active-type', mode === 'image');

            if(mode === 'pdf') {
                title.innerText = "📄 PDF Uploader";
                courseCont.style.display = "block";
                fileInput.accept = "application/pdf";
                fileLabel.innerText = "PDF Select Karein (Max 4MB)";
                document.getElementById('category').required = true;
            } else {
                title.innerText = "🖼️ Image Uploader";
                courseCont.style.display = "none";
                fileInput.accept = "image/*";
                fileLabel.innerText = "Image Select Karein (Max 2MB)";
                document.getElementById('category').required = false;
            }
        }

        document.getElementById('uploadForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const status = document.getElementById('status');
            const file = document.getElementById('mediaFile').files[0];
            const desc = document.getElementById('mediaDesc').value;
            const category = document.getElementById('category').value;

            // Size limit check
            const limit = currentMode === 'pdf' ? 4194304 : 2097152; 
            if(file.size > limit) {
                alert(`File size bahut badi hai! Max ${currentMode === 'pdf' ? '4MB' : '2MB'} allow hai.`);
                return;
            }

            btn.disabled = true;
            status.style.display = "block";

            const reader = new FileReader();
            reader.onload = function(event) {
                const newData = {
                    name: file.name,
                    data: event.target.result, 
                    desc: desc,
                    type: currentMode,
                    date: new Date().toLocaleString()
                };

                // Agar PDF hai toh category bhi add karein
                if(currentMode === 'pdf') newData.category = category;

                const dbPath = currentMode === 'pdf' ? 'myPDFs' : 'myImages';
                
                database.ref(dbPath).push(newData).then(() => {
                    alert('Data successfully save ho gaya!');
                    location.reload();
                }).catch((error) => {
                    alert('Error: ' + error.message);
                    btn.disabled = false;
                    status.style.display = "none";
                });
            };
            reader.readAsDataURL(file);
        });
    </script>
</body>
</html>
