<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SNT Institute - Media Upload</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #6366f1; --bg: #0f172a; }
        body { font-family: 'Poppins', sans-serif; background: var(--bg); display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; color: white; flex-direction: column; padding: 20px 0; }
        
        .card, .library-card { 
            background: #1e293b; padding: 2rem; border-radius: 15px; 
            width: 90%; max-width: 450px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); 
            text-align: center; border: 1px solid rgba(255,255,255,0.1); margin-bottom: 20px; 
        }

        .stats-box { background: rgba(99, 102, 241, 0.1); padding: 10px; border-radius: 8px; margin-bottom: 15px; border: 1px dashed var(--primary); }
        .form-group { margin-bottom: 1.2rem; text-align: left; }
        label { display: block; font-weight: 600; margin-bottom: 8px; font-size: 0.9rem; color: #94a3b8; }
        input, textarea, select { width: 100%; padding: 12px; border: 2px solid #334155; border-radius: 8px; box-sizing: border-box; background: #0f172a; color: white; outline: none; transition: 0.3s; }
        input:focus, select:focus { border-color: var(--primary); }

        .upload-type { display: flex; gap: 10px; margin-bottom: 20px; }
        .type-btn { flex: 1; padding: 10px; background: #334155; border-radius: 8px; cursor: pointer; font-size: 0.85rem; font-weight: 600; transition: 0.3s; }
        .active-type { background: var(--primary); box-shadow: 0 0 15px rgba(99, 102, 241, 0.4); }

        button { width: 100%; background: var(--primary); color: white; border: none; padding: 14px; border-radius: 8px; font-weight: 600; cursor: pointer; margin-top: 10px; transition: 0.3s; font-size: 1rem; }
        button:hover { opacity: 0.9; transform: translateY(-2px); }

        /* Media List Styles */
        .pdf-item { background: #0f172a; padding: 12px; border-radius: 8px; margin-top: 10px; display: flex; justify-content: space-between; align-items: center; text-align: left; border: 1px solid #334155; }
        .pdf-info b { display: block; color: #f8fafc; font-size: 0.9rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 180px; }
        .pdf-info span { font-size: 0.75rem; color: #6366f1; font-weight: 600; }
        .view-link { color: #6366f1; text-decoration: none; font-size: 0.8rem; font-weight: bold; border: 1px solid #6366f1; padding: 5px 10px; border-radius: 6px; transition: 0.3s; }
        .view-link:hover { background: var(--primary); color: white; }

        .gallery-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin-top: 15px; }
        .gallery-img { width: 100%; height: 80px; object-fit: cover; border-radius: 8px; border: 1px solid #334155; cursor: pointer; }

        #status { margin-top: 15px; font-size: 0.85rem; color: #6366f1; display: none; font-weight: bold; animation: pulse 1.5s infinite; }
        @keyframes pulse { 0% { opacity: 0.5; } 50% { opacity: 1; } 100% { opacity: 0.5; } }
    </style>
</head>
<body>

    <div class="card">
        <h2 id="mainTitle">📄 Media Uploader</h2>
        
        <div class="stats-box">
            <span style="font-size: 0.9rem; color: #94a3b8;">Total Media: </span>
            <span id="totalMedia" style="font-weight: bold; color: #6366f1;">0</span>
        </div>

        <div class="upload-type">
            <div id="pdfTab" class="type-btn active-type" onclick="switchMode('pdf')">PDF Upload</div>
            <div id="imgTab" class="type-btn" onclick="switchMode('image')">Image Upload</div>
        </div>

        <form id="uploadForm">
            <div class="form-group" id="courseContainer">
                <label>Course Select Karein</label>
                <select id="category" required>
                    <option value="" disabled selected>Course chunein...</option>
                    <option value="Computer Basics">Computer Basics (MS Office)</option>
                    <option value="CCC">CCC (Course on Computer Concepts)</option>
                    <option value="BCC">BCC (Basic Computer Course)</option>
                    <option value="DCA">DCA (Diploma in Computer Applications)</option>
                    <option value="ADCA">ADCA (Advance Diploma in Computer App.)</option>
                    <option value="O Level">O Level (NIELIT)</option>
                    <option value="A Level">A Level (NIELIT)</option>
                    <option value="Tally Prime / ERP 9">Tally Prime / ERP 9</option>
                    <option value="DTP">DTP (Photoshop / CorelDraw)</option>
                    <option value="Web Development">Web Development (HTML/CSS/JS)</option>
                    <option value="Python">Python Programming</option>
                    <option value="Java / C++">Java / C++ Language</option>
                    <option value="Typing">Typing (Hindi / English)</option>
                    <option value="Other">Other</option>
                </select>
            </div>

            <div class="form-group">
                <label id="fileLabel">PDF Select Karein (Max 4MB)</label>
                <input type="file" id="mediaFile" required>
            </div>

            <div class="form-group">
                <label>Description</label>
                <textarea id="mediaDesc" rows="2" placeholder="File ke baare mein kuch likhein..." required></textarea>
            </div>

            <button type="submit" id="submitBtn">Database Mein Save Karein</button>
            <div id="status">Database mein upload ho raha hai...</div>
        </form>
    </div>

    <div class="library-card" id="pdfSection">
        <h3>📚 Recent PDFs</h3>
        <div id="pdfList">Data load ho raha hai...</div>
    </div>

    <div class="library-card" id="imgSection">
        <h3>🖼️ Recent Gallery</h3>
        <div id="imgList" class="gallery-grid">Data load ho raha hai...</div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAOQtM_XYLqPgxMK1XBdfl0m7KoAseZRCA",
            authDomain: "snt-computer-institute.firebaseapp.com",
            databaseURL: "https://snt-computer-institute-default-rtdb.firebaseio.com",
            projectId: "snt-computer-institute",
            storageBucket: "snt-computer-institute.firebasestorage.app",
            messagingSenderId: "117580784781",
            appId: "1:117580784781:web:73ba19d2d008beb3a5eec4"
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        let currentMode = 'pdf';
        switchMode('pdf'); // Default start

        // --- Fetch Data ---
        function loadContent() {
            // PDFs load karein
            database.ref('myPDFs').on('value', (snap) => {
                const pdfList = document.getElementById('pdfList');
                pdfList.innerHTML = "";
                if(snap.exists()){
                    snap.forEach(child => {
                        const val = child.val();
                        pdfList.innerHTML += `
                            <div class="pdf-item">
                                <div class="pdf-info">
                                    <b>${val.name}</b>
                                    <span>${val.category || 'Course'}</span>
                                </div>
                                <a href="${val.data}" target="_blank" class="view-link">Open</a>
                            </div>`;
                    });
                } else { pdfList.innerHTML = "No PDFs found."; }
                updateTotal();
            });

            // Images load karein
            database.ref('myImages').on('value', (snap) => {
                const imgList = document.getElementById('imgList');
                imgList.innerHTML = "";
                if(snap.exists()){
                    snap.forEach(child => {
                        const val = child.val();
                        imgList.innerHTML += `<a href="${val.data}" target="_blank"><img src="${val.data}" class="gallery-img"></a>`;
                    });
                } else { imgList.innerHTML = "No images."; }
                updateTotal();
            });
        }

        function updateTotal() {
            database.ref().once('value', (snap) => {
                const p = snap.child('myPDFs').numChildren() || 0;
                const i = snap.child('myImages').numChildren() || 0;
                document.getElementById('totalMedia').innerText = p + i;
            });
        }

        function switchMode(mode) {
            currentMode = mode;
            const pdfTab = document.getElementById('pdfTab');
            const imgTab = document.getElementById('imgTab');
            const fileInput = document.getElementById('mediaFile');
            const fileLabel = document.getElementById('fileLabel');
            const courseBox = document.getElementById('courseContainer');

            pdfTab.classList.toggle('active-type', mode === 'pdf');
            imgTab.classList.toggle('active-type', mode === 'image');
            
            if(mode === 'pdf') {
                document.getElementById('mainTitle').innerText = "📄 PDF Uploader";
                fileInput.accept = "application/pdf";
                fileLabel.innerText = "PDF Select Karein (Max 4MB)";
                courseBox.style.display = "block";
                document.getElementById('category').required = true;
            } else {
                document.getElementById('mainTitle').innerText = "🖼️ Image Uploader";
                fileInput.accept = "image/*";
                fileLabel.innerText = "Image Select Karein (Max 2MB)";
                courseBox.style.display = "none";
                document.getElementById('category').required = false;
            }
        }

        document.getElementById('uploadForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const status = document.getElementById('status');
            const file = document.getElementById('mediaFile').files[0];
            
            const limit = currentMode === 'pdf' ? 4194304 : 2097152;
            if(file.size > limit) { alert("File size bahut badi hai!"); return; }

            btn.disabled = true;
            status.style.display = "block";

            const reader = new FileReader();
            reader.onload = function(event) {
                const payload = {
                    name: file.name,
                    data: event.target.result,
                    desc: document.getElementById('mediaDesc').value,
                    date: new Date().toLocaleString()
                };
                if(currentMode === 'pdf') payload.category = document.getElementById('category').value;

                const path = currentMode === 'pdf' ? 'myPDFs' : 'myImages';
                database.ref(path).push(payload).then(() => {
                    alert("Data Save Ho Gaya!");
                    btn.disabled = false;
                    status.style.display = "none";
                    document.getElementById('uploadForm').reset();
                });
            };
            reader.readAsDataURL(file);
        });

        loadContent();
    </script>
</body>
</html>
