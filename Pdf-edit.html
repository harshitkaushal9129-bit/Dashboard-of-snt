<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SNT - Media Upload</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #6366f1; --bg: #0f172a; }
        body { font-family: 'Poppins', sans-serif; background: var(--bg); display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; color: white; flex-direction: column; padding: 20px; }
        .card { background: #1e293b; padding: 2rem; border-radius: 15px; width: 100%; max-width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.3); text-align: center; border: 1px solid rgba(255,255,255,0.1); }
        .stats-box { background: rgba(99, 102, 241, 0.1); padding: 10px; border-radius: 8px; margin-bottom: 15px; border: 1px dashed var(--primary); }
        .form-group { margin-bottom: 1.2rem; text-align: left; }
        label { display: block; font-weight: 600; margin-bottom: 8px; font-size: 0.9rem; color: #94a3b8; }
        input, textarea, select { width: 100%; padding: 12px; border: 2px solid #334155; border-radius: 8px; box-sizing: border-box; background: #0f172a; color: white; outline: none; }
        button { width: 100%; background: var(--primary); color: white; border: none; padding: 12px; border-radius: 8px; font-weight: 600; cursor: pointer; margin-top: 10px; }
        #status { margin-top: 15px; font-size: 0.85rem; color: #6366f1; display: none; }
    </style>
</head>
<body>
    <div class="card">
        <h2 id="mainTitle">📄 Media Uploader</h2>
        <div class="stats-box">
            <span style="font-size: 0.9rem; color: #94a3b8;">Total PDFs: </span>
            <span id="pdfCount" style="font-weight: bold; color: #6366f1;">...</span>
        </div>
        <form id="uploadForm">
            <div class="form-group">
                <label>Course Select Karein</label>
                <select id="category" required>
                    <option value="" disabled selected>Course chunein...</option>
                    <option value="Computer Basics">Computer Basics</option>
                    <option value="C++ Language">C++ Language</option>
                    <option value="Java">Java</option>
                    <option value="O Level">O Level</option>
                    <option value="DCA & ADCA">DCA & ADCA</option>
                    <option value="CCC">CCC</option>
                    <option value="Python">Python</option>
                    <option value="Tally ERP 9">Tally ERP 9</option>
                    <option value="Other">Other</option>
                </select>
            </div>
            <div class="form-group">
                <label>PDF Select Karein (Max 4MB)</label>
                <input type="file" id="mediaFile" accept="application/pdf" required>
            </div>
            <div class="form-group">
                <label>Description</label>
                <textarea id="mediaDesc" rows="2" placeholder="Details..." required></textarea>
            </div>
            <button type="submit" id="submitBtn">Save Karein</button>
            <div id="status">Database mein save ho raha hai...</div>
        </form>
        <a href="pdf.html" style="display:block; margin-top:15px; text-decoration:none; color:#64748b; font-size:0.9rem;">View Library →</a>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAOQtM_XYLqPgxMK1XBdfl0m7KoAseZRCA",
            authDomain: "snt-computer-institute.firebaseapp.com",
            databaseURL: "https://snt-computer-institute-default-rtdb.firebaseio.com",
            projectId: "snt-computer-institute",
            storageBucket: "snt-computer-institute.firebasestorage.app",
            messagingSenderId: "117580784781",
            appId: "1:117580784781:web:73ba19d2d008beb3a5eec4"
        };
        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();

        database.ref('myPDFs').on('value', snap => {
            document.getElementById('pdfCount').innerText = snap.numChildren();
        });

        document.getElementById('uploadForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const file = document.getElementById('mediaFile').files[0];
            
            if(file.size > 4194304) { alert("File 4MB se badi hai!"); return; }

            btn.disabled = true;
            document.getElementById('status').style.display = "block";

            const reader = new FileReader();
            reader.onload = function(event) {
                const newData = {
                    name: file.name,
                    fileData: event.target.result, // Key name fix: 'fileData'
                    desc: document.getElementById('mediaDesc').value,
                    category: document.getElementById('category').value,
                    date: new Date().toLocaleString()
                };
                database.ref('myPDFs').push(newData).then(() => {
                    alert('PDF Save ho gayi!');
                    location.reload();
                });
            };
            reader.readAsDataURL(file);
        });
    </script>
</body>
</html>
