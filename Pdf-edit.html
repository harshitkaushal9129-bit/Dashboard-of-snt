<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload PDF - Pro Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #6366f1; --bg: #f8fafc; --text: #1e293b; }
        body { font-family: 'Poppins', sans-serif; background: var(--bg); color: var(--text); display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
        .card { background: white; padding: 2rem; border-radius: 15px; width: 90%; max-width: 400px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); }
        h2 { text-align: center; color: var(--primary); margin-bottom: 1.5rem; }
        .form-group { margin-bottom: 1.2rem; }
        label { display: block; font-weight: 600; margin-bottom: 5px; font-size: 0.9rem; }
        input, textarea { width: 100%; padding: 12px; border: 2px solid #e2e8f0; border-radius: 8px; box-sizing: border-box; transition: 0.3s; font-family: inherit; }
        input:focus, textarea:focus { border-color: var(--primary); outline: none; }
        button { width: 100%; background: var(--primary); color: white; border: none; padding: 12px; border-radius: 8px; font-weight: 600; cursor: pointer; transition: 0.3s; margin-top: 10px; }
        button:disabled { background: #a5a6f6; cursor: not-allowed; }
        #progress { display: none; text-align: center; margin-top: 10px; font-weight: 600; color: var(--primary); }
        .view-link { text-align: center; display: block; margin-top: 1.5rem; color: #64748b; text-decoration: none; font-size: 0.9rem; }
    </style>
</head>
<body>
    <div class="card">
        <h2>📄 PDF Uploader</h2>
        <form id="pdfForm">
            <div class="form-group">
                <label>File Select Karein (Unlimited Size)</label>
                <input type="file" id="pdfFile" accept="application/pdf" required>
            </div>
            <div class="form-group">
                <label>Description</label>
                <textarea id="pdfDesc" placeholder="File ke baare mein likhein..." rows="3" required></textarea>
            </div>
            <button type="submit" id="submitBtn">Save Karein</button>
            <div id="progress">Uploading: <span id="percent">0%</span></div>
        </form>
        <a href="pdf.html" class="view-link">Saved Files Dekhein →</a>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-storage-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAOQtM_XYLqPgxMK1XBdfl0m7KoAseZRCA",
            authDomain: "snt-computer-institute.firebaseapp.com",
            databaseURL: "https://snt-computer-institute-default-rtdb.firebaseio.com",
            projectId: "snt-computer-institute",
            storageBucket: "snt-computer-institute.firebasestorage.app",
            messagingSenderId: "117580784781",
            appId: "1:117580784781:web:73ba19d2d008beb3a5eec4",
            measurementId: "G-6FKGX17D7F"
        };

        firebase.initializeApp(firebaseConfig);
        const database = firebase.database();
        const storage = firebase.storage();

        document.getElementById('pdfForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const btn = document.getElementById('submitBtn');
            const file = document.getElementById('pdfFile').files[0];
            const desc = document.getElementById('pdfDesc').value;
            const progressDiv = document.getElementById('progress');
            const percentText = document.getElementById('percent');

            btn.disabled = true;
            btn.innerText = "Wait...";
            progressDiv.style.display = "block";

            // Storage Ref (Unique name ke liye timestamp use kiya)
            const storageRef = storage.ref('my_pdfs/' + Date.now() + "_" + file.name);
            const uploadTask = storageRef.put(file);

            uploadTask.on('state_changed', 
                (snapshot) => {
                    const prog = (snapshot.bytesTransferred / snapshot.totalBytes) * 100;
                    percentText.innerText = Math.round(prog) + "%";
                }, 
                (error) => { alert(error.message); btn.disabled = false; }, 
                () => {
                    uploadTask.snapshot.ref.getDownloadURL().then((downloadURL) => {
                        const newData = {
                            name: file.name,
                            pdf: downloadURL,
                            desc: desc,
                            date: new Date().toLocaleDateString()
                        };
                        database.ref('myPDFs').push(newData).then(() => {
                            alert('Success! File Save ho gayi.');
                            location.reload();
                        });
                    });
                }
            );
        });
    </script>
</body>
</html>
