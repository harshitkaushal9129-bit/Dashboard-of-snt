<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My PDF Vault - SNT Institute</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root { --primary: #38bdf8; --bg: #0f172a; }
        body { font-family: 'Poppins', sans-serif; background-color: var(--bg); color: white; margin: 0; padding: 15px; overflow-x: hidden; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); }
        .pdf-card { background: rgba(30, 41, 59, 0.6); border: 1px solid rgba(255,255,255,0.08); transition: 0.3s; border-radius: 20px; padding: 20px; position: relative; overflow: hidden; }
        .pdf-card:hover { border-color: var(--primary); transform: translateY(-3px); background: rgba(30, 41, 59, 0.9); }
        .course-badge { background: rgba(56, 189, 248, 0.1); color: var(--primary); padding: 4px 10px; border-radius: 8px; font-size: 10px; font-weight: 800; text-transform: uppercase; border: 1px solid rgba(56, 189, 248, 0.2); }
        .btn-view { width: 100%; background: var(--primary); color: #0f172a; font-weight: 800; padding: 12px; border-radius: 12px; margin-top: 15px; transition: 0.2s; display: flex; items-center; justify-content: center; gap: 8px; }
        .btn-view:active { transform: scale(0.95); opacity: 0.9; }

        /* Image Gallery Styling */
        .gallery-container { display: flex; overflow-x: auto; gap: 12px; padding-bottom: 15px; scrollbar-width: none; -ms-overflow-style: none; }
        .gallery-container::-webkit-scrollbar { display: none; }
        .img-item { min-width: 140px; max-width: 140px; background: #1e293b; border-radius: 15px; overflow: hidden; border: 1px solid rgba(255,255,255,0.05); cursor: pointer; transition: 0.3s; }
        .img-item:hover { border-color: var(--primary); transform: scale(1.02); }
        .img-item img { width: 100%; height: 90px; object-fit: cover; }

        /* Animations */
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fade-in { animation: fadeIn 0.5s ease forwards; }
    </style>
</head>
<body oncontextmenu="return false;">

    <div class="max-w-4xl mx-auto">
        <header class="flex justify-between items-center mb-6">
            <a href="index.html" class="w-10 h-10 glass rounded-full flex items-center justify-center text-sky-400 hover:bg-sky-500/10 transition-all">
                <i class="fas fa-arrow-left"></i>
            </a>
            <h1 class="text-xl font-black italic tracking-tighter uppercase">SNT <span class="text-sky-500">PDF Vault</span></h1>
            <div class="w-10 text-right"><i class="fas fa-shield-halved text-sky-500/50 text-xs"></i></div>
        </header>

        <div class="glass p-5 rounded-3xl mb-8 flex items-center gap-4 border-l-4 border-sky-500">
            <div class="relative">
                <img id="user-img" src="./SNT.jpg" class="w-14 h-14 rounded-full border-2 border-sky-500 object-cover shadow-lg shadow-sky-500/20">
                <div class="absolute bottom-0 right-0 w-4 h-4 bg-emerald-500 border-2 border-[#0f172a] rounded-full"></div>
            </div>
            <div>
                <h2 id="welcome-msg" class="text-lg font-black leading-tight">Loading Node...</h2>
                <p id="course-msg" class="text-sky-400 text-[10px] font-bold uppercase tracking-widest mt-1 opacity-80">Syncing Intelligence...</p>
            </div>
        </div>

        <div class="mb-8">
            <h3 class="text-xs font-bold mb-3 uppercase tracking-widest text-slate-400 flex items-center gap-2">
                <i class="fas fa-bolt text-yellow-400"></i> Latest Activity
            </h3>
            <div id="image-gallery" class="gallery-container">
                </div>
        </div>

        <h3 class="text-xs font-bold mb-3 uppercase tracking-widest text-slate-400 flex items-center gap-2">
            <i class="fas fa-file-pdf text-rose-500"></i> Neural Study Notes
        </h3>

        <div id="grid" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            </div>

        <div id="no-access" class="hidden text-center py-20 animate-fade-in">
            <div class="w-20 h-20 bg-slate-800/50 rounded-full flex items-center justify-center mx-auto mb-4 border border-white/5">
                <i class="fas fa-file-circle-xmark text-slate-600 text-3xl"></i>
            </div>
            <h3 class="text-slate-300 font-bold uppercase text-sm tracking-widest">No Access Detected</h3>
            <p class="text-slate-500 text-[10px] mt-2 max-w-[200px] mx-auto">Please contact SNT Admin if you believe this is an error or to upgrade your plan.</p>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>

    <script>
        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyAOQtM_XYLqPgxMK1XBdfl0m7KoAseZRCA",
            authDomain: "snt-computer-institute.firebaseapp.com",
            databaseURL: "https://snt-computer-institute-default-rtdb.firebaseio.com",
            projectId: "snt-computer-institute",
            storageBucket: "snt-computer-institute.firebasestorage.app",
            messagingSenderId: "117580784781",
            appId: "1:117580784781:web:73ba19d2d008beb3a5eec4"
        };

        // Initialize Firebase
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const auth = firebase.auth();

        /**
         * UPDATED: Tracking Logic with Transaction
         * It logs which PDF was viewed and increments count in user profile
         */
        function viewPDF(pdfKey, base64Data) {
            const user = auth.currentUser;
            if (user) {
                // Update viewed count for this specific PDF
                const trackRef = db.ref(`students/${user.uid}/viewedPDFs/${pdfKey}`);
                trackRef.transaction((currentCount) => {
                    return (currentCount || 0) + 1;
                });

                // Update global activity timestamp
                db.ref(`students/${user.uid}/lastSeen`).set(firebase.database.ServerValue.TIMESTAMP);
            }

            try {
                const blob = base64ToBlob(base64Data, 'application/pdf');
                const url = URL.createObjectURL(blob);
                window.open(url, '_blank');
            } catch (e) {
                console.error(e);
                alert("Buffer Error: PDF load karne mein dikkat aa rahi hai.");
            }
        }

        /**
         * Helper: Image Viewer
         */
        function viewImg(base64Data) {
            const win = window.open();
            win.document.write(`
                <body style="margin:0; background:#010409; display:flex; align-items:center; justify-content:center;">
                    <img src="${base64Data}" style="max-width:98%; max-height:98vh; border-radius:10px; box-shadow:0 20px 50px rgba(0,0,0,0.8); border:1px solid rgba(255,255,255,0.1);">
                </body>
            `);
        }

        /**
         * Helper: Base64 Converter
         */
        function base64ToBlob(base64, type) {
            const parts = base64.split(';base64,');
            const raw = window.atob(parts[1]);
            const rawLength = raw.length;
            const uInt8Array = new Uint8Array(rawLength);
            for (let i = 0; i < rawLength; ++i) {
                uInt8Array[i] = raw.charCodeAt(i);
            }
            return new Blob([uInt8Array], { type: type });
        }

        /**
         * Auth State Management
         */
        auth.onAuthStateChanged((user) => {
            if (user) {
                document.getElementById('user-img').src = user.photoURL || "./SNT.jpg";
                loadImages(); // Load common gallery

                // Real-time Student Data Listener
                db.ref('students/' + user.uid).on('value', (snapshot) => {
                    const studentData = snapshot.val();
                    if (studentData) {
                        const name = studentData.name || user.displayName || "Elite User";
                        const courses = studentData.courses || [];
                        
                        document.getElementById('welcome-msg').innerText = name;
                        const courseList = Array.isArray(courses) ? courses.join(", ") : (courses || "FREE ACCESS");
                        document.getElementById('course-msg').innerText = "Status: " + courseList;
                        
                        loadPDFs(courses);
                    } else {
                        // Fallback: Check if user exists by email if UID not matched
                        checkByEmail(user);
                    }
                });
            } else {
                window.location.href = "index.html";
            }
        });

        /**
         * Load Shared Images Gallery
         */
        function loadImages() {
            db.ref('myImages').on('value', (snap) => {
                const gallery = document.getElementById('image-gallery');
                gallery.innerHTML = '';
                const data = snap.val() || {};
                const keys = Object.keys(data).reverse();

                if (keys.length === 0) {
                    gallery.innerHTML = '<p class="text-[9px] text-slate-600 italic px-2">No system updates yet.</p>';
                    return;
                }

                keys.forEach(key => {
                    const img = data[key];
                    const div = document.createElement('div');
                    div.className = 'img-item flex-shrink-0 animate-fade-in';
                    div.onclick = () => viewImg(img.data);
                    div.innerHTML = `
                        <img src="${img.data}" loading="lazy">
                        <div class="p-2 bg-[#1e293b]/50">
                            <p class="text-[8px] font-black truncate text-sky-400 uppercase tracking-tighter">${img.name || 'System Update'}</p>
                            <p class="text-[7px] text-slate-500 line-clamp-1">${img.desc || ''}</p>
                        </div>
                    `;
                    gallery.appendChild(div);
                });
            });
        }

        /**
         * Fallback Email Check
         */
        function checkByEmail(user) {
            db.ref('students').orderByChild('email').equalTo(user.email).once('value', (snap) => {
                if(snap.exists()){
                    const data = Object.values(snap.val())[0];
                    loadPDFs(data.courses || []);
                } else {
                    document.getElementById('welcome-msg').innerText = "Guest Access";
                    loadPDFs([]);
                }
            });
        }

        /**
         * Core Function: Fetch and Filter PDFs
         */
        function loadPDFs(studentCourses) {
            const coursesArray = Array.isArray(studentCourses) ? studentCourses : [studentCourses];
            
            db.ref('myPDFs').on('value', (snap) => {
                const grid = document.getElementById('grid');
                const noAccess = document.getElementById('no-access');
                grid.innerHTML = '';
                const data = snap.val() || {};
                
                let found = 0;

                // Loop through all PDFs in database
                Object.keys(data).reverse().forEach(key => {
                    const pdf = data[key];
                    
                    // Logic: User sees PDF if category matches their course OR category is 'Other'/'All'
                    const isMatch = coursesArray.some(c => c?.trim() === pdf.category?.trim()) || 
                                    pdf.category === "Other" || 
                                    pdf.category === "All";

                    if (isMatch) {
                        found++;
                        const div = document.createElement('div');
                        div.className = 'pdf-card animate-fade-in shadow-xl';
                        div.style.animationDelay = `${found * 0.1}s`;
                        
                        div.innerHTML = `
                            <div class="flex justify-between items-start mb-3">
                                <span class="course-badge">${pdf.category || 'GEN'}</span>
                                <div class="bg-rose-500/10 p-2 rounded-lg"><i class="fas fa-file-pdf text-rose-500 text-lg"></i></div>
                            </div>
                            <h3 class="font-black text-sm mb-1 truncate text-white uppercase tracking-tight">${pdf.name}</h3>
                            <p class="text-[9px] text-slate-400 line-clamp-2 leading-relaxed mb-4 h-6 opacity-70">
                                ${pdf.desc || 'No additional metadata provided for this file.'}
                            </p>
                            <button onclick="viewPDF('${key}', '${pdf.pdf}')" class="btn-view">
                                <i class="fas fa-bolt-lightning text-[10px]"></i> ACCESS NOTES
                            </button>
                        `;
                        grid.appendChild(div);
                    }
                });

                // Display UI if no files match
                if (found === 0) {
                    noAccess.classList.remove('hidden');
                } else {
                    noAccess.classList.add('hidden');
                }
            });
        }
    </script>
</body>
</html>
