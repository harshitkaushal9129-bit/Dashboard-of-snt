<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SNT PDF VAULT - Fix Mode</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { font-family: 'Space Grotesk', sans-serif; background: #020617; color: #f8fafc; overflow-x: hidden; }
        .glass-card {
            background: rgba(30, 41, 59, 0.4); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.08);
            min-width: 260px; max-width: 260px; border-radius: 2rem; flex-shrink: 0; transition: 0.3s;
        }
        .slider-container { display: flex; overflow-x: auto; gap: 15px; padding: 10px 5px 30px 5px; scrollbar-width: none; }
        .slider-container::-webkit-scrollbar { display: none; }
        .course-header { border-left: 4px solid #38bdf8; padding-left: 15px; margin-bottom: 5px; }
        .animated-btn {
            background: linear-gradient(-45deg, #0ea5e9, #6366f1, #a855f7, #0ea5e9);
            background-size: 300% 300%; animation: gradientMove 5s ease infinite;
        }
        @keyframes gradientMove { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
    </style>
</head>
<body class="min-h-screen pb-10">

    <nav class="sticky top-0 z-50 px-6 py-4 backdrop-blur-xl border-b border-white/5 bg-slate-950/70 shadow-lg">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-black italic">SNT <span class="text-sky-400">VAULT</span></h1>
            <button onclick="location.reload()" class="w-10 h-10 rounded-full bg-white/5 flex items-center justify-center text-sky-400 border border-white/10">
                <i class="fas fa-sync-alt"></i>
            </button>
        </div>
    </nav>

    <main class="max-w-6xl mx-auto px-6 mt-8">
        <div id="course-wise-container">
            <div id="status-box" class="py-20 text-center">
                <div class="w-12 h-12 border-4 border-sky-500/20 border-t-sky-500 rounded-full animate-spin mx-auto mb-4"></div>
                <p id="status-text" class="text-xs font-bold uppercase tracking-widest text-slate-400">Searching Files in Vault...</p>
            </div>
        </div>

        <div id="no-data" class="hidden text-center py-20">
            <i class="fas fa-box-open text-slate-800 text-6xl mb-4"></i>
            <h3 class="text-white font-bold uppercase">No Files Found</h3>
            <p class="text-slate-500 text-xs mt-2 italic">Make sure 'myPDFs' node has data in Firebase.</p>
        </div>
    </main>

    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAOQtM_XYLqPgxMK1XBdfl0m7KoAseZRCA",
            authDomain: "snt-computer-institute.firebaseapp.com",
            databaseURL: "https://snt-computer-institute-default-rtdb.firebaseio.com",
            projectId: "snt-computer-institute",
            storageBucket: "snt-computer-institute.firebasestorage.app",
            messagingSenderId: "117580784781",
            appId: "1:117580784781:web:73ba19d2d008beb3a5eec4"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function loadData() {
            const container = document.getElementById('course-wise-container');
            const noData = document.getElementById('no-data');
            const statusBox = document.getElementById('status-box');

            // Use .once to get data quickly first
            db.ref('myPDFs').on('value', (snap) => {
                const data = snap.val();
                
                if (!data) {
                    statusBox.classList.add('hidden');
                    noData.classList.remove('hidden');
                    console.log("No Data Found in 'myPDFs'");
                    return;
                }

                noData.classList.add('hidden');
                container.innerHTML = ''; // Clear Everything

                // Process Data
                const groups = {};
                Object.keys(data).reverse().forEach(key => {
                    const item = data[key];
                    // Fallback category agar field missing ho
                    const cat = (item.category || item.course || 'GENERAL NOTES').toUpperCase();
                    if (!groups[cat]) groups[cat] = [];
                    groups[cat].push(item);
                });

                // Render Sliders
                for (const cat in groups) {
                    const section = document.createElement('div');
                    section.className = 'mb-10 animate-fade-in';
                    section.innerHTML = `
                        <div class="course-header mb-4 flex justify-between items-center pr-4">
                            <h4 class="text-sm font-bold uppercase tracking-widest text-sky-400">${cat}</h4>
                            <span class="text-[8px] text-slate-500 font-bold uppercase">Swipe Left <i class="fas fa-arrow-right"></i></span>
                        </div>
                        <div class="slider-container">
                            ${groups[cat].map(pdf => `
                                <div class="glass-card p-6 flex flex-col justify-between">
                                    <div>
                                        <div class="w-10 h-10 bg-red-500/10 rounded-xl flex items-center justify-center mb-6">
                                            <i class="fas fa-file-pdf text-red-500 text-lg"></i>
                                        </div>
                                        <h3 class="text-white font-bold text-sm mb-2 truncate">${pdf.name || 'Untitled File'}</h3>
                                        <p class="text-slate-500 text-[10px] line-clamp-2 italic h-8">${pdf.desc || 'Premium Study Material'}</p>
                                    </div>
                                    <button onclick="viewPDF('${pdf.data}')" class="w-full animated-btn mt-6 py-3.5 rounded-2xl text-slate-950 font-black text-[9px] tracking-[0.2em] uppercase active:scale-95 transition-all">
                                        VIEW NOTES
                                    </button>
                                </div>
                            `).join('')}
                        </div>
                    `;
                    container.appendChild(section);
                }
            }, (error) => {
                document.getElementById('status-text').innerText = "Access Denied: " + error.message;
            });
        }

        function viewPDF(pdfData) {
            if(!pdfData) return alert("File Data Missing!");
            try {
                let pdfWindow = window.open("");
                // If it's pure base64 without prefix
                let fullData = pdfData.startsWith('data:') ? pdfData : 'data:application/pdf;base64,' + pdfData;
                pdfWindow.document.write(`<iframe width='100%' height='100%' src='${fullData}' style='border:none;'></iframe>`);
            } catch (e) {
                alert("Popup Blocked or Browser Error");
            }
        }

        window.onload = loadData;
    </script>
</body>
</html>
