<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SNT PDF VAULT - Slider Mode</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body {
            font-family: 'Space Grotesk', sans-serif;
            background: #020617;
            color: #f8fafc;
            overflow-x: hidden;
        }

        /* Smooth Glass Card */
        .glass-card {
            background: rgba(30, 41, 59, 0.4);
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.08);
            min-width: 280px;
            max-width: 280px;
            border-radius: 2rem;
            flex-shrink: 0;
            transition: 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .glass-card:active { transform: scale(0.95); }

        /* Horizontal Scroll Logic */
        .slider-container {
            display: flex;
            overflow-x: auto;
            gap: 20px;
            padding: 10px 5px 30px 5px;
            scroll-snap-type: x mandatory;
            scrollbar-width: none; /* Firefox */
        }

        .slider-container::-webkit-scrollbar { display: none; }

        .slider-container > div { scroll-snap-align: start; }

        .course-header {
            border-left: 4px solid #38bdf8;
            padding-left: 15px;
            margin-bottom: 5px;
        }

        .animated-btn {
            background: linear-gradient(-45deg, #0ea5e9, #6366f1, #a855f7, #0ea5e9);
            background-size: 300% 300%;
            animation: gradientMove 5s ease infinite;
        }

        @keyframes gradientMove {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        .fade-in { animation: fadeIn 0.8s ease-in-out; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body class="min-h-screen pb-10">

    <nav class="sticky top-0 z-50 px-6 py-4 backdrop-blur-xl border-b border-white/5 bg-slate-950/70">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-black tracking-tighter italic">SNT <span class="text-sky-400">VAULT</span></h1>
            <a href="https://harshitkaushal9129-bit.github.io/Dashboard-of-snt/" class="text-[10px] font-bold px-4 py-2 rounded-xl border border-sky-500/30 text-sky-400 hover:bg-sky-500/10 transition tracking-widest uppercase">Official Portal</a>
        </div>
    </nav>

    <header class="max-w-4xl mx-auto px-6 pt-10 pb-6">
        <div class="flex items-center gap-4 bg-slate-900/50 p-4 rounded-3xl border border-white/5">
            <div class="w-16 h-16 rounded-2xl bg-sky-500 flex items-center justify-center shadow-lg shadow-sky-500/20">
                <i class="fas fa-graduation-cap text-2xl text-slate-950"></i>
            </div>
            <div>
                <h2 class="text-xl font-bold">Study Material Vault</h2>
                <p class="text-sky-400 text-[10px] font-black uppercase tracking-widest mt-1">SNT Computer Institute Official</p>
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-6 mt-6">
        <div id="course-wise-container" class="fade-in">
            <div class="py-20 text-center opacity-50">
                <div class="w-10 h-10 border-2 border-sky-500 border-t-transparent rounded-full animate-spin mx-auto mb-4"></div>
                <p class="text-xs uppercase tracking-widest">Loading Premium Courses...</p>
            </div>
        </div>

        <div id="no-data" class="hidden text-center py-20">
            <i class="fas fa-folder-open text-slate-800 text-5xl mb-4"></i>
            <h3 class="text-slate-500 font-bold uppercase tracking-widest">No Materials Available</h3>
        </div>
    </main>

    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAOQtM_XYLqPgxMK1XBdfl0m7KoAseZRCA",
            authDomain: "snt-computer-institute.firebaseapp.com",
            databaseURL: "https://snt-computer-institute-default-rtdb.firebaseio.com",
            projectId: "snt-computer-institute",
            storageBucket: "snt-computer-institute.firebasestorage.app",
            messagingSenderId: "117580784781",
            appId: "1:117580784781:web:73ba19d2d008beb3a5eec4"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function loadMaterials() {
            db.ref('myPDFs').on('value', (snap) => {
                const container = document.getElementById('course-wise-container');
                const noData = document.getElementById('no-data');
                container.innerHTML = '';
                
                const data = snap.val() || {};
                const keys = Object.keys(data).reverse();

                if (keys.length === 0) {
                    noData.classList.remove('hidden');
                    return;
                }
                noData.classList.add('hidden');

                // Logic: Grouping data by Category
                const groups = {};
                keys.forEach(key => {
                    const pdf = data[key];
                    const cat = (pdf.category || 'General Notes').toUpperCase();
                    if (!groups[cat]) groups[cat] = [];
                    groups[cat].push(pdf);
                });

                // Rendering each Category as a Slider Row
                for (const cat in groups) {
                    const section = document.createElement('div');
                    section.className = 'mb-10';
                    section.innerHTML = `
                        <div class="flex justify-between items-end px-1 mb-4">
                            <div class="course-header">
                                <h4 class="text-sm font-black uppercase tracking-widest text-white">${cat}</h4>
                                <p class="text-[9px] text-slate-500 font-bold uppercase tracking-tighter mt-1">${groups[cat].length} Premium Files Available</p>
                            </div>
                            <div class="flex gap-2 text-sky-500 text-[10px] font-bold animate-pulse">
                                SWIPE <i class="fas fa-arrow-right"></i>
                            </div>
                        </div>
                        
                        <div class="slider-container">
                            ${groups[cat].map(pdf => `
                                <div class="glass-card p-6 flex flex-col justify-between group">
                                    <div>
                                        <div class="flex justify-between items-start mb-6">
                                            <div class="w-12 h-12 bg-red-500/10 rounded-2xl flex items-center justify-center border border-red-500/20">
                                                <i class="fas fa-file-pdf text-red-500 text-xl group-hover:scale-110 transition"></i>
                                            </div>
                                            <span class="text-[8px] font-black py-1 px-2 bg-white/5 rounded border border-white/10 uppercase tracking-widest text-slate-400">PDF Document</span>
                                        </div>
                                        <h3 class="text-white font-bold text-base mb-2 group-hover:text-sky-400 transition-colors line-clamp-1">${pdf.name}</h3>
                                        <p class="text-slate-500 text-[11px] leading-relaxed mb-6 line-clamp-2 italic">
                                            ${pdf.desc || 'Premium SNT study material for successful career growth.'}
                                        </p>
                                    </div>
                                    
                                    <button onclick="viewPDF('${pdf.data}')" class="w-full animated-btn py-4 rounded-2xl text-slate-950 font-black text-[10px] tracking-[0.2em] uppercase hover:shadow-[0_0_15px_rgba(56,189,248,0.3)] transition-all">
                                        VIEW NOTES
                                    </button>
                                </div>
                            `).join('')}
                        </div>
                    `;
                    container.appendChild(section);
                }
            });
        }

        function viewPDF(base64Data) {
            if(!base64Data) return alert("File missing!");
            try {
                let source = base64Data;
                if(!source.includes('data:application/pdf;base64,')) {
                    source = 'data:application/pdf;base64,' + base64Data;
                }
                const win = window.open();
                win.document.write('<iframe src="' + source + '" frameborder="0" style="border:0; top:0px; left:0px; bottom:0px; right:0px; width:100%; height:100%;" allowfullscreen></iframe>');
            } catch (e) { alert("Error opening PDF"); }
        }

        window.onload = loadMaterials;
    </script>
</body>
</html>
