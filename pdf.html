<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SNT PDF Vault</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background: #0f172a; color: white; font-family: 'Poppins', sans-serif; padding: 15px; }
        .pdf-card { background: rgba(30, 41, 59, 0.7); border-radius: 15px; padding: 15px; border: 1px solid rgba(255,255,255,0.1); }
        .course-badge { background: #38bdf8; color: #0f172a; font-size: 10px; font-weight: bold; padding: 2px 8px; border-radius: 5px; }
        .btn-view { background: #38bdf8; width: 100%; color: #0f172a; font-weight: bold; padding: 10px; border-radius: 10px; margin-top: 10px; }
    </style>
</head>
<body>
    <div class="max-w-xl mx-auto">
        <header class="flex justify-between items-center mb-6">
            <h1 class="text-xl font-bold italic">SNT <span class="text-sky-400">VAULT</span></h1>
        </header>

        <div id="profile" class="bg-slate-800 p-4 rounded-2xl mb-6 flex items-center gap-4">
            <img id="user-img" src="./SNT.jpg" class="w-12 h-12 rounded-full border-2 border-sky-400">
            <div>
                <h2 id="welcome-msg" class="font-bold">Loading...</h2>
                <p id="course-msg" class="text-[10px] text-sky-400 font-bold uppercase">Checking...</p>
            </div>
        </div>

        <div id="grid" class="grid gap-4"></div>
        <div id="no-access" class="hidden text-center py-10 text-slate-500">PDFs not found for your course.</div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>
    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAOQtM_XYLqPgxMK1XBdfl0m7KoAseZRCA",
            authDomain: "snt-computer-institute.firebaseapp.com",
            databaseURL: "https://snt-computer-institute-default-rtdb.firebaseio.com",
            projectId: "snt-computer-institute",
            storageBucket: "snt-computer-institute.firebasestorage.app",
            messagingSenderId: "117580784781",
            appId: "1:117580784781:web:73ba19d2d008beb3a5eec4"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const auth = firebase.auth();

        auth.onAuthStateChanged(user => {
            if (user) {
                db.ref('students/' + user.uid).on('value', snap => {
                    const data = snap.val();
                    if(data) {
                        document.getElementById('welcome-msg').innerText = data.name;
                        document.getElementById('course-msg').innerText = "Course: " + (data.courses || "N/A");
                        loadPDFs(data.courses);
                    }
                });
            } else { window.location.href = "index.html"; }
        });

        function loadPDFs(studentCourses) {
            // Student ke courses ko list mein convert karein
            const userCourses = (Array.isArray(studentCourses) ? studentCourses : [studentCourses])
                                .map(c => c.toLowerCase().trim());

            db.ref('myPDFs').on('value', snap => {
                const grid = document.getElementById('grid');
                grid.innerHTML = '';
                let found = 0;
                
                snap.forEach(child => {
                    const pdf = child.val();
                    const pdfCat = (pdf.category || "").toLowerCase().trim();

                    if(userCourses.includes(pdfCat) || pdfCat === "other" || pdfCat === "all") {
                        found++;
                        const div = document.createElement('div');
                        div.className = 'pdf-card';
                        div.innerHTML = `
                            <span class="course-badge">${pdf.category}</span>
                            <h3 class="font-bold mt-2 text-sm">${pdf.name}</h3>
                            <button onclick="openPDF('${pdf.fileData}')" class="btn-view">VIEW NOTES</button>
                        `;
                        grid.appendChild(div);
                    }
                });
                document.getElementById('no-access').classList.toggle('hidden', found > 0);
            });
        }

        function openPDF(base64) {
            const win = window.open();
            win.document.write(`<iframe src="${base64}" frameborder="0" style="border:0; top:0px; left:0px; bottom:0px; right:0px; width:100%; height:100%;" allowfullscreen></iframe>`);
        }
    </script>
</body>
</html>
