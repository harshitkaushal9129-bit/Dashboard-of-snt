<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SNT PDF VAULT - Slider Mode</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { font-family: 'Space Grotesk', sans-serif; background: #020617; color: #f8fafc; overflow-x: hidden; }
        .glass-card {
            background: rgba(30, 41, 59, 0.4); backdrop-filter: blur(15px); border: 1px solid rgba(255, 255, 255, 0.08);
            min-width: 280px; max-width: 280px; border-radius: 2rem; flex-shrink: 0; transition: 0.4s;
        }
        .slider-container {
            display: flex; overflow-x: auto; gap: 20px; padding: 10px 5px 30px 5px; scrollbar-width: none;
        }
        .slider-container::-webkit-scrollbar { display: none; }
        .course-header { border-left: 4px solid #38bdf8; padding-left: 15px; margin-bottom: 5px; }
        .animated-btn {
            background: linear-gradient(-45deg, #0ea5e9, #6366f1, #a855f7, #0ea5e9);
            background-size: 300% 300%; animation: gradientMove 5s ease infinite;
        }
        @keyframes gradientMove { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
    </style>
</head>
<body class="min-h-screen pb-10">

    <nav class="sticky top-0 z-50 px-6 py-4 backdrop-blur-xl border-b border-white/5 bg-slate-950/70">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-black tracking-tighter italic">SNT <span class="text-sky-400">VAULT</span></h1>
            <button onclick="location.reload()" class="w-10 h-10 rounded-full bg-white/5 border border-white/10 flex items-center justify-center text-sky-400">
                <i class="fas fa-sync-alt"></i>
            </button>
        </div>
    </nav>

    <main class="max-w-6xl mx-auto px-6 mt-10">
        <div id="course-wise-container">
            <div id="main-loader" class="py-20 text-center">
                <div class="w-12 h-12 border-4 border-sky-500/20 border-t-sky-500 rounded-full animate-spin mx-auto mb-4"></div>
                <p class="text-xs font-bold uppercase tracking-widest text-slate-400">Connecting to Firebase...</p>
            </div>
        </div>

        <div id="no-data" class="hidden text-center py-20">
            <i class="fas fa-exclamation-triangle text-amber-500 text-5xl mb-4"></i>
            <h3 class="text-white font-bold uppercase">Database Empty</h3>
            <p class="text-slate-500 text-xs mt-2">No PDF files found in 'myPDFs' node.</p>
        </div>
    </main>

    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAOQtM_XYLqPgxMK1XBdfl0m7KoAseZRCA",
            authDomain: "snt-computer-institute.firebaseapp.com",
            databaseURL: "https://snt-computer-institute-default-rtdb.firebaseio.com",
            projectId: "snt-computer-institute",
            storageBucket: "snt-computer-institute.firebasestorage.app",
            messagingSenderId: "117580784781",
            appId: "1:117580784781:web:73ba19d2d008beb3a5eec4"
        };

        // Initialize Firebase
        try {
            firebase.initializeApp(firebaseConfig);
            console.log("Firebase Initialized");
        } catch (e) {
            document.getElementById('main-loader').innerHTML = "Firebase Config Error!";
        }

        const db = firebase.database();

        function loadMaterials() {
            // Timeout alert if loading takes more than 10 seconds
            const timer = setTimeout(() => {
                if(document.getElementById('main-loader')) {
                    document.getElementById('main-loader').innerHTML = `
                        <p class="text-red-400 text-sm mb-4 font-bold">Network Slow or Database Offline</p>
                        <button onclick="location.reload()" class="bg-sky-500 text-slate-950 px-6 py-2 rounded-full font-bold text-xs uppercase">Retry Now</button>
                    `;
                }
            }, 10000);

            db.ref('myPDFs').on('value', (snap) => {
                clearTimeout(timer); // Data mil gaya toh timer band
                const container = document.getElementById('course-wise-container');
                const noData = document.getElementById('no-data');
                
                const data = snap.val();
                if (!data) {
                    container.innerHTML = '';
                    noData.classList.remove('hidden');
                    return;
                }

                noData.classList.add('hidden');
                container.innerHTML = ''; // Clear loader
                
                const keys = Object.keys(data).reverse();
                const groups = {};

                keys.forEach(key => {
                    const pdf = data[key];
                    // IMPORTANT: Checking field names
                    const cat = (pdf.category || 'General').toUpperCase();
                    if (!groups[cat]) groups[cat] = [];
                    groups[cat].push(pdf);
                });

                for (const cat in groups) {
                    const section = document.createElement('div');
                    section.className = 'mb-12';
                    section.innerHTML = `
                        <div class="course-header mb-4 flex justify-between items-center pr-4">
                            <h4 class="text-sm font-black uppercase tracking-widest text-white">${cat}</h4>
                            <span class="text-[9px] text-sky-400 font-bold italic">Slide <i class="fas fa-chevron-right ml-1"></i></span>
                        </div>
                        <div class="slider-container">
                            ${groups[cat].map(pdf => `
                                <div class="glass-card p-6 flex flex-col justify-between">
                                    <div>
                                        <div class="flex justify-between mb-6">
                                            <div class="w-12 h-12 bg-red-500/10 rounded-2xl flex items-center justify-center border border-red-500/20">
                                                <i class="fas fa-file-pdf text-red-500 text-xl"></i>
                                            </div>
                                        </div>
                                        <h3 class="text-white font-bold text-base mb-2 line-clamp-1">${pdf.name || 'Untitled'}</h3>
                                        <p class="text-slate-500 text-[11px] mb-6 line-clamp-2 italic">${pdf.desc || 'Premium Study Material'}</p>
                                    </div>
                                    <button onclick="viewPDF('${pdf.data}')" class="w-full animated-btn py-4 rounded-2xl text-slate-950 font-black text-[10px] tracking-[0.2em] uppercase transition-all active:scale-95">
                                        VIEW NOTES
                                    </button>
                                </div>
                            `).join('')}
                        </div>
                    `;
                    container.appendChild(section);
                }
            }, (error) => {
                document.getElementById('main-loader').innerHTML = "Permission Denied! Check Firebase Rules.";
                console.error(error);
            });
        }

        function viewPDF(base64Data) {
            if(!base64Data) return alert("Error: File data is empty!");
            try {
                let source = base64Data;
                if(!source.startsWith('data:application/pdf;base64,')) {
                    source = 'data:application/pdf;base64,' + base64Data;
                }
                const win = window.open();
                win.document.write('<iframe src="' + source + '" frameborder="0" style="border:0; top:0px; left:0px; bottom:0px; right:0px; width:100%; height:100%;" allowfullscreen></iframe>');
            } catch (e) { alert("Could not open PDF."); }
        }

        window.onload = loadMaterials;
    </script>
</body>
</html>
