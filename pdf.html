<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SNT PDF VAULT - Slider Mode</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root { --primary: #38bdf8; --bg: #0f172a; }
        body { font-family: 'Poppins', sans-serif; background-color: var(--bg); color: white; margin: 0; padding: 15px; overflow-x: hidden; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); }
        
        /* Slider Styling */
        .pdf-slider { 
            display: flex; 
            overflow-x: auto; 
            gap: 15px; 
            padding: 10px 5px 20px 5px; 
            scrollbar-width: none; /* Firefox */
        }
        .pdf-slider::-webkit-scrollbar { display: none; /* Chrome/Safari */ }
        
        .pdf-card { 
            min-width: 260px; 
            max-width: 260px; 
            background: rgba(30, 41, 59, 0.6); 
            border: 1px solid rgba(255,255,255,0.08); 
            transition: 0.3s; 
            border-radius: 24px; 
            padding: 20px; 
            flex-shrink: 0;
        }
        .pdf-card:active { transform: scale(0.95); }
        
        .course-badge { background: rgba(56, 189, 248, 0.1); color: var(--primary); padding: 4px 10px; border-radius: 8px; font-size: 10px; font-weight: 800; text-transform: uppercase; border: 1px solid rgba(56, 189, 248, 0.2); }
        .btn-view { width: 100%; background: var(--primary); color: #0f172a; font-weight: 800; padding: 12px; border-radius: 12px; margin-top: 15px; }
        
        .gallery-container { display: flex; overflow-x: auto; gap: 12px; padding-bottom: 15px; scrollbar-width: none; }
        .img-item { min-width: 140px; max-width: 140px; background: #1e293b; border-radius: 15px; overflow: hidden; border: 1px solid rgba(255,255,255,0.05); }
        .course-header { border-left: 4px solid var(--primary); padding-left: 12px; margin-bottom: 10px; }
    </style>
</head>
<body>

    <div class="max-w-4xl mx-auto">
        <header class="flex justify-between items-center mb-6">
            <a href="index.html" class="w-10 h-10 glass rounded-full flex items-center justify-center text-sky-400">
                <i class="fas fa-arrow-left"></i>
            </a>
            <h1 class="text-xl font-black italic tracking-tighter">SNT <span class="text-sky-500">PDF VAULT</span></h1>
            <div class="w-10"></div> 
        </header>

        <div class="glass p-5 rounded-3xl mb-8 flex items-center gap-4 border-l-4 border-sky-500">
            <img src="./SNT.jpg" class="w-14 h-14 rounded-full border-2 border-sky-500 object-cover" onerror="this.src='https://via.placeholder.com/100'">
            <div>
                <h2 class="text-lg font-black leading-tight">Study Material Portal</h2>
                <p class="text-sky-400 text-[10px] font-bold uppercase tracking-widest mt-1">SNT Computer Institute Official</p>
            </div>
        </div>

        <div class="mb-8">
            <h3 class="text-xs font-bold mb-3 uppercase tracking-widest text-slate-400 flex items-center gap-2">
                <i class="fas fa-bullhorn text-sky-400"></i> Recent Updates
            </h3>
            <div id="image-gallery" class="gallery-container"></div>
        </div>

        <div id="course-wise-container">
            <p class="text-slate-500 text-xs">Loading course materials...</p>
        </div>

        <div id="no-data" class="hidden text-center py-20">
            <i class="fas fa-box-open text-slate-600 text-4xl mb-3"></i>
            <h3 class="text-slate-400 font-bold">No Files Found</h3>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAOQtM_XYLqPgxMK1XBdfl0m7KoAseZRCA",
            authDomain: "snt-computer-institute.firebaseapp.com",
            databaseURL: "https://snt-computer-institute-default-rtdb.firebaseio.com",
            projectId: "snt-computer-institute",
            storageBucket: "snt-computer-institute.firebasestorage.app",
            messagingSenderId: "117580784781",
            appId: "1:117580784781:web:73ba19d2d008beb3a5eec4"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function viewPDF(base64Data) {
            if(!base64Data) return alert("File missing!");
            try {
                const parts = base64Data.split(';base64,');
                const raw = window.atob(parts[1] || parts[0]);
                const uInt8Array = new Uint8Array(raw.length);
                for (let i = 0; i < raw.length; ++i) uInt8Array[i] = raw.charCodeAt(i);
                const blob = new Blob([uInt8Array], { type: 'application/pdf' });
                window.open(URL.createObjectURL(blob), '_blank');
            } catch (e) { alert("Error opening PDF"); }
        }

        function loadAllContent() {
            // Images Slider
            db.ref('myImages').on('value', (snap) => {
                const gallery = document.getElementById('image-gallery');
                gallery.innerHTML = '';
                const data = snap.val() || {};
                Object.keys(data).reverse().forEach(key => {
                    const img = data[key];
                    gallery.innerHTML += `
                        <div class="img-item flex-shrink-0" onclick="window.open('${img.data}', '_blank')">
                            <img src="${img.data}" class="w-full h-24 object-cover">
                            <div class="p-2"><p class="text-[9px] font-bold truncate text-sky-400">${img.name || 'Update'}</p></div>
                        </div>`;
                });
            });

            // PDFs Sliding Categories
            db.ref('myPDFs').on('value', (snap) => {
                const container = document.getElementById('course-wise-container');
                const noData = document.getElementById('no-data');
                container.innerHTML = '';
                
                const data = snap.val() || {};
                const keys = Object.keys(data).reverse();

                if (keys.length === 0) { noData.classList.remove('hidden'); return; }
                noData.classList.add('hidden');

                // Grouping
                const groups = {};
                keys.forEach(key => {
                    const pdf = data[key];
                    const cat = pdf.category || 'General';
                    if (!groups[cat]) groups[cat] = [];
                    groups[cat].push(pdf);
                });

                // Render each category as a horizontal slider
                for (const cat in groups) {
                    const section = document.createElement('div');
                    section.className = 'mb-8';
                    section.innerHTML = `
                        <div class="course-header flex justify-between items-center pr-4">
                            <h4 class="text-sm font-black uppercase tracking-widest text-white">${cat}</h4>
                            <span class="text-[9px] text-slate-500 font-bold italic">Swipe <i class="fas fa-arrow-right ml-1"></i></span>
                        </div>
                        <div class="pdf-slider">
                            ${groups[cat].map(pdf => `
                                <div class="pdf-card glass">
                                    <div class="flex justify-between items-start mb-4">
                                        <div class="w-10 h-10 bg-red-500/10 rounded-xl flex items-center justify-center">
                                            <i class="fas fa-file-pdf text-red-500 text-lg"></i>
                                        </div>
                                        <span class="course-badge">${cat}</span>
                                    </div>
                                    <h3 class="font-bold text-sm mb-1 truncate text-white">${pdf.name}</h3>
                                    <p class="text-[10px] text-slate-400 line-clamp-2 h-7">${pdf.desc || 'No description available.'}</p>
                                    <button onclick="viewPDF('${pdf.data}')" class="btn-view">
                                        VIEW NOTES
                                    </button>
                                </div>
                            `).join('')}
                        </div>
                    `;
                    container.appendChild(section);
                }
            });
        }
        window.onload = loadAllContent;
    </script>
</body>
</html>
