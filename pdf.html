<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My PDF Vault - SNT Institute</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        :root { --primary: #38bdf8; --bg: #0f172a; }
        body { font-family: 'Poppins', sans-serif; background-color: var(--bg); color: white; margin: 0; padding: 15px; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); }
        .pdf-card { background: rgba(30, 41, 59, 0.6); border: 1px solid rgba(255,255,255,0.08); transition: 0.3s; border-radius: 20px; padding: 20px; position: relative; }
        .pdf-card:hover { border-color: var(--primary); transform: translateY(-3px); }
        .course-badge { background: rgba(56, 189, 248, 0.1); color: var(--primary); padding: 4px 10px; border-radius: 8px; font-size: 10px; font-weight: 800; text-transform: uppercase; border: 1px solid rgba(56, 189, 248, 0.2); }
        .btn-view { width: 100%; background: var(--primary); color: #0f172a; font-weight: 800; padding: 12px; border-radius: 12px; margin-top: 15px; transition: 0.2s; }
        .btn-view:active { transform: scale(0.95); opacity: 0.9; }

        .gallery-container { display: flex; overflow-x: auto; gap: 12px; padding-bottom: 10px; scrollbar-width: none; }
        .gallery-container::-webkit-scrollbar { display: none; }
        .img-item { min-width: 140px; max-width: 140px; background: #1e293b; border-radius: 15px; overflow: hidden; border: 1px solid rgba(255,255,255,0.05); position: relative; }
        .img-item img { width: 100%; height: 90px; object-fit: cover; cursor: pointer; }
        
        .delete-btn { color: #64748b; transition: 0.2s; cursor: pointer; }
        .delete-btn:hover { color: #ef4444; }
        
        /* Danger Zone Style */
        .danger-zone { border-bottom: 3px solid #ef4444; background: rgba(239, 68, 68, 0.05); }
    </style>
</head>
<body oncontextmenu="return false;">

    <div class="max-w-4xl mx-auto">
        <header class="flex justify-between items-center mb-6">
            <a href="index.html" class="w-10 h-10 glass rounded-full flex items-center justify-center text-sky-400">
                <i class="fas fa-arrow-left"></i>
            </a>
            <h1 class="text-xl font-black italic tracking-tighter">SNT <span class="text-sky-500">PDF VAULT</span></h1>
            <div class="w-10"></div> 
        </header>

        <div class="glass p-5 rounded-3xl mb-6 flex items-center gap-4 border-l-4 border-sky-500">
            <img id="user-img" src="./SNT.jpg" class="w-14 h-14 rounded-full border-2 border-sky-500 object-cover">
            <div>
                <h2 id="welcome-msg" class="text-lg font-black leading-tight">Loading Profile...</h2>
                <p id="course-msg" class="text-sky-400 text-[10px] font-bold uppercase tracking-widest mt-1">Checking Courses...</p>
            </div>
        </div>

        <div class="glass p-4 rounded-2xl mb-8 danger-zone flex justify-between items-center">
            <div>
                <h4 class="text-[9px] font-bold text-red-400 uppercase tracking-widest">Admin Control</h4>
                <p class="text-xs font-black">All PDFs: <span id="bulkCount" class="text-red-500">0</span></p>
            </div>
            <button onclick="deleteAllPDFs()" class="bg-red-500/10 text-red-500 border border-red-500/30 px-3 py-2 rounded-xl text-[10px] font-bold hover:bg-red-500 hover:text-white transition-all">
                <i class="fas fa-trash-sweep mr-1"></i> DELETE ALL DATA
            </button>
        </div>

        <div class="mb-8">
            <h3 class="text-xs font-bold mb-3 uppercase tracking-widest text-slate-400 flex items-center gap-2">
                <i class="fas fa-image text-sky-400"></i> Latest Updates
            </h3>
            <div id="image-gallery" class="gallery-container"></div>
        </div>

        <h3 class="text-xs font-bold mb-3 uppercase tracking-widest text-slate-400 flex items-center gap-2">
            <i class="fas fa-file-pdf text-red-500"></i> Study Notes
        </h3>
        <div id="grid" class="grid grid-cols-1 sm:grid-cols-2 gap-4"></div>

        <div id="no-access" class="hidden text-center py-20">
            <div class="w-20 h-20 bg-slate-800 rounded-full flex items-center justify-center mx-auto mb-4">
                <i class="fas fa-file-circle-xmark text-slate-600 text-3xl"></i>
            </div>
            <h3 class="text-slate-400 font-bold">Koi PDF nahi mili</h3>
            <p class="text-slate-500 text-xs mt-1">Aapke selected courses ke notes jald hi upload honge.</p>
        </div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAOQtM_XYLqPgxMK1XBdfl0m7KoAseZRCA",
            authDomain: "snt-computer-institute.firebaseapp.com",
            databaseURL: "https://snt-computer-institute-default-rtdb.firebaseio.com",
            projectId: "snt-computer-institute",
            storageBucket: "snt-computer-institute.firebasestorage.app",
            messagingSenderId: "117580784781",
            appId: "1:117580784781:web:73ba19d2d008beb3a5eec4"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        const auth = firebase.auth();

        // Single Item Delete
        function deleteData(path, key) {
            if(confirm("⚠ Kya aap ise delete karna chahte hain?")) {
                db.ref(`${path}/${key}`).remove()
                .then(() => alert("Entry deleted."))
                .catch((err) => alert("Error: " + err.message));
            }
        }

        // NEW: Bulk Delete PDFs Function
        function deleteAllPDFs() {
            const check1 = confirm("❗ WARNING: Kya aap SARE uploaded PDFs hamesha ke liye delete karna chahte hain?");
            if (check1) {
                const check2 = confirm("⚠ Double Confirmation: Ye process undo nahi hoga. Kya aap sure hain?");
                if (check2) {
                    db.ref('myPDFs').remove()
                    .then(() => alert("Success: Saara PDF data delete ho gaya!"))
                    .catch((err) => alert("Error: " + err.message));
                }
            }
        }

        function viewPDF(base64Data) {
            try {
                const blob = base64ToBlob(base64Data, 'application/pdf');
                const url = URL.createObjectURL(blob);
                window.open(url, '_blank');
            } catch (e) { alert("PDF load nahi ho saka."); }
        }

        function viewImg(base64Data) {
            const win = window.open();
            win.document.write(`<body style="margin:0; background:#0f172a; display:flex; align-items:center; justify-content:center;"><img src="${base64Data}" style="max-width:100%; height:auto; border-radius:10px;"></body>`);
        }

        function base64ToBlob(base64, type) {
            const parts = base64.split(';base64,');
            const raw = window.atob(parts[1]);
            const uInt8Array = new Uint8Array(raw.length);
            for (let i = 0; i < raw.length; ++i) uInt8Array[i] = raw.charCodeAt(i);
            return new Blob([uInt8Array], { type: type });
        }

        auth.onAuthStateChanged((user) => {
            if (user) {
                document.getElementById('user-img').src = user.photoURL || "./SNT.jpg";
                loadImages();
                db.ref('students/' + user.uid).on('value', (snapshot) => {
                    const studentData = snapshot.val();
                    if (studentData) {
                        document.getElementById('welcome-msg').innerText = studentData.name || user.displayName;
                        const courses = studentData.courses || [];
                        document.getElementById('course-msg').innerText = "Courses: " + (Array.isArray(courses) ? courses.join(", ") : courses);
                        loadPDFs(courses);
                    } else { checkByEmail(user); }
                });
            } else { window.location.href = "index.html"; }
        });

        function loadImages() {
            db.ref('myImages').on('value', (snap) => {
                const gallery = document.getElementById('image-gallery');
                gallery.innerHTML = '';
                const data = snap.val() || {};
                Object.keys(data).reverse().forEach(key => {
                    const img = data[key];
                    const div = document.createElement('div');
                    div.className = 'img-item flex-shrink-0';
                    div.innerHTML = `
                        <img src="${img.data}" onclick="viewImg('${img.data}')">
                        <div class="p-2">
                            <div class="flex justify-between items-center mb-1">
                                <p class="text-[9px] font-bold truncate text-sky-400 w-2/3">${img.name || 'Update'}</p>
                                <i class="fas fa-trash-alt delete-btn text-[9px]" onclick="deleteData('myImages', '${key}')"></i>
                            </div>
                            <p class="text-[8px] text-slate-400 line-clamp-1">${img.desc || ''}</p>
                        </div>
                    `;
                    gallery.appendChild(div);
                });
            });
        }

        function checkByEmail(user) {
            db.ref('students').orderByChild('email').equalTo(user.email).once('value', (snap) => {
                if(snap.exists()){
                    const data = Object.values(snap.val())[0];
                    loadPDFs(data.courses || []);
                } else { loadPDFs([]); }
            });
        }

        function loadPDFs(studentCourses) {
            const coursesArray = Array.isArray(studentCourses) ? studentCourses : [studentCourses];
            db.ref('myPDFs').on('value', (snap) => {
                // Update Bulk Count
                document.getElementById('bulkCount').innerText = snap.exists() ? snap.numChildren() : "0";
                
                const grid = document.getElementById('grid');
                const noAccess = document.getElementById('no-access');
                grid.innerHTML = '';
                const data = snap.val() || {};
                let found = 0;

                Object.keys(data).reverse().forEach(key => {
                    const pdf = data[key];
                    const isMatch = coursesArray.some(c => c.trim() === pdf.category?.trim()) || 
                                    pdf.category === "Other" || pdf.category === "All";

                    if (isMatch) {
                        found++;
                        const div = document.createElement('div');
                        div.className = 'pdf-card animate-fade-in';
                        div.innerHTML = `
                            <div class="flex justify-between items-start mb-3">
                                <span class="course-badge">${pdf.category}</span>
                                <div class="flex gap-3">
                                    <i class="fas fa-trash-alt delete-btn text-sm" onclick="deleteData('myPDFs', '${key}')"></i>
                                    <i class="fas fa-file-pdf text-red-500 text-xl"></i>
                                </div>
                            </div>
                            <h3 class="font-black text-sm mb-1 truncate">${pdf.name}</h3>
                            <p class="text-[10px] text-slate-400 line-clamp-2 h-7">${pdf.desc || 'No description'}</p>
                            <button onclick="viewPDF('${pdf.data || pdf.pdf}')" class="btn-view">
                                <i class="fas fa-eye mr-2"></i> VIEW NOTES
                            </button>
                        `;
                        grid.appendChild(div);
                    }
                });
                found === 0 ? noAccess.classList.remove('hidden') : noAccess.classList.add('hidden');
            });
        }
    </script>
</body>
</html>
