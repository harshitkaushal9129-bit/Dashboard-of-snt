<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My PDF Vault</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #6366f1; --bg: #f8fafc; }
        body { font-family: 'Poppins', sans-serif; background: var(--bg); padding: 20px; }
        .container { max-width: 1000px; margin: auto; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        .card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .btn { padding: 10px; border-radius: 6px; text-decoration: none; display: inline-block; font-weight: 600; border: none; cursor: pointer; font-size: 0.9rem; }
        .btn-open { background: var(--primary); color: white; width: 100%; margin-top: 10px; text-align: center;}
    </style>
</head>
<body>
    <div class="container">
        <h1>Online Library 📚</h1>
        <div id="grid" class="grid"></div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAOQtM_XYLqPgxMK1XBdfl0m7KoAseZRCA",
            authDomain: "snt-computer-institute.firebaseapp.com",
            databaseURL: "https://snt-computer-institute-default-rtdb.firebaseio.com",
            projectId: "snt-computer-institute",
            storageBucket: "snt-computer-institute.firebasestorage.app",
            messagingSenderId: "117580784781",
            appId: "1:117580784781:web:73ba19d2d008beb3a5eec4"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        // Ye function 'blocked' error ko fix karta hai
        function viewPDF(base64Data) {
            const base64Parts = base64Data.split(',');
            const contentType = base64Parts[0].split(':')[1].split(';')[0];
            const byteCharacters = atob(base64Parts[1]);
            const byteArrays = [];

            for (let i = 0; i < byteCharacters.length; i++) {
                byteArrays.push(byteCharacters.charCodeAt(i));
            }
            const blob = new Blob([new Uint8Array(byteArrays)], {type: contentType});
            const blobUrl = URL.createObjectURL(blob);
            window.open(blobUrl, '_blank');
        }

        db.ref('myPDFs').on('value', (snap) => {
            const grid = document.getElementById('grid');
            grid.innerHTML = '';
            const data = snap.val() || {};

            Object.keys(data).reverse().forEach(key => {
                const item = data[key];
                const div = document.createElement('div');
                div.className = 'card';
                div.innerHTML = `
                    <h3>${item.name}</h3>
                    <p>${item.desc}</p>
                    <button onclick="viewPDF('${item.pdf}')" class="btn btn-open">View PDF</button>
                `;
                grid.appendChild(div);
            });
        });
    </script>
</body>
</html>
