<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SNT PDF VAULT - Simple Mode</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        body { font-family: 'Inter', sans-serif; background: #0f172a; color: #f1f5f9; }
        
        .glass-item {
            background: rgba(30, 41, 59, 0.5);
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: all 0.3s ease;
        }

        .course-badge {
            background: linear-gradient(90deg, #0ea5e9, #6366f1);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Simple Pulse for Loading */
        .pulse { animation: pulse 2s cubic-bezier(0.4, 0, 0.6, 1) infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: .5; } }
    </style>
</head>
<body class="min-h-screen">

    <nav class="sticky top-0 z-50 bg-slate-900/80 backdrop-blur-md border-b border-slate-800 px-5 py-3">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <h1 class="text-xl font-extrabold tracking-tight">SNT <span class="text-sky-500">VAULT</span></h1>
            <a href="https://harshitkaushal9129-bit.github.io/Dashboard-of-snt/" target="_blank" class="text-[10px] bg-sky-500/10 text-sky-400 px-3 py-1 rounded-full font-bold border border-sky-500/20">PORTAL</a>
        </div>
    </nav>

    <main class="max-w-4xl mx-auto px-5 py-8">
        <div id="main-content">
            <div id="loader" class="text-center py-20">
                <div class="pulse text-sky-500 text-sm font-bold tracking-widest uppercase">Accessing Files...</div>
            </div>
        </div>
    </main>

    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAOQtM_XYLqPgxMK1XBdfl0m7KoAseZRCA",
            authDomain: "snt-computer-institute.firebaseapp.com",
            databaseURL: "https://snt-computer-institute-default-rtdb.firebaseio.com",
            projectId: "snt-computer-institute",
            storageBucket: "snt-computer-institute.firebasestorage.app",
            messagingSenderId: "117580784781",
            appId: "1:117580784781:web:73ba19d2d008beb3a5eec4"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();

        function renderVault() {
            const content = document.getElementById('main-content');
            
            db.ref('myPDFs').on('value', (snap) => {
                const data = snap.val();
                if (!data) {
                    content.innerHTML = `<div class="text-center text-slate-500 mt-10">No PDFs available.</div>`;
                    return;
                }

                // Grouping logic
                const groups = {};
                Object.keys(data).reverse().forEach(id => {
                    const file = data[id];
                    const category = (file.category || file.course || "General").toUpperCase();
                    if (!groups[category]) groups[category] = [];
                    groups[category].push(file);
                });

                let html = '';
                for (const cat in groups) {
                    html += `
                        <div class="mb-10">
                            <h2 class="text-xs font-black tracking-[0.2em] course-badge mb-4 border-l-2 border-sky-500 pl-3">${cat}</h2>
                            <div class="grid gap-3">
                                ${groups[cat].map(pdf => `
                                    <div class="glass-item flex items-center justify-between p-4 rounded-2xl">
                                        <div class="flex items-center gap-4 overflow-hidden">
                                            <div class="w-10 h-10 bg-sky-500/10 rounded-lg flex items-center justify-center shrink-0">
                                                <i class="fas fa-file-pdf text-sky-500"></i>
                                            </div>
                                            <div class="truncate">
                                                <h3 class="text-sm font-semibold text-slate-200 truncate">${pdf.name || 'Untitled'}</h3>
                                                <p class="text-[10px] text-slate-500 italic">${pdf.desc || 'Study Material'}</p>
                                            </div>
                                        </div>
                                        <button onclick="viewPDF('${pdf.data}')" class="ml-4 p-3 bg-white/5 hover:bg-sky-500 hover:text-white rounded-xl transition-all">
                                            <i class="fas fa-eye text-xs"></i>
                                        </button>
                                    </div>
                                `).join('')}
                            </div>
                        </div>
                    `;
                }
                content.innerHTML = html;
            });
        }

        function viewPDF(base64) {
            if(!base64) return alert("Error: File link broken");
            const win = window.open();
            const dataURL = base64.startsWith('data:') ? base64 : `data:application/pdf;base64,${base64}`;
            win.document.write(`<iframe src="${dataURL}" frameborder="0" style="width:100%; height:100vh;"></iframe>`);
        }

        window.onload = renderVault;
    </script>
</body>
</html>
