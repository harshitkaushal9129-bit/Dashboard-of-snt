<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My PDF Vault</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #6366f1; --bg: #f8fafc; }
        body { font-family: 'Poppins', sans-serif; background: var(--bg); padding: 20px; }
        .container { max-width: 1000px; margin: auto; }
        .header { display: flex; justify-content: space-between; align-items: center; background: white; padding: 20px; border-radius: 12px; margin-bottom: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 20px; }
        .card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.05); position: relative; }
        .card h3 { margin: 0; font-size: 1.1rem; color: #1e293b; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
        .card p { font-size: 0.85rem; color: #64748b; margin: 10px 0; }
        .actions { display: flex; gap: 10px; margin-top: 15px; }
        .btn { flex: 1; padding: 8px; border-radius: 6px; text-decoration: none; text-align: center; font-size: 0.9rem; font-weight: 600; cursor: pointer; border: none; }
        .btn-open { background: var(--primary); color: white; }
        .btn-del { background: #fee2e2; color: #ef4444; }
        #loading { text-align: center; padding: 40px; color: #64748b; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>Library 📚</h1>
            <input type="text" id="search" placeholder="Search..." onkeyup="filter()" style="padding:8px; border-radius:6px; border:1px solid #ddd;">
        </div>
        <div id="loading">Files load ho rahi hain...</div>
        <div id="grid" class="grid"></div>
    </div>

    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.10/firebase-database-compat.js"></script>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyAOQtM_XYLqPgxMK1XBdfl0m7KoAseZRCA",
            authDomain: "snt-computer-institute.firebaseapp.com",
            databaseURL: "https://snt-computer-institute-default-rtdb.firebaseio.com",
            projectId: "snt-computer-institute",
            storageBucket: "snt-computer-institute.firebasestorage.app",
            messagingSenderId: "117580784781",
            appId: "1:117580784781:web:73ba19d2d008beb3a5eec4"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        let cacheData = {};

        db.ref('myPDFs').on('value', (snap) => {
            const data = snap.val() || {};
            cacheData = data;
            render(data);
        });

        function render(data) {
            const grid = document.getElementById('grid');
            document.getElementById('loading').style.display = 'none';
            grid.innerHTML = '';
            
            Object.keys(data).reverse().forEach(key => {
                const item = data[key];
                const div = document.createElement('div');
                div.className = 'card';
                div.innerHTML = `
                    <h3>${item.name}</h3>
                    <p>${item.desc}</p>
                    <small style="color:#94a3b8">${item.date}</small>
                    <div class="actions">
                        <a href="${item.pdf}" target="_blank" class="btn btn-open">View</a>
                        <button onclick="deleteFile('${key}')" class="btn btn-del">Delete</button>
                    </div>
                `;
                grid.appendChild(div);
            });
        }

        function deleteFile(key) {
            if(confirm("Kya aap ise delete karna chahte hain?")) {
                db.ref('myPDFs/' + key).remove();
            }
        }

        function filter() {
            const q = document.getElementById('search').value.toLowerCase();
            const filtered = {};
            Object.keys(cacheData).forEach(k => {
                if(cacheData[k].name.toLowerCase().includes(q)) filtered[k] = cacheData[k];
            });
            render(filtered);
        }
    </script>
</body>
</html>
