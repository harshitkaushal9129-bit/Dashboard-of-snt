<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SNT Result History | Official Portal</title>
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>

    <style>
        :root { --snt-blue: #0f172a; --snt-sky: #38bdf8; --bg: #0f172a; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: var(--bg); color: white; user-select: none; }
        
        header { background: rgba(30, 41, 59, 0.8); backdrop-filter: blur(10px); color: white; padding: 15px 20px; display: flex; align-items: center; justify-content: space-between; position: sticky; top: 0; z-index: 100; border-bottom: 1px solid rgba(255,255,255,0.1); }
        .back-btn { color: #38bdf8; text-decoration: none; font-size: 12px; font-weight: 800; text-transform: uppercase; display: flex; align-items: center; gap: 8px; }

        .container { max-width: 700px; margin: 20px auto; padding: 0 15px; }
        
        .profile-strip { background: rgba(30, 41, 59, 0.6); padding: 20px; border-radius: 20px; display: none; align-items: center; gap: 15px; margin-bottom: 25px; border: 1px solid rgba(56, 189, 248, 0.2); }
        #u-img { width: 60px; height: 60px; border-radius: 50%; border: 2px solid var(--snt-sky); object-fit: cover; }
        .student-info h3 { margin: 0; font-size: 1.1rem; }
        .student-info p { margin: 2px 0 0; font-size: 12px; color: #94a3b8; }

        .result-card { background: rgba(30, 41, 59, 0.4); border-radius: 16px; padding: 18px; margin-bottom: 15px; border: 1px solid rgba(255,255,255,0.05); transition: 0.3s; }
        .res-header { display: flex; justify-content: space-between; margin-bottom: 12px; }
        .res-title { font-weight: 800; color: var(--snt-sky); font-size: 0.9rem; text-transform: uppercase; }
        .res-date { font-size: 10px; color: #64748b; }
        .res-score-badge { background: rgba(56, 189, 248, 0.1); color: var(--snt-sky); padding: 4px 12px; border-radius: 8px; font-weight: 900; font-size: 14px; border: 1px solid rgba(56, 189, 248, 0.2); }
        
        .progress-bg { background: rgba(255,255,255,0.05); height: 6px; border-radius: 10px; overflow: hidden; margin-top: 10px; }
        .progress-fill { height: 100%; background: var(--snt-sky); width: 0; transition: width 1.5s ease; }

        .no-data { text-align: center; padding: 100px 20px; color: #64748b; font-weight: 700; }
        .loader { border: 3px solid rgba(255,255,255,0.1); border-top: 3px solid var(--snt-sky); border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; margin: 50px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<header>
    <span style="font-weight:900; tracking-tighter: -1px;">SNT <span style="color:var(--snt-sky)">HISTORY</span></span>
    <a href="index.html" class="back-btn"><i class="fa-solid fa-house"></i> Home</a>
</header>

<div class="container">
    <div class="profile-strip" id="profile-sec">
        <img id="u-img" src="./SNT.jpg">
        <div class="student-info">
            <h3 id="u-name">...</h3>
            <p id="u-id">Authenticating...</p>
        </div>
    </div>

    <div id="results-container">
        <div class="loader" id="main-loader"></div>
    </div>
</div>

<script>
const firebaseConfig = { 
    apiKey: "AIzaSyAOQtM_XYLqPgxMK1XBdfl0m7KoAseZRCA", 
    authDomain: "snt-computer-institute.firebaseapp.com", 
    databaseURL: "https://snt-computer-institute-default-rtdb.firebaseio.com/", 
    projectId: "snt-computer-institute", 
    appId: "1:117580784781:web:73ba19d2d008beb3a5eec4" 
};
firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const auth = firebase.auth();

// Securely monitor login status
auth.onAuthStateChanged((user) => {
    if (user) {
        // User login hai, email se fetch karo
        fetchStudentAndResults(user.email, user.photoURL);
    } else {
        // Login nahi hai toh portal par bhej do
        window.location.href = "index.html";
    }
});

function fetchStudentAndResults(email, photo) {
    // 1. Fetch Student Info based on Google Email
    db.ref('students').on('value', snap => {
        const students = snap.val();
        let currentStudent = null;
        let sId = null;

        for (let key in students) {
            if (students[key].email === email) {
                currentStudent = students[key];
                sId = currentStudent.studentId;
                break;
            }
        }

        if (currentStudent) {
            document.getElementById('u-name').innerText = currentStudent.name;
            document.getElementById('u-id').innerHTML = `ID: ${sId || 'GUEST'}`;
            document.getElementById('u-img').src = currentStudent.profilePic || photo || './SNT.jpg';
            document.getElementById('profile-sec').style.display = 'flex';
            
            // 2. Now Fetch Results using this ID
            if(sId) loadResults(sId);
            else showNoData();
        } else {
            showNoData();
        }
    });
}

function loadResults(sId) {
    db.ref('exam_results').orderByChild('studentId').equalTo(sId).on('value', snap => {
        const container = document.getElementById('results-container');
        container.innerHTML = ""; 
        
        const data = snap.val();
        if (!data) {
            showNoData();
            return;
        }

        Object.values(data).reverse().forEach(res => {
            const percentage = Math.round((res.score / res.totalQuestions) * 100);
            const card = document.createElement('div');
            card.className = "result-card";
            card.innerHTML = `
                <div class="res-header">
                    <div>
                        <span class="res-title">${res.courseName || 'CBT EXAM'}</span>
                        <div class="res-date">${res.date}</div>
                    </div>
                    <div class="res-score-badge">${res.score}/${res.totalQuestions}</div>
                </div>
                <div class="progress-bg"><div class="progress-fill" style="width:${percentage}%"></div></div>
            `;
            container.appendChild(card);
        });
    });
}

function showNoData() {
    document.getElementById('results-container').innerHTML = `<div class="no-data">NO EXAM HISTORY FOUND</div>`;
}
</script>
</body>
</html>
