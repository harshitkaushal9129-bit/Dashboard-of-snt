<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SNT - Smart Register</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        body { background-color: #0f172a; color: white; font-family: 'Segoe UI', sans-serif; user-select: none; -webkit-tap-highlight-color: transparent; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); }
        .row-item { display: grid; grid-template-columns: 1fr 2fr 1.5fr; align-items: center; padding: 15px; border-bottom: 1px solid rgba(255,255,255,0.05); }
        
        .btn-p { color: #4ade80; border: 1.5px solid #22c55e; background: rgba(34, 197, 94, 0.1); }
        .btn-a { color: #f87171; border: 1.5px solid #ef4444; background: rgba(239, 68, 68, 0.1); }
        .btn-l { color: #fbbf24; border: 1.5px solid #f59e0b; background: rgba(245, 158, 11, 0.1); }
        .btn-h { color: #fbbf24; border: 1.5px solid #eab308; background: rgba(234, 179, 8, 0.05); cursor: not-allowed; }
        .btn-lock { color: #64748b; border: 1.5px solid #334155; background: rgba(51, 65, 85, 0.1); opacity: 0.5; cursor: not-allowed; }

        .status-badge { padding: 4px 10px; border-radius: 8px; font-size: 11px; font-weight: 900; text-transform: uppercase; text-align: center; display: inline-block; min-width: 70px; }
        #admin-controls { display: none; }
        
        /* Logo Styling */
        .snt-logo-btn { width: 40px; height: 40px; border-radius: 50%; overflow: hidden; display: flex; items-center; justify-center; cursor: pointer; border: 1px solid rgba(255,255,255,0.1); transition: 0.3s; }
        .snt-logo-btn img { width: 100%; height: 100%; object-fit: cover; }
    </style>
</head>
<body class="pb-10">

    <div class="p-4 max-w-2xl mx-auto flex items-center justify-between sticky top-0 bg-[#0f172a] z-50">
        <button onclick="history.back()" class="text-sky-400 text-xl w-10 h-10 glass rounded-full flex items-center justify-center"><i class="fas fa-arrow-left"></i></button>
        <h1 class="text-lg font-black tracking-tighter italic text-center uppercase">SNT <span class="text-sky-500">Register</span></h1>
        
        <div id="admin-toggle-btn" onclick="handleAdminToggle()" class="snt-logo-btn glass">
            <div id="icon-container" class="flex items-center justify-center w-full h-full">
                <img id="snt-img" src="https://harshitkaushal9129-bit.github.io/Dashboard-of-snt/SNT.png" alt="SNT Logo">
                <i id="close-icon" class="fas fa-times text-amber-500 hidden text-lg"></i>
            </div>
        </div>
    </div>

    <div id="admin-panel" class="px-4 max-w-2xl mx-auto mb-6">
        <div id="admin-controls" class="glass p-5 rounded-[2rem] border-l-4 border-amber-500 shadow-xl">
            <h3 class="text-[10px] font-black uppercase text-amber-500 mb-3 tracking-widest"><i class="fas fa-calendar-plus mr-1"></i> Admin: Holiday Details</h3>
            <div class="flex flex-col gap-3">
                <input type="date" id="holiday-picker" class="bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm outline-none focus:border-amber-500 text-white">
                <input type="text" id="holiday-reason" placeholder="Kyun chhutti hai? (Barna confirm nahi hoga)" class="bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm outline-none focus:border-amber-500 text-white">
                <button onclick="setAdminHoliday()" class="bg-amber-500 text-slate-950 py-3 rounded-xl font-black text-[10px] uppercase transition-all active:scale-95 shadow-lg shadow-amber-500/20">Declare Holiday</button>
            </div>
        </div>
    </div>

    <div class="px-4 max-w-2xl mx-auto mb-6">
        <div class="glass p-6 rounded-[2.5rem] border-t-4 border-sky-500 shadow-2xl relative">
            <p id="today-date-display" class="text-sky-400 font-black text-xs uppercase tracking-widest mb-1"></p>
            <div id="action-area">
                <h2 class="text-xl font-bold mb-4 italic">Aaj ki Attendance:</h2>
                <div id="action-buttons" class="flex gap-2">
                    <button onclick="markAttendance('Present')" class="flex-1 py-4 rounded-xl text-[10px] font-black btn-p active:scale-95 transition-all">P (PRESENT)</button>
                    <button onclick="markAttendance('Absent')" class="flex-1 py-4 rounded-xl text-[10px] font-black btn-a active:scale-95 transition-all">A (ABSENT)</button>
                    <button onclick="markAttendance('Leave')" class="flex-1 py-4 rounded-xl text-[10px] font-black btn-l active:scale-95 transition-all">L (LEAVE)</button>
                </div>
            </div>
            <p id="status-msg" class="mt-3 text-[10px] font-bold text-center text-slate-500 uppercase"></p>
        </div>
    </div>

    <div class="px-4 max-w-2xl mx-auto">
        <div class="glass rounded-[2rem] overflow-hidden border border-slate-800">
            <div class="row-item bg-slate-800/50 text-[10px] font-black uppercase tracking-[0.2em] text-slate-400">
                <div>Date</div>
                <div class="text-center">Reason / Day</div>
                <div class="text-right">Record</div>
            </div>
            <div id="register-list"></div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAOQtM_XYLqPgxMK1XBdfl0m7KoAseZRCA",
            authDomain: "snt-computer-institute.firebaseapp.com",
            projectId: "snt-computer-institute",
            databaseURL: "https://snt-computer-institute-default-rtdb.firebaseio.com",
            appId: "1:117580784781:web:73ba19d2d008beb3a5eec4"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        let currentUser = null;
        let adminHolidays = {};
        const now = new Date();
        const todayStr = now.toISOString().split('T')[0];

        document.getElementById('today-date-display').innerText = now.toDateString();

        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                loadData();
            } else {
                window.location.href = "index.html";
            }
        });

        // Toggle Function with Logo swap
        window.handleAdminToggle = () => {
            const controls = document.getElementById('admin-controls');
            const sntImg = document.getElementById('snt-img');
            const closeIcon = document.getElementById('close-icon');

            if (controls.style.display === 'block') {
                controls.style.display = 'none';
                sntImg.classList.remove('hidden');
                closeIcon.classList.add('hidden');
            } else {
                const pass = prompt("Enter Admin PIN:");
                if (pass === "912919") {
                    controls.style.display = 'block';
                    sntImg.classList.add('hidden');
                    closeIcon.classList.remove('hidden');
                } else if (pass !== null) {
                    alert("Galat Password!");
                }
            }
        };

        function loadData() {
            onValue(ref(db, 'admin_holidays'), (holSnapshot) => {
                adminHolidays = holSnapshot.val() || {};
                onValue(ref(db, 'attendance'), (attSnapshot) => {
                    const data = attSnapshot.val() || {};
                    renderUI(data);
                });
            });
        }

        window.setAdminHoliday = () => {
            const date = document.getElementById('holiday-picker').value;
            const reason = document.getElementById('holiday-reason').value;

            if(!date) return alert("Pehle date select karein!");
            if(!reason || reason.trim() === "") return alert("Chhutti ka reason zaroori hai!");

            set(ref(db, 'admin_holidays/' + date), {
                status: "Holiday",
                reason: reason,
                timestamp: Date.now()
            }).then(() => {
                alert("Holiday set ho gaya!");
                document.getElementById('holiday-reason').value = "";
                // Reset UI to default
                document.getElementById('admin-controls').style.display = 'none';
                document.getElementById('snt-img').classList.remove('hidden');
                document.getElementById('close-icon').classList.add('hidden');
            });
        };

        function renderUI(data) {
            const list = document.getElementById('register-list');
            const actionArea = document.getElementById('action-area');
            const isSun = now.getDay() === 0;
            const holToday = adminHolidays[todayStr];
            const attID = currentUser.uid + "_" + todayStr;

            if(isSun || holToday) {
                const r = holToday ? holToday.reason : "SUNDAY (WEEKLY OFF)";
                actionArea.innerHTML = `<h2 class="text-xl font-bold mb-4 italic">Aaj Chhutti Hai:</h2><div class="w-full py-4 glass text-amber-500 font-black text-center rounded-2xl border border-amber-500/20 italic uppercase tracking-tighter">${r}</div>`;
            } else if(data[attID]) {
                const s = data[attID].status;
                actionArea.innerHTML = `<h2 class="text-xl font-bold mb-4 italic">Aaj ki Attendance:</h2><div class="w-full py-4 glass text-sky-400 font-black text-center rounded-2xl border border-sky-500/30 uppercase text-[10px] tracking-widest"><i class="fas fa-check-circle mr-1"></i> RECORD SAVED (${s})</div>`;
            }

            let html = '';
            for (let d = now.getDate(); d >= 1; d--) {
                const dayDateStr = `${now.getFullYear()}-${String(now.getMonth() + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                const dateObj = new Date(dayDateStr);
                const sun = dateObj.getDay() === 0;
                const hol = adminHolidays[dayDateStr];
                const record = Object.values(data).find(r => r.email === currentUser.email && r.date === dayDateStr);

                let badge = '<span class="status-badge btn-lock">No Data</span>';
                let reasonText = dateObj.toLocaleDateString('en-US', {weekday:'long'});

                if(record) {
                    if(record.status === 'Present') badge = '<span class="status-badge btn-p">Present</span>';
                    else if(record.status === 'Absent') badge = '<span class="status-badge btn-a">Absent</span>';
                    else if(record.status === 'Leave') badge = '<span class="status-badge btn-l">Leave</span>';
                } else if(sun) {
                    badge = '<span class="status-badge btn-h">Sunday</span>';
                    reasonText = "Weekly Off";
                } else if(hol) {
                    badge = '<span class="status-badge btn-h">Holiday</span>';
                    reasonText = hol.reason;
                }

                html += `
                    <div class="row-item">
                        <div class="font-bold text-xs text-slate-300">${d} ${dateObj.toLocaleString('default', { month: 'short' })}</div>
                        <div class="text-center text-[9px] font-bold text-slate-500 uppercase tracking-tighter italic overflow-hidden whitespace-nowrap px-1">${reasonText}</div>
                        <div class="text-right">${badge}</div>
                    </div>`;
            }
            list.innerHTML = html;
        }

        window.markAttendance = (status) => {
            const attID = currentUser.uid + "_" + todayStr;
            set(ref(db, 'attendance/' + attID), {
                email: currentUser.email,
                name: currentUser.displayName || "Student",
                date: todayStr,
                status: status,
                timestamp: Date.now()
            });
        };
    </script>
</body>
</html>
