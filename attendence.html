<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Attendance Register - SNT</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        body { background-color: #0f172a; color: white; font-family: 'Segoe UI', Tahoma, sans-serif; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); }
        
        /* Register Row Style */
        .register-row { 
            display: grid; 
            grid-template-cols: 1fr 2fr 1fr; 
            align-items: center; 
            padding: 12px 16px; 
            border-bottom: 1px solid rgba(255,255,255,0.05);
            transition: 0.3s;
        }
        .register-row:active { background: rgba(56, 189, 248, 0.05); }

        /* Status Badge Style */
        .status-p { color: #4ade80; font-weight: 900; background: rgba(74, 222, 128, 0.1); padding: 4px 12px; rounded: 8px; border: 1px solid rgba(74, 222, 128, 0.2); }
        .status-a { color: #f87171; font-weight: 900; background: rgba(248, 113, 113, 0.1); padding: 4px 12px; rounded: 8px; border: 1px solid rgba(248, 113, 113, 0.2); }
        .status-h { color: #fbbf24; font-weight: 900; background: rgba(251, 191, 36, 0.1); padding: 4px 12px; rounded: 8px; border: 1px solid rgba(251, 191, 36, 0.2); }

        .sticky-header { position: sticky; top: 0; z-index: 50; background: #0f172a; }
    </style>
</head>
<body class="pb-10">

    <div class="sticky-header p-4 border-b border-slate-800 shadow-xl">
        <div class="max-w-2xl mx-auto flex items-center justify-between">
            <button onclick="history.back()" class="text-sky-400 text-lg"><i class="fas fa-chevron-left"></i></button>
            <h1 class="text-lg font-black tracking-tighter italic">STUDENT <span class="text-sky-500">REGISTER</span></h1>
            <div id="user-initial" class="w-8 h-8 rounded-full bg-sky-500 flex items-center justify-center font-bold text-xs">S</div>
        </div>
    </div>

    <div class="p-4 max-w-2xl mx-auto">
        <div class="glass rounded-3xl p-5 flex justify-between items-center shadow-2xl border-l-4 border-sky-500">
            <div>
                <p class="text-[10px] uppercase font-black text-slate-500 tracking-widest">Attendance Score</p>
                <h2 id="total-percent" class="text-2xl font-black text-white">0%</h2>
            </div>
            <div class="flex gap-4">
                <div class="text-center">
                    <p class="text-[9px] font-bold text-green-400">P</p>
                    <p id="p-count" class="font-black">0</p>
                </div>
                <div class="text-center">
                    <p class="text-[9px] font-bold text-red-400">A</p>
                    <p id="a-count" class="font-black">0</p>
                </div>
            </div>
        </div>
    </div>

    <div class="max-w-2xl mx-auto px-4 mt-2">
        <div class="glass rounded-3xl overflow-hidden border border-slate-800">
            <div class="register-row bg-slate-800/50 text-[10px] font-black uppercase tracking-widest text-slate-400">
                <div>Date</div>
                <div class="text-center">Day</div>
                <div class="text-right">Status</div>
            </div>

            <div id="register-list">
                <div class="p-10 text-center text-slate-500 text-xs font-bold uppercase tracking-widest">
                    <i class="fas fa-spinner fa-spin mb-2 text-sky-500 text-xl"></i><br>Syncing Register...
                </div>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAOQtM_XYLqPgxMK1XBdfl0m7KoAseZRCA",
            authDomain: "snt-computer-institute.firebaseapp.com",
            projectId: "snt-computer-institute",
            databaseURL: "https://snt-computer-institute-default-rtdb.firebaseio.com",
            appId: "1:117580784781:web:73ba19d2d008beb3a5eec4"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        // Tyohaar List
        const holidays = {
            "2026-01-26": "Republic Day",
            "2026-03-24": "Holi Festival",
            "2026-08-15": "Independence Day",
            "2026-10-02": "Gandhi Jayanti",
            "2026-10-21": "Diwali",
            "2026-12-25": "Christmas"
        };

        onAuthStateChanged(auth, (user) => {
            if (user) {
                document.getElementById('user-initial').innerText = user.displayName ? user.displayName[0] : 'S';
                const attendRef = ref(db, 'attendance');
                onValue(attendRef, (snap) => {
                    generateRegister(snap.val() || {}, user.email);
                });
            } else {
                window.location.href = "index.html";
            }
        });

        function generateRegister(data, email) {
            const list = document.getElementById('register-list');
            const now = new Date();
            const year = now.getFullYear();
            const month = now.getMonth();
            const daysInMonth = new Date(year, month + 1, 0).getDate();

            let html = '';
            let pCount = 0, aCount = 0;

            // Loop through all days of current month (Reverse to see latest first)
            for (let d = daysInMonth; d >= 1; d--) {
                const dateObj = new Date(year, month, d);
                const dateStr = `${year}-${String(month + 1).padStart(2, '0')}-${String(d).padStart(2, '0')}`;
                const dayName = dateObj.toLocaleDateString('en-US', { weekday: 'long' });
                const isSunday = dateObj.getDay() === 0;
                const holidayName = holidays[dateStr];

                // Check Firebase Data
                const record = Object.values(data).find(r => r.email === email && r.date === dateStr);

                let statusHtml = '';
                if (record) {
                    if (record.status === 'Present') {
                        statusHtml = '<span class="status-p">P</span>';
                        pCount++;
                    } else {
                        statusHtml = '<span class="status-a">A</span>';
                        aCount++;
                    }
                } else if (isSunday) {
                    statusHtml = '<span class="status-h">SUN</span>';
                } else if (holidayName) {
                    statusHtml = `<span class="status-h">HOL</span>`;
                } else {
                    statusHtml = '<span class="text-slate-700 text-[10px]">—</span>';
                }

                html += `
                    <div class="register-row">
                        <div class="text-[12px] font-bold text-slate-300">${d} ${now.toLocaleString('default', { month: 'short' })}</div>
                        <div class="text-center text-[10px] font-bold text-slate-500 uppercase tracking-tighter">
                            ${holidayName ? `<span class="text-yellow-500/80">${holidayName}</span>` : dayName}
                        </div>
                        <div class="text-right">${statusHtml}</div>
                    </div>
                `;
            }

            list.innerHTML = html;
            
            // Update Stats
            document.getElementById('p-count').innerText = pCount;
            document.getElementById('a-count').innerText = aCount;
            const total = pCount + aCount;
            const percent = total > 0 ? Math.round((pCount / total) * 100) : 0;
            document.getElementById('total-percent').innerText = percent + "%";
        }
    </script>
</body>
</html>
