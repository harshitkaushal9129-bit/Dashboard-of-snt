<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>SNT - Smart Register</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    
    <style>
        body { background-color: #0f172a; color: white; font-family: 'Segoe UI', sans-serif; user-select: none; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.1); }
        
        .row-item { display: grid; grid-template-columns: 1fr 2fr 1.5fr; align-items: center; padding: 15px; border-bottom: 1px solid rgba(255,255,255,0.05); }
        
        /* Status Colors */
        .btn-p { color: #4ade80; border: 1.5px solid #22c55e; background: rgba(34, 197, 94, 0.1); }
        .btn-a { color: #f87171; border: 1.5px solid #ef4444; background: rgba(239, 68, 68, 0.1); }
        .btn-h { color: #fbbf24; border: 1.5px solid #eab308; background: rgba(234, 179, 8, 0.05); cursor: not-allowed; }
        .btn-lock { color: #64748b; border: 1.5px solid #334155; background: rgba(51, 65, 85, 0.1); opacity: 0.5; cursor: not-allowed; }

        .status-badge { padding: 4px 10px; border-radius: 8px; font-size: 11px; font-weight: 900; text-transform: uppercase; }
        .active-btn { transform: scale(0.95); box-shadow: 0 0 15px rgba(56, 189, 248, 0.3); }
    </style>
</head>
<body class="pb-10">

    <div class="p-4 max-w-2xl mx-auto flex items-center justify-between sticky top-0 bg-[#0f172a] z-50">
        <button onclick="history.back()" class="text-sky-400 text-xl w-10 h-10 glass rounded-full"><i class="fas fa-arrow-left"></i></button>
        <h1 class="text-lg font-black tracking-tighter italic text-center">ATTENDANCE <span class="text-sky-500">PORTAL</span></h1>
        <div class="w-10"></div>
    </div>

    <div class="px-4 max-w-2xl mx-auto mb-6">
        <div class="glass p-6 rounded-[2rem] border-t-4 border-sky-500 shadow-2xl">
            <p id="today-date" class="text-sky-400 font-black text-xs uppercase tracking-widest mb-1"></p>
            <h2 class="text-xl font-bold mb-4">Aaj ki Attendance Lagayein:</h2>
            <div id="action-buttons" class="flex gap-4">
                <button onclick="markAttendance('Present')" class="flex-1 py-4 rounded-2xl font-black btn-p active:scale-95 transition-all">P (PRESENT)</button>
                <button onclick="markAttendance('Absent')" class="flex-1 py-4 rounded-2xl font-black btn-a active:scale-95 transition-all">A (ABSENT)</button>
            </div>
            <p id="status-msg" class="mt-3 text-[10px] font-bold text-center text-slate-500"></p>
        </div>
    </div>

    <div class="px-4 max-w-2xl mx-auto">
        <div class="glass rounded-[2rem] overflow-hidden border border-slate-800">
            <div class="row-item bg-slate-800/50 text-[10px] font-black uppercase tracking-[0.2em] text-slate-400">
                <div>Date</div>
                <div class="text-center">Details</div>
                <div class="text-right">Record</div>
            </div>
            <div id="register-list">
                </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
        import { getDatabase, ref, set, onValue, push } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAOQtM_XYLqPgxMK1XBdfl0m7KoAseZRCA",
            authDomain: "snt-computer-institute.firebaseapp.com",
            projectId: "snt-computer-institute",
            databaseURL: "https://snt-computer-institute-default-rtdb.firebaseio.com",
            appId: "1:117580784781:web:73ba19d2d008beb3a5eec4"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getDatabase(app);

        let currentUser = null;
        const holidays = { "2026-01-26": "Republic Day", "2026-03-24": "Holi", "2026-08-15": "Independence Day" };

        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                loadRegister();
            } else {
                window.location.href = "index.html";
            }
        });

        const todayDate = new Date().toISOString().split('T')[0];
        document.getElementById('today-date').innerText = new Date().toDateString();

        function loadRegister() {
            const attendRef = ref(db, 'attendance');
            onValue(attendRef, (snapshot) => {
                const data = snapshot.val() || {};
                renderList(data);
                checkTodayStatus(data);
            });
        }

        function checkTodayStatus(data) {
            const hasMarked = Object.values(data).some(r => r.email === currentUser.email && r.date === todayDate);
            if(hasMarked) {
                document.getElementById('action-buttons').innerHTML = `
                    <div class="w-full py-4 glass text-green-400 font-black text-center rounded-2xl border border-green-500/30">
                        <i class="fas fa-check-circle mr-2"></i> AAJ KI ATTENDANCE LAG GAYI HAI
                    </div>`;
            }
        }

        window.markAttendance = (status) => {
            const dateObj = new Date();
            if(dateObj.getDay() === 0) return alert("Sunday ko attendance nahi lagti!");
            
            const attendanceID = currentUser.uid + "_" + todayDate;
            set(ref(db, 'attendance/' + attendanceID), {
                email: currentUser.email,
                name: currentUser.displayName,
                date: todayDate,
                status: status,
                timestamp: Date.now()
            }).then(() => {
                document.getElementById('status-msg').innerText = "Attendance Successfully Saved!";
            });
        };

        function renderList(data) {
            const list = document.getElementById('register-list');
            const now = new Date();
            let html = '';

            for (let d = 31; d >= 1; d--) {
                const dayDate = `2026-02-${String(d).padStart(2, '0')}`;
                const dateObj = new Date(dayDate);
                if (dateObj > now) continue; // Future dates hide karo

                const isSun = dateObj.getDay() === 0;
                const holName = holidays[dayDate];
                const record = Object.values(data).find(r => r.email === currentUser.email && r.date === dayDate);

                let badge = '<span class="status-badge btn-lock">No Data</span>';
                if(record) {
                    badge = record.status === 'Present' ? '<span class="status-badge btn-p">Present</span>' : '<span class="status-badge btn-a">Absent</span>';
                } else if(isSun) {
                    badge = '<span class="status-badge btn-h">Sunday</span>';
                } else if(holName) {
                    badge = `<span class="status-badge btn-h">Holiday</span>`;
                }

                html += `
                    <div class="row-item">
                        <div class="font-bold text-sm text-slate-300">${d} Feb</div>
                        <div class="text-center text-[10px] font-bold text-slate-500">${holName || dateObj.toLocaleDateString('en-US', {weekday:'long'})}</div>
                        <div class="text-right">${badge}</div>
                    </div>`;
            }
            list.innerHTML = html;
        }
    </script>
</body>
</html>
