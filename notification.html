<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SNT Admin - Notification Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        body { background: #0b0f1a; color: white; font-family: 'Inter', sans-serif; }
        .glass-card { background: rgba(30, 41, 59, 0.5); backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,0.05); border-radius: 24px; }
        .input-style { background: #1e293b; border: 1px solid #334155; border-radius: 12px; padding: 12px; font-size: 14px; outline: none; transition: 0.3s; }
        .input-style:focus { border-color: #0ea5e9; box-shadow: 0 0 10px rgba(14, 165, 233, 0.2); }
    </style>
</head>
<body class="p-6">
    <div class="max-w-md mx-auto glass-card p-8 shadow-2xl">
        <div class="flex items-center gap-3 mb-8">
            <div class="bg-sky-500/20 p-3 rounded-2xl">
                <i class="fas fa-paper-plane text-sky-400 text-xl"></i>
            </div>
            <h2 class="text-xl font-black tracking-tight text-white">NEW NOTICE</h2>
        </div>
        
        <div class="space-y-5">
            <div>
                <label class="block text-[10px] uppercase font-bold mb-2 text-slate-400 tracking-widest">Notice Content</label>
                <textarea id="notifText" class="w-full input-style resize-none" rows="3" placeholder="Write your announcement..."></textarea>
            </div>
            
            <div>
                <label class="block text-[10px] uppercase font-bold mb-2 text-slate-400 tracking-widest">Add Attachment</label>
                <label class="flex flex-col items-center justify-center w-full h-32 border-2 border-slate-700 border-dashed rounded-2xl cursor-pointer bg-slate-800/30 hover:bg-slate-800/60 transition-all overflow-hidden group">
                    <div id="preview-zone" class="flex flex-col items-center justify-center">
                        <i class="fas fa-cloud-upload-alt text-2xl text-slate-500 group-hover:text-sky-400 mb-2"></i>
                        <p id="fileName" class="text-[11px] text-slate-500">Tap to select photo</p>
                    </div>
                    <input type="file" id="notifImage" class="hidden" accept="image/*">
                </label>
            </div>

            <div>
                <label class="block text-[10px] uppercase font-bold mb-2 text-slate-400 tracking-widest">Expiry Timer</label>
                <input type="datetime-local" id="notifExpiry" class="w-full input-style text-slate-300">
            </div>

            <button onclick="uploadNotice()" id="pushBtn" class="w-full bg-sky-500 hover:bg-sky-400 p-4 rounded-xl font-black text-sm transition-all active:scale-95 flex justify-center items-center gap-2">
                <i class="fas fa-bolt"></i> PUSH NOTIFICATION
            </button>
        </div>

        <div id="active-list" class="mt-10 space-y-3">
            <h3 class="text-[10px] font-bold uppercase tracking-[0.2em] text-slate-500 border-b border-slate-800 pb-3">Recently Posted</h3>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, push, onValue, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";
        import { getStorage, ref as sRef, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-storage.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAOQtM_XYLqPgxMK1XBdfl0m7KoAseZRCA",
            authDomain: "snt-computer-institute.firebaseapp.com",
            projectId: "snt-computer-institute",
            databaseURL: "https://snt-computer-institute-default-rtdb.firebaseio.com",
            storageBucket: "snt-computer-institute.appspot.com",
            appId: "1:117580784781:web:73ba19d2d008beb3a5eec4"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const storage = getStorage(app);

        // Preview Image logic
        document.getElementById('notifImage').onchange = e => {
            const file = e.target.files[0];
            if(file) document.getElementById('fileName').innerText = file.name;
        };

        window.uploadNotice = async () => {
            const text = document.getElementById('notifText').value;
            const expiry = document.getElementById('notifExpiry').value;
            const file = document.getElementById('notifImage').files[0];
            const btn = document.getElementById('pushBtn');

            if(!text || !expiry) return alert("Please fill fields!");
            
            btn.innerHTML = `<i class="fas fa-spinner animate-spin"></i> UPLOADING...`;
            btn.disabled = true;

            let imageUrl = "";
            if(file) {
                const storageRef = sRef(storage, 'notices/' + Date.now() + "_" + file.name);
                await uploadBytes(storageRef, file);
                imageUrl = await getDownloadURL(storageRef);
            }

            const newNotifRef = push(ref(db, 'notifications'));
            set(newNotifRef, {
                message: text,
                expiry: expiry,
                imageUrl: imageUrl,
                timestamp: new Date().toISOString()
            }).then(() => {
                alert("Notice Published!");
                location.reload();
            });
        };

        onValue(ref(db, 'notifications'), (snapshot) => {
            const list = document.getElementById('active-list');
            list.innerHTML = '<h3 class="text-[10px] font-bold uppercase tracking-[0.2em] text-slate-500 border-b border-slate-800 pb-3 text-center">Managed Updates</h3>';
            if(snapshot.exists()){
                Object.entries(snapshot.val()).reverse().forEach(([key, data]) => {
                    const div = document.createElement('div');
                    div.className = "flex justify-between items-center bg-slate-900/50 p-3 rounded-xl border border-slate-800";
                    div.innerHTML = `
                        <div class="flex items-center gap-3">
                            ${data.imageUrl ? `<img src="${data.imageUrl}" class="w-8 h-8 rounded-lg object-cover">` : `<i class="fas fa-file-alt text-slate-600"></i>`}
                            <span class="text-xs text-slate-300 truncate w-32">${data.message}</span>
                        </div>
                        <button onclick="deleteNotice('${key}')" class="text-red-400 text-[10px] font-bold hover:bg-red-500/10 px-2 py-1 rounded">REMOVE</button>
                    `;
                    list.appendChild(div);
                });
            }
        });

        window.deleteNotice = (key) => { if(confirm("Delete this notice?")) remove(ref(db, `notifications/${key}`)); };
    </script>
</body>
</html>
