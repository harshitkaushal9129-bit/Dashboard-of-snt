<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SNT Admin - Notification Manager</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background: #0f172a; color: white; font-family: sans-serif; }
        .glass-card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255,255,255,0.1); border-radius: 20px; }
    </style>
</head>
<body class="p-6">
    <div class="max-w-md mx-auto glass-card p-8">
        <h2 class="text-2xl font-black mb-6 text-sky-400">POST NEW NOTICE</h2>
        
        <div class="space-y-4">
            <div>
                <label class="block text-[10px] uppercase font-bold mb-1 opacity-60">Notice Message</label>
                <textarea id="notifText" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-sm outline-none focus:border-sky-500" placeholder="Type message here..."></textarea>
            </div>
            
            <div>
                <label class="block text-[10px] uppercase font-bold mb-1 opacity-60">Expiry Date & Time</label>
                <input type="datetime-local" id="notifExpiry" class="w-full bg-slate-800 border border-slate-700 rounded-xl p-3 text-sm outline-none focus:border-sky-500">
            </div>

            <button onclick="uploadNotice()" class="w-full bg-sky-500 p-4 rounded-xl font-black hover:bg-sky-600 transition-all active:scale-95">PUSH NOTIFICATION</button>
        </div>

        <div id="active-list" class="mt-8 space-y-3">
            <h3 class="text-xs font-bold uppercase tracking-widest text-slate-500 border-b border-slate-700 pb-2">Active Notices</h3>
            </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, set, push, onValue, remove } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        // Same Firebase Config
        const firebaseConfig = {
            apiKey: "AIzaSyAOQtM_XYLqPgxMK1XBdfl0m7KoAseZRCA",
            authDomain: "snt-computer-institute.firebaseapp.com",
            projectId: "snt-computer-institute",
            databaseURL: "https://snt-computer-institute-default-rtdb.firebaseio.com",
            appId: "1:117580784781:web:73ba19d2d008beb3a5eec4"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        window.uploadNotice = () => {
            const text = document.getElementById('notifText').value;
            const expiry = document.getElementById('notifExpiry').value;

            if(!text || !expiry) return alert("Please fill all fields");

            const notifRef = ref(db, 'notifications');
            const newNotifRef = push(notifRef);
            set(newNotifRef, {
                message: text,
                expiry: expiry,
                timestamp: new Date().toISOString()
            }).then(() => {
                alert("Notice Sent!");
                document.getElementById('notifText').value = "";
            });
        };

        // Display Active Notices with Delete Option
        onValue(ref(db, 'notifications'), (snapshot) => {
            const list = document.getElementById('active-list');
            list.innerHTML = '<h3 class="text-xs font-bold uppercase tracking-widest text-slate-500 border-b border-slate-700 pb-2">Active Notices</h3>';
            if(snapshot.exists()){
                Object.entries(snapshot.val()).forEach(([key, data]) => {
                    const div = document.createElement('div');
                    div.className = "flex justify-between items-center bg-slate-800/50 p-3 rounded-lg text-xs";
                    div.innerHTML = `
                        <span>${data.message.substring(0, 30)}...</span>
                        <button onclick="deleteNotice('${key}')" class="text-red-500 font-bold">DELETE</button>
                    `;
                    list.appendChild(div);
                });
            }
        });

        window.deleteNotice = (key) => remove(ref(db, `notifications/${key}`));
    </script>
</body>
</html>
