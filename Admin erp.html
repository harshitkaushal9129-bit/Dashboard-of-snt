<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <title>Kaushal Admin - Inventory</title>
    <style>
        :root { --primary: #2c3e50; --accent: #ff008a; }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: #f4f7f6; display: flex; }
        .sidebar { width: 250px; background: var(--primary); color: white; height: 100vh; position: fixed; padding: 20px; }
        .main { margin-left: 290px; padding: 20px; width: 100%; }
        .card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); margin-bottom: 20px; }
        input { padding: 12px; border: 1px solid #ddd; border-radius: 8px; margin-bottom: 10px; width: 100%; box-sizing: border-box; }
        .btn { background: var(--accent); color: white; border: none; padding: 12px; border-radius: 8px; cursor: pointer; font-weight: bold; width: 100%; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th, td { padding: 12px; border-bottom: 1px solid #eee; text-align: left; }
    </style>
</head>
<body>

<div class="sidebar">
    <h2>Shop Admin</h2>
    <hr>
    <p>📦 Product Upload</p>
    <p>🚚 View Orders</p>
</div>

<div class="main">
    <div class="card">
        <h3>Naya Product Upload Karein</h3>
        <input type="text" id="pName" placeholder="Product Name">
        <input type="number" id="pPrice" placeholder="Price (₹)">
        <input type="file" id="pFile" accept="image/*">
        <button class="btn" id="upBtn" onclick="upload()">Publish to App</button>
    </div>

    <div class="card">
        <h3>Live Stock</h3>
        <table id="stockTable">
            <thead><tr><th>Photo</th><th>Name</th><th>Price</th><th>Action</th></tr></thead>
            <tbody id="list"></tbody>
        </table>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, push, onValue, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
    import { getStorage, ref as sRef, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";

    const firebaseConfig = { 
        databaseURL: "https://pdf-for-students-default-rtdb.firebaseio.com",
        storageBucket: "pdf-for-students.appspot.com" 
    };
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const storage = getStorage(app);

    window.upload = async () => {
        const file = document.getElementById('pFile').files[0];
        const name = document.getElementById('pName').value;
        const price = document.getElementById('pPrice').value;

        if(!file || !name) return alert("Details bhariye!");

        const imgRef = sRef(storage, 'products/' + Date.now());
        await uploadBytes(imgRef, file);
        const url = await getDownloadURL(imgRef);

        const newP = push(ref(db, 'products'));
        await set(newP, { name, price, img: url });
        alert("Live ho gaya!"); location.reload();
    };

    onValue(ref(db, 'products'), (snap) => {
        let html = "";
        snap.forEach(c => {
            const p = c.val();
            html += `<tr>
                <td><img src="${p.img}" width="50"></td>
                <td>${p.name}</td>
                <td>₹${p.price}</td>
                <td><button onclick="removeIt('${c.key}')">❌</button></td>
            </tr>`;
        });
        document.getElementById('list').innerHTML = html;
    });

    window.removeIt = (id) => remove(ref(db, 'products/' + id));
</script>
</body>
</html>
