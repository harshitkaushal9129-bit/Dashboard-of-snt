<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KV Vastralaya | Admin ERP</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        :root { --sidebar-bg: #1e293b; --accent: #ff008a; --text-light: #94a3b8; --success: #22c55e; }
        body { font-family: 'Inter', sans-serif; margin: 0; background: #f1f5f9; display: flex; color: #1e293b; }
        
        /* Sidebar Design */
        .sidebar { width: 260px; background: var(--sidebar-bg); color: white; height: 100vh; position: fixed; display: flex; flex-direction: column; }
        .sidebar-header { padding: 30px 20px; font-size: 20px; font-weight: bold; border-bottom: 1px solid #334155; }
        .nav-link { padding: 15px 20px; cursor: pointer; color: var(--text-light); transition: 0.3s; display: flex; align-items: center; gap: 10px; }
        .nav-link:hover, .nav-link.active { background: #334155; color: white; border-left: 4px solid var(--accent); }

        /* Main Content */
        .content { margin-left: 260px; padding: 30px; width: 100%; }
        .header-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 30px; }
        
        /* Stats Cards */
        .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; margin-bottom: 30px; }
        .stat-card { background: white; padding: 20px; border-radius: 12px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); }
        .stat-val { font-size: 24px; font-weight: bold; margin: 5px 0; }
        .stat-label { color: #64748b; font-size: 14px; }

        /* Table Design */
        .data-card { background: white; border-radius: 12px; padding: 20px; box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1); }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; }
        th { text-align: left; padding: 12px; background: #f8fafc; color: #64748b; font-size: 13px; }
        td { padding: 12px; border-bottom: 1px solid #f1f5f9; font-size: 14px; }
        
        /* Form Design */
        .upload-form { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; }
        input, select { padding: 12px; border: 1px solid #e2e8f0; border-radius: 8px; outline: none; }
        .btn-main { background: var(--accent); color: white; border: none; padding: 12px 25px; border-radius: 8px; cursor: pointer; font-weight: bold; }
        
        .badge { padding: 4px 8px; border-radius: 4px; font-size: 11px; font-weight: bold; }
        .badge-stock { background: #dcfce7; color: #166534; }
    </style>
</head>
<body>

<div class="sidebar">
    <div class="sidebar-header">KV VASTRALAYA</div>
    <div class="nav-link active" onclick="showTab('dash')">📊 Dashboard</div>
    <div class="nav-link" onclick="showTab('inventory')">📦 Stock & Upload</div>
    <div class="nav-link" onclick="showTab('orders')">🚚 Orders List</div>
</div>

<div class="content">
    <div id="dashTab" class="tab-sec">
        <div class="header-top"><h2>Business Overview</h2></div>
        <div class="stats-grid">
            <div class="stat-card"><div class="stat-label">Total Sales</div><div class="stat-val">₹45,200</div></div>
            <div class="stat-card"><div class="stat-label">Active Products</div><div class="stat-val" id="count-p">0</div></div>
            <div class="stat-card"><div class="stat-label">New Orders</div><div class="stat-val">12</div></div>
            <div class="stat-card"><div class="stat-label">Low Stock</div><div class="stat-val" style="color:red">3</div></div>
        </div>
        <div class="data-card">
            <h3>Sales Performance</h3>
            <canvas id="salesChart" height="100"></canvas>
        </div>
    </div>

    <div id="inventoryTab" class="tab-sec" style="display:none">
        <div class="header-top"><h2>Inventory Management</h2></div>
        <div class="data-card" style="margin-bottom: 20px;">
            <h3>Add New Product</h3>
            <div class="upload-form">
                <input type="text" id="pName" placeholder="Product Name">
                <input type="number" id="pPrice" placeholder="Price (₹)">
                <select id="pCat">
                    <option>Saree</option><option>Suit</option><option>Kurti</option>
                </select>
                <input type="file" id="pFile">
                <button class="btn-main" onclick="publish()">Upload to App</button>
            </div>
        </div>
        <div class="data-card">
            <h3>Current Stock</h3>
            <table>
                <thead><tr><th>Image</th><th>Name</th><th>Category</th><th>Price</th><th>Stock</th><th>Action</th></tr></thead>
                <tbody id="inventoryList"></tbody>
            </table>
        </div>
    </div>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, set, push, onValue, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";
    import { getStorage, ref as sRef, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-storage.js";

    const firebaseConfig = { 
        databaseURL: "https://pdf-for-students-default-rtdb.firebaseio.com",
        storageBucket: "pdf-for-students.appspot.com" 
    };
    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);
    const storage = getStorage(app);

    window.showTab = (id) => {
        document.querySelectorAll('.tab-sec').forEach(t => t.style.display = 'none');
        document.getElementById(id + 'Tab').style.display = 'block';
        document.querySelectorAll('.nav-link').forEach(n => n.classList.remove('active'));
        event.currentTarget.classList.add('active');
    }

    window.publish = async () => {
        const file = document.getElementById('pFile').files[0];
        if(!file) return alert("Select Photo!");
        const imgRef = sRef(storage, 'shop/' + Date.now());
        await uploadBytes(imgRef, file);
        const url = await getDownloadURL(imgRef);

        push(ref(db, 'products'), {
            name: document.getElementById('pName').value,
            price: document.getElementById('pPrice').value,
            cat: document.getElementById('pCat').value,
            img: url,
            stock: 10
        });
        alert("Published!");
    }

    onValue(ref(db, 'products'), (snap) => {
        let html = ""; let count = 0;
        snap.forEach(c => {
            const p = c.val(); count++;
            html += `<tr>
                <td><img src="${p.img}" width="40" style="border-radius:4px"></td>
                <td><b>${p.name}</b></td>
                <td>${p.cat}</td>
                <td>₹${p.price}</td>
                <td><span class="badge badge-stock">In Stock (${p.stock})</span></td>
                <td><button onclick="deleteP('${c.key}')" style="border:none; color:red; cursor:pointer">Delete</button></td>
            </tr>`;
        });
        document.getElementById('inventoryList').innerHTML = html;
        document.getElementById('count-p').innerText = count;
    });

    window.deleteP = (id) => remove(ref(db, 'products/' + id));

    // Simple Chart
    new Chart(document.getElementById('salesChart'), {
        type: 'line',
        data: { labels: ['Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'], datasets: [{ label: 'Sales', data: [12, 19, 3, 5, 2, 3], borderColor: '#ff008a' }] }
    });
</script>
</body>
</html>
