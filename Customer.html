<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meesho - Kaushal Vastralaya</title>
    <style>
        body { font-family: sans-serif; margin: 0; background: #f8f8f8; }
        header { background: white; padding: 15px; position: sticky; top: 0; box-shadow: 0 2px 5px rgba(0,0,0,0.1); display: flex; justify-content: space-between; align-items: center; z-index: 10; }
        .logo { color: #ff008a; font-weight: bold; font-size: 20px; }
        .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; padding: 10px; }
        .p-card { background: white; border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; }
        .p-card img { width: 100%; height: 180px; object-fit: cover; }
        .p-info { padding: 10px; }
        .p-title { font-size: 14px; color: #444; margin: 0; height: 35px; overflow: hidden; }
        .p-price { color: #222; font-weight: bold; font-size: 18px; margin: 5px 0; }
        .free-del { color: #27ae60; font-size: 11px; font-weight: bold; background: #eef9f2; display: inline-block; padding: 2px 5px; }
        .buy-btn { width: 100%; background: #ff008a; color: white; border: none; padding: 10px; font-weight: bold; cursor: pointer; border-radius: 0 0 8px 8px; }
    </style>
</head>
<body>

<header>
    <div class="logo">M meesho</div>
    <div style="font-size: 12px; color: #666;">Kaushal Vastralaya 📦</div>
</header>

<div class="grid" id="catalog">
    </div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getFirestore, collection, onSnapshot } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

    const firebaseConfig = {
        apiKey: "AIzaSyAUtfZ-kMBHGozFOuyB6vuybegUDvAjORU",
        authDomain: "pdf-for-students.firebaseapp.com",
        projectId: "pdf-for-students",
        storageBucket: "pdf-for-students.firebasestorage.app",
        messagingSenderId: "282416295807",
        appId: "1:282416295807:web:a6113eef2b1e63d17bb44a"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);

    onSnapshot(collection(db, "items"), (snap) => {
        const items = snap.docs.map(d => d.data());
        document.getElementById('catalog').innerHTML = items.map(it => `
            <div class="p-card">
                <img src="${it.image || 'https://via.placeholder.com/150'}">
                <div class="p-info">
                    <p class="p-title">${it.name}</p>
                    <p class="p-price">₹${it.price}</p>
                    <span class="free-del">Free Delivery</span>
                </div>
                <button class="buy-btn" onclick="order('${it.name}', ${it.price})">Order on WhatsApp</button>
            </div>
        `).join('');
    });

    window.order = (name, price) => {
        const msg = encodeURIComponent(`Hi Kaushal Vastralaya, I want to buy:\nProduct: ${name}\nPrice: ₹${price}`);
        window.open(`https://wa.me/91XXXXXXXXXX?text=${msg}`); // Change number here
    }
</script>
</body>
</html>
