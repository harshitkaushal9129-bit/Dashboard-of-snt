<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SNT Attendance - Secure Portal</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-auth-compat.js"></script>
    <style>
        :root { --primary: #0f172a; --accent: #38bdf8; --success: #22c55e; --danger: #ef4444; }
        body { font-family: 'Segoe UI', sans-serif; background: #f1f5f9; margin: 0; padding: 10px; }
        .card { max-width: 500px; margin: auto; background: white; border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); overflow: hidden; }
        header { background: var(--primary); color: white; padding: 20px; text-align: center; border-bottom: 4px solid var(--accent); }
        .st-list { padding: 15px; }
        .st-row { display: flex; justify-content: space-between; align-items: center; padding: 12px; border-bottom: 1px solid #f1f5f9; }
        .btn-group { display: flex; gap: 5px; }
        .btn { border: none; padding: 8px 15px; border-radius: 6px; font-weight: 800; cursor: pointer; background: #e2e8f0; }
        .p-btn.active { background: var(--success) !important; color: white; }
        .a-btn.active { background: var(--danger) !important; color: white; }
        .save-btn { background: var(--primary); color: white; padding: 15px; border: none; border-radius: 12px; width: 90%; font-weight: bold; cursor: pointer; margin: 15px auto; display: block; }
        .holiday-banner { display: none; padding: 30px; text-align: center; background: #fffbeb; border: 2px dashed #f59e0b; margin: 15px; border-radius: 15px; }
        .hidden { display: none !important; }
        #status-bar { background: #1e293b; color: #94a3b8; font-size: 11px; padding: 8px; text-align: center; font-weight: bold; }
    </style>
</head>
<body>

<div id="status-bar">Verifying User...</div>

<div class="card">
    <header>
        <h2 style="margin:0;">SNT INSTITUTE</h2>
        <p id="role-text" style="font-size:12px; margin:5px 0; opacity:0.8;">Portal</p>
    </header>

    <div style="padding:15px; display:flex; justify-content:center; gap:5px; background:#f8fafc; border-bottom:1px solid #eee;">
        <select id="day"></select>
        <select id="month"></select>
        <select id="year"></select>
        <button onclick="checkData()" style="background:var(--accent); border:none; color:white; padding:0 10px; border-radius:5px; cursor:pointer;"><i class="fas fa-search"></i> Check</button>
    </div>

    <div id="holiday-view" class="holiday-banner">
        <h2 style="color:#f59e0b;">आज छुट्टी है!</h2>
        <p id="h-name" style="font-weight:bold;"></p>
    </div>

    <div id="main-view">
        <div id="st-list" class="st-list"></div>
        
        <div id="admin-panel" class="hidden" style="background:#f8fafc; padding:15px; border-top:1px solid #eee;">
            <input type="text" id="h-input" placeholder="Holiday name..." style="width:70%; padding:8px; border-radius:5px; border:1px solid #ddd;">
            <button onclick="setHoliday()" style="background:#f59e0b; color:white; border:none; padding:8px; border-radius:5px; cursor:pointer;">Set Holiday</button>
            <button class="save-btn" onclick="saveData()">SAVE ALL ATTENDANCE</button>
        </div>
    </div>
</div>

<script>
    const firebaseConfig = {
        apiKey: "AIzaSyAOQtM_XYLqPgxMK1XBdfl0m7KoAseZRCA",
        authDomain: "snt-computer-institute.firebaseapp.com",
        projectId: "snt-computer-institute",
        databaseURL: "https://snt-computer-institute-default-rtdb.firebaseio.com/",
        appId: "1:117580784781:web:73ba19d2d008beb3a5eec4"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const auth = firebase.auth();

    // Configuration
    const ADMIN_EMAIL = "harshitkaushal9129@gmail.com";
    let currentUserEmail = "";
    let dailyRecords = {};

    // UI Elements
    const dS = document.getElementById('day'), mS = document.getElementById('month'), yS = document.getElementById('year');
    
    // Setup Date Selectors
    for(let i=1; i<=31; i++) dS.innerHTML += `<option value="${i<10?'0'+i:i}">${i}</option>`;
    ["01","02","03","04","05","06","07","08","09","10","11","12"].forEach(m => mS.innerHTML += `<option value="${m}">${m}</option>`);
    for(let i=2025; i<=2026; i++) yS.innerHTML += `<option value="${i}">${i}</option>`;

    // Set Today
    const today = new Date();
    dS.value = String(today.getDate()).padStart(2,'0');
    mS.value = String(today.getMonth()+1).padStart(2,'0');
    yS.value = today.getFullYear();

    auth.onAuthStateChanged(user => {
        if(user) {
            currentUserEmail = user.email;
            document.getElementById('status-bar').innerText = "Logged in as: " + currentUserEmail;
            checkData();
        } else {
            window.location.href = "index.html";
        }
    });

    function checkData() {
        const dateKey = `${dS.value}-${mS.value}-${yS.value}`;
        db.ref('attendance/' + dateKey).on('value', snap => {
            const data = snap.val();
            if(data && data.type === 'HOLIDAY') {
                document.getElementById('holiday-view').style.display = "block";
                document.getElementById('main-view').style.display = (currentUserEmail === ADMIN_EMAIL) ? "block" : "none";
                document.getElementById('h-name').innerText = data.name;
                if(currentUserEmail === ADMIN_EMAIL) loadStudents(data);
            } else {
                document.getElementById('holiday-view').style.display = "none";
                document.getElementById('main-view').style.display = "block";
                loadStudents(data);
            }
        });
    }

    function loadStudents(existingData) {
        dailyRecords = (existingData && existingData.details) ? existingData.details : {};
        const isAdmin = (currentUserEmail === ADMIN_EMAIL);
        
        db.ref('students').once('value', snap => {
            const list = document.getElementById('st-list');
            list.innerHTML = "";
            let finalHtml = "";

            snap.forEach(child => {
                const s = child.val();
                const id = child.key;
                const status = dailyRecords[id] || "";

                if (isAdmin) {
                    // ADMIN VIEW: Sabka data dikhega buttons ke saath
                    finalHtml += `<div class="st-row">
                        <b>${s.name}</b>
                        <div class="btn-group">
                            <button id="p-${id}" class="btn ${status==='P'?'p-btn active':''}" onclick="mark('${id}','P')">P</button>
                            <button id="a-${id}" class="btn ${status==='A'?'a-btn active':''}" onclick="mark('${id}','A')">A</button>
                        </div>
                    </div>`;
                } else if (s.email === currentUserEmail) {
                    // STUDENT VIEW: Sirf apna data dikhega
                    const txt = status === 'P' ? 'PRESENT' : (status === 'A' ? 'ABSENT' : 'NOT MARKED');
                    const clr = status === 'P' ? 'var(--success)' : (status === 'A' ? 'var(--danger)' : '#64748b');
                    finalHtml = `<div style="padding:30px; border:2px solid var(--accent); border-radius:15px; text-align:center;">
                        <div style="font-size:12px; color:var(--accent); font-weight:bold;">YOUR ATTENDANCE REPORT</div>
                        <h2 style="margin:10px 0;">${s.name}</h2>
                        <div style="font-size:24px; font-weight:900; color:${clr}">${txt}</div>
                    </div>`;
                }
            });

            list.innerHTML = finalHtml || "<p style='text-align:center; padding:20px; color:red;'>No record found for your email.</p>";
            
            if(isAdmin) {
                document.getElementById('admin-panel').classList.remove('hidden');
                document.getElementById('role-text').innerText = "ADMIN CONTROL PANEL";
            }
        });
    }

    window.mark = (id, status) => {
        dailyRecords[id] = status;
        document.querySelectorAll(`[id^="p-${id}"], [id^="a-${id}"]`).forEach(b => b.classList.remove('active'));
        if(status === 'P') document.getElementById(`p-${id}`).classList.add('active');
        if(status === 'A') document.getElementById(`a-${id}`).classList.add('active');
    };

    window.saveData = () => {
        const dateKey = `${dS.value}-${mS.value}-${yS.value}`;
        db.ref('attendance/' + dateKey).set({ type: 'ATTENDANCE', details: dailyRecords })
          .then(() => alert("Data Saved Successfully! ✅"));
    };

    window.setHoliday = () => {
        const name = document.getElementById('h-input').value;
        if(!name) return alert("Enter Holiday Name");
        const dateKey = `${dS.value}-${mS.value}-${yS.value}`;
        db.ref('attendance/' + dateKey).set({ type: 'HOLIDAY', name: name });
    };
</script>
</body>
</html>
